<style>

/* ======================================================
   PAGE
====================================================== */

.adhkar-page {
  width: min(1180px, calc(100% - 24px));
  margin: auto;
  padding: 30px 0 70px;
}


/* ======================================================
   HERO
====================================================== */

.adhkar-hero {

  position: relative;

  overflow: hidden;

  padding: 42px;

  border-radius: 32px;

  color: white;

  background:

    radial-gradient(
      circle at 10% 10%,
      rgba(229,200,120,.18),
      transparent 25%
    ),

    radial-gradient(
      circle at 90% 90%,
      rgba(255,255,255,.06),
      transparent 30%
    ),

    linear-gradient(
      135deg,
      #062d25,
      #0d6650
    );

  box-shadow:
    0 30px 80px rgba(4,45,36,.20);

  margin-bottom: 25px;
}

.adhkar-hero h1 {

  margin: 0 0 8px;

  font-family: "Amiri", serif;

  font-size:
    clamp(34px, 6vw, 54px);
}

.adhkar-hero p {

  margin: 0;

  max-width: 700px;

  color:
    rgba(255,255,255,.74);

  line-height: 2;
}

.hero-ornament {

  position: absolute;

  left: -20px;
  bottom: -70px;

  width: 220px;
  height: 220px;

  border:
    1px solid rgba(229,200,120,.22);

  border-radius: 50%;
}


/* ======================================================
   CATEGORY GRID
====================================================== */

.category-grid {

  display: grid;

  grid-template-columns:
    repeat(auto-fit,minmax(190px,1fr));

  gap: 14px;

  margin-bottom: 30px;
}

.category {

  position: relative;

  padding: 20px;

  border-radius: 22px;

  background: white;

  border:
    1px solid var(--h-border);

  cursor: pointer;

  transition: var(--h-transition);

  box-shadow:
    0 10px 30px rgba(4,45,36,.06);
}

.category:hover {

  transform:
    translateY(-5px);

  box-shadow:
    0 20px 50px rgba(4,45,36,.11);
}

.category.active {

  color: white;

  background:
    linear-gradient(
      135deg,
      #0d6650,
      #083c31
    );

  border-color:
    rgba(229,200,120,.40);
}

.category-icon {

  width: 46px;
  height: 46px;

  display: grid;
  place-items: center;

  margin-bottom: 12px;

  border-radius: 15px;

  color: var(--h-gold-dark);

  background:
    rgba(201,164,76,.12);

  font-size: 22px;
}

.category.active
.category-icon {

  color:
    var(--h-gold-light);

  background:
    rgba(255,255,255,.10);
}

.category strong {

  display: block;

  font-size: 15px;
}

.category span {

  display: block;

  margin-top: 5px;

  color: var(--h-muted);

  font-size: 11px;
}

.category.active span {

  color:
    rgba(255,255,255,.65);
}


/* ======================================================
   PROGRESS
====================================================== */

.progress-card {

  padding: 18px;

  background: white;

  border:
    1px solid var(--h-border);

  border-radius: 20px;

  margin-bottom: 20px;
}

.progress-top {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 10px;
}

.progress-top strong {

  color: var(--h-green-900);
}

.progress-bar {

  height: 9px;

  overflow: hidden;

  border-radius: 99px;

  background: #edf1ed;
}

.progress-fill {

  height: 100%;

  width: 0%;

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      var(--h-gold),
      var(--h-green-700)
    );

  transition:
    width .35s ease;
}


/* ======================================================
   ACTIONS
====================================================== */

.section-actions {

  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin-bottom: 18px;
}


/* ======================================================
   DHIKR CARD
====================================================== */

.dhikr-list {

  display: grid;

  gap: 16px;
}

.dhikr {

  position: relative;

  padding: 25px;

  background:
    rgba(255,255,255,.92);

  border:
    1px solid var(--h-border);

  border-radius: 24px;

  box-shadow:
    0 12px 40px rgba(4,45,36,.07);

  transition:
    transform var(--h-transition),
    border-color var(--h-transition);
}

.dhikr.done {

  border-color:
    rgba(22,128,100,.35);

  background:
    linear-gradient(
      135deg,
      #f7fbf7,
      #fffdf7
    );
}

.dhikr.done::after {

  content: "✓";

  position: absolute;

  top: 18px;
  left: 18px;

  width: 30px;
  height: 30px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  color: white;

  background:
    var(--h-green-600);

  font-weight: 800;
}

.dhikr-number {

  display: inline-flex;

  align-items: center;

  gap: 7px;

  color: var(--h-gold-dark);

  font-size: 11px;

  font-weight: 800;

  margin-bottom: 12px;
}

.dhikr-text {

  font-family: "Amiri", serif;

  font-size:
    clamp(22px, 3vw, 30px);

  line-height: 2;

  color:
    #173b31;
}

.dhikr-source {

  margin-top: 15px;

  padding-top: 13px;

  border-top:
    1px solid var(--h-border);

  color:
    var(--h-muted);

  font-size: 11px;
}

.dhikr-bottom {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;

  margin-top: 18px;
}

.counter {

  display: flex;

  align-items: center;

  gap: 10px;
}

.counter-number {

  min-width: 55px;

  text-align: center;

  font-size: 17px;

  font-weight: 800;

  color:
    var(--h-green-900);
}

.counter button {

  width: 42px;
  height: 42px;

  border: 0;

  border-radius: 13px;

  color: white;

  background:
    var(--h-green-800);

  font-size: 18px;

  font-weight: 800;

  transition: var(--h-transition);
}

.counter button:hover {

  transform:
    translateY(-2px);

  background:
    var(--h-green-700);
}

.count-label {

  color: var(--h-muted);

  font-size: 11px;
}


/* ======================================================
   EMPTY
====================================================== */

.empty {

  padding: 40px 20px;

  text-align: center;

  color: var(--h-muted);
}


/* ======================================================
   RESPONSIVE
====================================================== */

@media(max-width:600px) {

  .adhkar-hero {

    padding: 30px 22px;

    border-radius: 24px;
  }

  .dhikr {

    padding: 20px;
  }

  .dhikr-bottom {

    align-items: stretch;

    flex-direction: column;
  }

  .counter {

    justify-content: center;
  }

}

</style>

/* ======================================================
   STATE
====================================================== */

let currentCategory =
  "morning";

let state =
  JSON.parse(
    localStorage.getItem(
      "hidayahAdhkar"
    ) || "{}"
  );


/* ======================================================
   CATEGORIES
====================================================== */

const categories =
  document.getElementById(
    "categories"
  );


function renderCategories() {

  categories.innerHTML =
    Object.entries(DATA)
      .map(([key, category]) => `

        <div
          class="category
          ${key === currentCategory ? "active" : ""}"
          onclick="selectCategory('${key}')"
        >

          <div class="category-icon">
            ${category.icon}
          </div>

          <strong>
            ${category.title}
          </strong>

          <span>
            ${category.subtitle}
          </span>

        </div>

      `)
      .join("");

}


/* ======================================================
   SELECT
====================================================== */

function selectCategory(key) {

  currentCategory = key;

  renderCategories();

  renderItems();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ======================================================
   STORAGE KEY
====================================================== */

function getKey(
  category,
  index
) {

  return `${category}_${index}`;

}


/* ======================================================
   GET COUNT
====================================================== */

function getCurrent(
  category,
  index
) {

  return Number(
    state[
      getKey(category,index)
    ] || 0
  );

}


/* ======================================================
   RENDER ITEMS
====================================================== */

function renderItems() {

  const category =
    DATA[currentCategory];

  document
    .getElementById("sectionTitle")
    .textContent =
    category.title;


  const list =
    document.getElementById(
      "dhikrList"
    );


  list.innerHTML =
    category.items
      .map((item,index) => {

        const current =
          getCurrent(
            currentCategory,
            index
          );

        const target =
          item.count;

        const done =
          target !== null &&
          current >= target;

        return `

          <article
            class="dhikr ${done ? "done" : ""}"
          >

            <div class="dhikr-number">

              <span>
                ${index + 1}
              </span>

              <span>
                الذكر ${index + 1}
              </span>

            </div>


            <div class="dhikr-text">

              ${item.text}

            </div>


            <div class="dhikr-source">

              ${item.source}

            </div>


            <div class="dhikr-bottom">

              <div>

                <div class="count-label">
                  ${target === null
                    ? "ذكر مطلق"
                    : `المطلوب: ${target} مرة`
                  }
                </div>

              </div>


              <div class="counter">

                <button
                  onclick="decrease(${index})"
                >
                  −
                </button>

                <div class="counter-number">

                  ${current}

                  ${
                    target === null
                    ? ""
                    : ` / ${target}`
                  }

                </div>

                <button
                  onclick="increase(${index})"
                >
                  +
                </button>

              </div>

            </div>

          </article>

        `;

      })
      .join("");


  updateProgress();

}


/* ======================================================
   INCREASE
====================================================== */

function increase(index) {

  const key =
    getKey(
      currentCategory,
      index
    );

  const item =
    DATA[currentCategory]
      .items[index];

  let value =
    Number(state[key] || 0);


  if (
    item.count !== null &&
    value >= item.count
  ) {

    return;
  }


  value++;

  state[key] = value;

  save();

  renderItems();

}


/* ======================================================
   DECREASE
====================================================== */

function decrease(index) {

  const key =
    getKey(
      currentCategory,
      index
    );

  let value =
    Number(state[key] || 0);

  value =
    Math.max(0,value - 1);

  state[key] = value;

  save();

  renderItems();

}


/* ======================================================
   PROGRESS
====================================================== */

function updateProgress() {

  const items =
    DATA[currentCategory].items;

  let done = 0;

  items.forEach(
    (item,index) => {

      if (
        item.count !== null &&
        getCurrent(
          currentCategory,
          index
        ) >= item.count
      ) {

        done++;

      }

    }
  );


  const total =
    items.filter(
      item =>
        item.count !== null
    ).length;


  const percent =
    total
      ? Math.round(
          done / total * 100
        )
      : 0;


  document
    .getElementById("progressText")
    .textContent =
    `${done} / ${total}`;


  document
    .getElementById("progressFill")
    .style.width =
    `${percent}%`;

}


/* ======================================================
   RESET
====================================================== */

function resetSection() {

  DATA[currentCategory]
    .items
    .forEach(
      (_,index) => {

        delete state[
          getKey(
            currentCategory,
            index
          )
        ];

      }
    );

  save();

  renderItems();

}


/* ======================================================
   COMPLETE
====================================================== */

function markAllDone() {

  DATA[currentCategory]
    .items
    .forEach(
      (item,index) => {

        if (
          item.count !== null
        ) {

          state[
            getKey(
              currentCategory,
              index
            )
          ] =
            item.count;

        }

      }
    );

  save();

  renderItems();

}


/* ======================================================
   SAVE
====================================================== */

function save() {

  localStorage.setItem(
    "hidayahAdhkar",
    JSON.stringify(state)
  );

}


/* ======================================================
   INIT
====================================================== */

renderCategories();

renderItems();

</script>
