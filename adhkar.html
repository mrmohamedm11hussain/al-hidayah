<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>الأذكار — الهداية</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap');

:root{
 --green:#123c2b;
 --green2:#1d6044;
 --gold:#c9a44c;
 --cream:#f8f4e8;
 --paper:#fffdf7;
 --text:#24352c;
 --muted:#718078;
 --border:#e7dfcc;
 --shadow:0 18px 55px rgba(25,55,40,.11);
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family:Cairo,Arial,sans-serif;
 color:var(--text);
 background:
 radial-gradient(circle at 10% 5%,rgba(201,164,76,.11),transparent 28%),
 radial-gradient(circle at 90% 15%,rgba(29,96,68,.08),transparent 28%),
 var(--cream);
}

button{font-family:inherit}

nav{
 position:sticky;
 top:0;
 z-index:100;
 background:rgba(18,60,43,.96);
 backdrop-filter:blur(18px);
}

.nav-inner{
 max-width:1250px;
 min-height:72px;
 margin:auto;
 padding:0 22px;
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.brand{
 color:white;
 text-decoration:none;
 font-size:23px;
 font-weight:800;
}

.brand span{color:#e3c66e}

.links{
 display:flex;
 gap:8px;
}

.links a{
 color:white;
 text-decoration:none;
 padding:9px 14px;
 border-radius:12px;
}

.links a:hover,
.links a.active{
 background:rgba(255,255,255,.12);
}

.hero{
 max-width:1250px;
 margin:35px auto 22px;
 padding:45px 28px;
 border-radius:30px;
 background:
 radial-gradient(circle at 15% 20%,rgba(201,164,76,.23),transparent 28%),
 linear-gradient(135deg,#103b2a,#1d6044);
 color:white;
 box-shadow:var(--shadow);
}

.hero h1{
 margin:0 0 8px;
 font-size:clamp(35px,6vw,60px);
}

.hero p{
 margin:0;
 color:#e9eadc;
}

.container{
 max-width:1250px;
 margin:auto;
 padding:0 22px 60px;
}

.progress-card{
 background:var(--paper);
 border:1px solid var(--border);
 border-radius:22px;
 padding:20px;
 box-shadow:var(--shadow);
 margin-bottom:20px;
}

.progress-top{
 display:flex;
 justify-content:space-between;
 gap:10px;
 margin-bottom:10px;
}

.progress{
 height:10px;
 background:#e9e4d5;
 border-radius:20px;
 overflow:hidden;
}

.progress span{
 display:block;
 height:100%;
 width:0%;
 background:linear-gradient(90deg,var(--green),var(--gold));
 transition:.35s;
}

.categories{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
 gap:10px;
 margin-bottom:22px;
}

.cat{
 border:1px solid var(--border);
 background:var(--paper);
 color:var(--green);
 border-radius:15px;
 padding:13px;
 cursor:pointer;
 font-weight:700;
 transition:.2s;
}

.cat:hover,
.cat.active{
 background:var(--green);
 color:white;
 transform:translateY(-2px);
}

.actions{
 display:flex;
 gap:10px;
 margin-bottom:20px;
 flex-wrap:wrap;
}

.reset{
 border:0;
 background:#9b3b35;
 color:white;
 padding:11px 17px;
 border-radius:13px;
 cursor:pointer;
 font-weight:700;
}

.section-title{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin:20px 0;
}

.section-title h2{
 margin:0;
 color:var(--green);
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:18px;
}

.card{
 background:var(--paper);
 border:1px solid var(--border);
 border-radius:24px;
 padding:24px;
 box-shadow:var(--shadow);
 transition:.25s;
 position:relative;
 overflow:hidden;
}

.card:hover{
 transform:translateY(-4px);
}

.card.completed{
 border-color:#78a98f;
 background:#f1f8f2;
}

.card.completed:after{
 content:"✓";
 position:absolute;
 top:15px;
 left:15px;
 width:36px;
 height:36px;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 background:var(--green);
 color:white;
 font-weight:800;
}

.badge{
 display:inline-block;
 background:#eee7d5;
 color:#806a34;
 padding:5px 10px;
 border-radius:30px;
 font-size:12px;
 font-weight:700;
 margin-bottom:15px;
}

.text{
 font-family:Amiri,serif;
 font-size:27px;
 line-height:2.15;
 color:#1d3328;
}

.source{
 margin-top:15px;
 color:var(--muted);
 font-size:13px;
 line-height:1.8;
}

.counter{
 margin-top:20px;
 display:flex;
 align-items:center;
 gap:15px;
}

.count{
 min-width:92px;
 text-align:center;
 background:#eee8d7;
 color:var(--green);
 padding:12px 10px;
 border-radius:14px;
 font-weight:800;
}

.count.done{
 background:var(--green);
 color:white;
}

.tap{
 flex:1;
 border:0;
 background:var(--green);
 color:white;
 padding:14px;
 border-radius:14px;
 cursor:pointer;
 font-weight:800;
 font-size:16px;
 transition:.2s;
}

.tap:hover{
 background:var(--green2);
 transform:scale(1.01);
}

.tap:disabled{
 cursor:default;
 background:#78a98f;
}

.empty{
 background:var(--paper);
 border:1px solid var(--border);
 border-radius:22px;
 padding:35px;
 text-align:center;
 color:var(--muted);
}

footer{
 background:#0d2d21;
 color:#ddd8c8;
 text-align:center;
 padding:30px 20px;
}

@media(max-width:800px){
 .grid{grid-template-columns:1fr}
}

@media(max-width:600px){
 .links{display:none}
 .hero{margin:15px 12px;padding:35px 20px}
 .container{padding:0 12px 40px}
 .text{font-size:24px}
 .counter{flex-direction:column;align-items:stretch}
 .count{width:100%}
}
</style>
</head>

</main>

const categories = document.getElementById("categories");
const cards = document.getElementById("cards");
const title = document.getElementById("sectionTitle");
const progressNumber = document.getElementById("progressNumber");
const progressBar = document.getElementById("progressBar");

let current = "morning";

const categoryKeys = Object.keys(DATA);

categoryKeys.forEach(key=>{

 const btn = document.createElement("button");

 btn.className = "cat";

 btn.textContent =
   DATA[key].icon + " " + DATA[key].title;

 btn.onclick = ()=>{
   current = key;

   document.querySelectorAll(".cat")
     .forEach(x=>x.classList.remove("active"));

   btn.classList.add("active");

   render();
 };

 categories.appendChild(btn);
});

categories.children[0].classList.add("active");

function storageKey(){
 return "hidayah_adhkar_" + current;
}

function getState(){
 try{
   return JSON.parse(
     localStorage.getItem(storageKey())
   ) || {};
 }catch{
   return {};
 }
}

function saveState(state){
 localStorage.setItem(
   storageKey(),
   JSON.stringify(state)
 );
}

function render(){

 const section = DATA[current];

 title.textContent =
   section.icon + " " + section.title;

 const state = getState();

 cards.innerHTML = "";

 section.items.forEach((item,index)=>{

   const count = Math.min(
     Number(state[index] || 0),
     item.count
   );

   const done = count >= item.count;

   const card = document.createElement("article");

   card.className =
     "card" + (done ? " completed" : "");

   card.innerHTML = `
     <span class="badge">
       التكرار: ${item.count} مرة
     </span>

     <div class="text">
       ${item.text}
     </div>

     <div class="source">
       📚 ${item.source}
     </div>

     <div class="counter">

       <div class="count ${done ? "done" : ""}">
         ${done ? "✓ تم" : `${count} / ${item.count}`}
       </div>

       <button
         class="tap"
         ${done ? "disabled" : ""}
       >
         ${done ? "اكتمل الذكر ✓" : "اضغط للذكر"}
       </button>

     </div>
   `;

   const button = card.querySelector(".tap");

   button.onclick = ()=>{

     const newState = getState();

     const next =
       Math.min(
         Number(newState[index] || 0) + 1,
         item.count
       );

     newState[index] = next;

     saveState(newState);

     render();
   };

   cards.appendChild(card);

 });

 updateProgress();

 window.scrollTo({
   top:0,
   behavior:"smooth"
 });
}

function updateProgress(){

 const section = DATA[current];
 const state = getState();

 let currentTotal = 0;
 let maximum = 0;

 section.items.forEach((item,index)=>{
   currentTotal += Math.min(
     Number(state[index] || 0),
     item.count
   );

   maximum += item.count;
 });

 const percent =
   maximum ? (currentTotal / maximum) * 100 : 0;

 progressNumber.textContent =
   `${currentTotal} / ${maximum}`;

 progressBar.style.width =
   percent + "%";
}

document.getElementById("reset").onclick = ()=>{

 const ok = confirm(
   "هل تريد إعادة عدادات هذا القسم إلى الصفر؟"
 );

 if(!ok) return;

 localStorage.removeItem(storageKey());

 render();
};

render();

</script>
