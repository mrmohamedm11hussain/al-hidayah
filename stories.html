<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#073b2a">
<title>قصص إسلامية | الهداية</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{
  --green:#073b2a;
  --green2:#0b5940;
  --gold:#caa85e;
  --gold2:#e4c983;
  --cream:#f8f3e7;
  --white:#fffdf8;
  --text:#18352c;
  --muted:#6b7d74;
  --line:#e8dfca;
  --shadow:0 18px 50px rgba(7,59,42,.10);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Cairo",Arial,sans-serif;
  background:
    radial-gradient(circle at 8% 5%,rgba(202,168,94,.13),transparent 25%),
    radial-gradient(circle at 90% 20%,rgba(11,89,64,.08),transparent 28%),
    var(--cream);
  color:var(--text);
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,59,42,.96);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(228,201,131,.18);
}

.nav{
  max-width:1250px;
  min-height:76px;
  margin:auto;
  padding:12px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:white;
}

.logo{
  width:46px;
  height:46px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#124e3a,#062e22);
  border:1px solid rgba(228,201,131,.45);
  color:var(--gold2);
  font-family:"Amiri",serif;
  font-size:29px;
}

.brand strong{
  display:block;
  font-size:18px;
}

.brand span{
  display:block;
  color:#cbdcd4;
  font-size:11px;
}

.nav-links{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.nav-links a{
  color:#e7f0eb;
  padding:9px 13px;
  border-radius:12px;
  font-size:13px;
  text-decoration:none;
  transition:.25s;
}

.nav-links a:hover,
.nav-links a.active{
  color:var(--gold2);
  background:rgba(202,168,94,.14);
}

.hero{
  max-width:1250px;
  margin:auto;
  padding:55px 22px 30px;
}

.hero-box{
  min-height:300px;
  border-radius:32px;
  padding:42px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 80% 25%,rgba(228,201,131,.16),transparent 22%),
    linear-gradient(135deg,#0b6045,#052d21);
  box-shadow:var(--shadow);
  color:white;
}

.hero-box::before,
.hero-box::after{
  content:"";
  position:absolute;
  border:1px solid rgba(228,201,131,.15);
  border-radius:50%;
}

.hero-box::before{
  width:310px;
  height:310px;
  left:-100px;
  bottom:-160px;
}

.hero-box::after{
  width:430px;
  height:430px;
  right:-160px;
  top:-220px;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:700px;
}

.eyebrow{
  color:var(--gold2);
  font-size:13px;
  font-weight:800;
  margin-bottom:10px;
}

.hero h1{
  font-family:"Amiri",serif;
  font-size:clamp(40px,6vw,65px);
  line-height:1.1;
}

.hero p{
  color:#d4e1db;
  line-height:2;
  font-size:14px;
  margin-top:14px;
}

.ornament{
  position:absolute;
  left:70px;
  top:50%;
  transform:translateY(-50%);
  width:150px;
  height:150px;
  border:1px solid rgba(228,201,131,.25);
  border-radius:50%;
  display:grid;
  place-items:center;
  z-index:1;
}

.ornament::before{
  content:"✦";
  color:var(--gold2);
  font-size:75px;
}

.tools{
  max-width:1250px;
  margin:auto;
  padding:0 22px 25px;
}

.search{
  height:58px;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:18px;
  padding:0 20px;
  box-shadow:0 8px 25px rgba(7,59,42,.05);
}

.search input{
  width:100%;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-family:inherit;
  font-size:14px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px 0 2px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:var(--white);
  color:var(--green);
  border-radius:999px;
  padding:9px 16px;
  font-family:inherit;
  font-size:12px;
  cursor:pointer;
  transition:.2s;
}

.category.active,
.category:hover{
  background:var(--green);
  border-color:var(--green);
  color:white;
}

.main{
  max-width:1250px;
  margin:auto;
  padding:0 22px 75px;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:15px;
  margin:8px 0 20px;
}

.section-head h2{
  color:var(--green);
  font-size:24px;
}

.section-head p{
  color:var(--muted);
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.card{
  background:rgba(255,253,248,.94);
  border:1px solid var(--line);
  border-radius:23px;
  padding:20px;
  box-shadow:0 10px 30px rgba(7,59,42,.06);
  transition:.28s;
  display:flex;
  flex-direction:column;
  min-height:300px;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 18px 40px rgba(7,59,42,.12);
  border-color:#d9c48d;
}

.card-icon{
  width:56px;
  height:56px;
  border-radius:17px;
  background:#edf3ef;
  color:#9a7739;
  display:grid;
  place-items:center;
  font-size:25px;
  margin-bottom:17px;
}

.card h3{
  color:var(--green);
  font-family:"Amiri",serif;
  font-size:27px;
}

.card .subtitle{
  color:#a17d38;
  font-size:11px;
  margin-top:2px;
}

.card p{
  color:var(--muted);
  line-height:1.9;
  font-size:12px;
  margin:12px 0 18px;
  flex:1;
}

.card-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.tag{
  color:#8e743d;
  background:#f3eddd;
  border-radius:999px;
  padding:6px 10px;
  font-size:10px;
}

.read{
  text-decoration:none;
  background:var(--green);
  color:white;
  border-radius:12px;
  padding:9px 13px;
  font-size:11px;
  transition:.2s;
}

.read:hover{
  background:#0d674a;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
  background:var(--white);
  border:1px solid var(--line);
  border-radius:23px;
}

.footer{
  background:var(--green);
  color:#cbdcd4;
  text-align:center;
  padding:30px 20px;
  font-size:11px;
  line-height:2;
}

.footer strong{
  color:var(--gold2);
}

@media(max-width:950px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .ornament{
    opacity:.35;
  }
}

@media(max-width:650px){
  .nav{
    min-height:68px;
    padding:9px 14px;
  }

  .nav-links{
    display:none;
  }

  .hero,
  .tools,
  .main{
    padding-left:16px;
    padding-right:16px;
  }

  .hero-box{
    padding:30px 23px;
    min-height:260px;
  }

  .hero h1{
    font-size:43px;
  }

  .ornament{
    left:-50px;
    opacity:.22;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .section-head{
    align-items:start;
    flex-direction:column;
  }
}
</style></head><body><header class="header">
<nav class="nav"><a href="index.html" class="brand">
  <div class="logo">هـ</div>
  <div>
    <strong>الهداية</strong>
    <span>نور يهديك</span>
  </div>
</a><div class="nav-links">
  <a href="index.html">الرئيسية</a>
  <a href="quran.html">القرآن</a>
  <a href="adhkar.html">الأذكار</a>
  <a href="stories.html" class="active">القصص</a>
  <a href="prayer.html">الصلاة</a>
  <a href="tasbeeh.html">التسبيح</a>
</div></nav>
</header><section class="hero"><div class="hero-box"><div class="hero-content"><div class="eyebrow">قصص من القرآن والسيرة</div><h1>قصص تهدي القلب</h1><p>
رحلة بين قصص الأنبياء والصالحين، نتعلم منها الإيمان والصبر
والثبات وحسن التوكل على الله.
</p></div><div class="ornament"></div></div></section><section class="tools"><div class="search">
  <input
    id="searchInput"
    type="search"
    placeholder="ابحث عن قصة..."
  >
</div><div class="categories"><button class="category active" data-category="all">
  الكل
</button><button class="category" data-category="prophets">
  الأنبياء
</button><button class="category" data-category="quran">
  من القرآن
</button><button class="category" data-category="seerah">
  السيرة
</button></div></section><main class="main"><div class="section-head">
  <div>
    <h2>مكتبة القصص</h2>
    <p id="countText">جاري تحميل القصص...</p>
  </div>
</div><div class="grid" id="storiesGrid"></div></main><footer class="footer">
  <strong>الهداية</strong> — نور يهديك
  <br>
  تطوير وبرمجة M11 — Mr. Mohamed Hussain
</footer><script>

const stories=[

{
 id:"adam",
 title:"آدم عليه السلام",
 subtitle:"بداية خلق الإنسان",
 category:"prophets",
 tag:"نبي",
 icon:"☘",
 description:"قصة خلق آدم عليه السلام، وسجود الملائكة، وإبليس، وبداية حياة الإنسان.",
},

{
 id:"nuh",
 title:"نوح عليه السلام",
 subtitle:"الصبر والثبات",
 category:"prophets",
 tag:"نبي",
 icon:"◈",
 description:"قصة نوح عليه السلام ودعوته الطويلة لقومه وثباته على طاعة الله.",
},

{
 id:"ibrahim",
 title:"إبراهيم عليه السلام",
 subtitle:"الخليل والثبات على التوحيد",
 category:"prophets",
 tag:"نبي",
 icon:"✦",
 description:"قصة إبراهيم عليه السلام في دعوته إلى التوحيد وثقته بالله.",
},

{
 id:"musa",
 title:"موسى عليه السلام",
 subtitle:"مواجهة فرعون",
 category:"prophets",
 tag:"نبي",
 icon:"⌁",
 description:"قصة موسى عليه السلام ورسالته إلى فرعون وما فيها من صبر وثبات.",
},

{
 id:"yunus",
 title:"يونس عليه السلام",
 subtitle:"التوبة والرجوع إلى الله",
 category:"prophets",
 tag:"نبي",
 icon:"≈",
 description:"قصة يونس عليه السلام وما نتعلمه منها عن التوبة والدعاء والرجوع إلى الله.",
},

{
 id:"sulaiman",
 title:"سليمان عليه السلام",
 subtitle:"الملك والشكر",
 category:"prophets",
 tag:"نبي",
 icon:"♢",
 description:"قصة سليمان عليه السلام وما آتاه الله من الملك والحكمة، وما فيها من معاني الشكر.",
},

{
 id:"salih",
 title:"صالح عليه السلام",
 subtitle:"الناقة وثمود",
 category:"prophets",
 tag:"نبي",
 icon:"◇",
 description:"قصة صالح عليه السلام مع قوم ثمود ودعوته لهم إلى عبادة الله وحده.",
},

{
 id:"ayyub",
 title:"أيوب عليه السلام",
 subtitle:"الصبر عند البلاء",
 category:"prophets",
 tag:"نبي",
 icon:"✧",
 description:"قصة أيوب عليه السلام وما فيها من الصبر واللجوء إلى الله وحسن الظن به.",
},

{
 id:"shuaib",
 title:"شعيب عليه السلام",
 subtitle:"العدل والأمانة",
 category:"prophets",
 tag:"نبي",
 icon:"⌘",
 description:"قصة شعيب عليه السلام مع قومه ودعوته إلى التوحيد والعدل في التعامل.",
},

{
 id:"hud",
 title:"هود عليه السلام",
 subtitle:"قوم عاد",
 category:"prophets",
 tag:"نبي",
 icon:"◌",
 description:"قصة هود عليه السلام مع قوم عاد ودعوته لهم إلى عبادة الله وترك الكبر.",
},

{
 id:"kahf",
 title:"أصحاب الكهف",
 subtitle:"الثبات على الإيمان",
 category:"quran",
 tag:"من القرآن",
 icon:"◉",
 description:"قصة الفتية الذين آمنوا بربهم وثبتوا على إيمانهم كما وردت في سورة الكهف.",
},

{
 id:"hira",
 title:"بداية الوحي",
 subtitle:"غار حراء",
 category:"seerah",
 tag:"السيرة",
 icon:"☾",
 description:"قصة بداية نزول الوحي على النبي محمد ﷺ في غار حراء وبداية الرسالة.",
}

];

const grid=document.getElementById("storiesGrid");
const searchInput=document.getElementById("searchInput");
const countText=document.getElementById("countText");
const categoryButtons=document.querySelectorAll(".category");

let activeCategory="all";

function escapeHTML(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function render(){

  const query=searchInput.value.trim().toLowerCase();

  const filtered=stories.filter(story=>{

    const categoryMatch=
      activeCategory==="all" ||
      story.category===activeCategory;

    const searchMatch=
      !query ||
      story.title.toLowerCase().includes(query) ||
      story.subtitle.toLowerCase().includes(query) ||
      story.description.toLowerCase().includes(query);

    return categoryMatch && searchMatch;

  });

  countText.textContent=
    `${filtered.length} ${filtered.length===1?"قصة":"قصص"}`;

  if(!filtered.length){

    grid.innerHTML=`
      <div class="empty">
        لا توجد قصة مطابقة للبحث الحالي.
      </div>
    `;

    return;
  }

  grid.innerHTML=filtered.map(story=>`

    <article class="card">

      <div class="card-icon">
        ${story.icon}
      </div>

      <h3>
        ${escapeHTML(story.title)}
      </h3>

      <div class="subtitle">
        ${escapeHTML(story.subtitle)}
      </div>

      <p>
        ${escapeHTML(story.description)}
      </p>

      <div class="card-footer">

        <span class="tag">
          ${escapeHTML(story.tag)}
        </span>

        <a
          class="read"
          href="story.html?id=${encodeURIComponent(story.id)}"
        >
          اقرأ القصة
        </a>

      </div>

    </article>

  `).join("");

}

categoryButtons.forEach(button=>{

  button.addEventListener("click",()=>{

    categoryButtons.forEach(item=>{
      item.classList.remove("active");
    });

    button.classList.add("active");

    activeCategory=button.dataset.category;

    render();

  });

});

searchInput.addEventListener("input",render);

render();

</script></body>
</html>
