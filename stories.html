<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>القصص — الهداية</title>
  <meta name="description" content="قصص الأنبياء والسيرة النبوية في منصة الهداية">

  <style>
    :root{
      --green:#0b3d2e;
      --green2:#145c45;
      --gold:#c9a227;
      --gold2:#e5c75b;
      --cream:#f7f3e8;
      --white:#fff;
      --text:#17362b;
      --muted:#708078;
      --line:rgba(11,61,46,.10);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Tahoma,Arial,sans-serif;
      background:
        radial-gradient(circle at 10% 10%,rgba(201,162,39,.09),transparent 25%),
        var(--cream);
      color:var(--text);
      min-height:100vh;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    header{
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(247,243,232,.90);
      backdrop-filter:blur(18px);
      border-bottom:1px solid var(--line);
    }

    .nav{
      max-width:1250px;
      min-height:74px;
      margin:auto;
      padding:0 22px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:11px;
      font-weight:900;
      color:var(--green);
    }

    .logo{
      width:46px;
      height:46px;
      border-radius:15px;
      background:linear-gradient(145deg,#145c45,#082c22);
      color:#e5c75b;
      display:grid;
      place-items:center;
      font-size:24px;
    }

    .links{
      display:flex;
      gap:5px;
    }

    .links a{
      padding:10px 13px;
      border-radius:12px;
      color:#466056;
      font-weight:700;
      font-size:14px;
    }

    .links a:hover{
      background:#e9e3d2;
    }

    .container{
      max-width:1250px;
      margin:auto;
      padding:45px 22px 90px;
    }

    .heading{
      padding:35px;
      border-radius:30px;
      color:white;
      background:
        radial-gradient(circle at 80% 20%,rgba(229,199,91,.18),transparent 25%),
        linear-gradient(135deg,#082c22,#0e513b);
      box-shadow:0 25px 60px rgba(11,61,46,.18);
      position:relative;
      overflow:hidden;
    }

    .heading:after{
      content:"✦";
      position:absolute;
      left:50px;
      top:20px;
      font-size:130px;
      color:rgba(229,199,91,.06);
      transform:rotate(15deg);
    }

    .heading small{
      color:#e5c75b;
      font-weight:900;
    }

    .heading h1{
      font-size:clamp(35px,5vw,58px);
      margin:10px 0;
    }

    .heading p{
      color:rgba(255,255,255,.72);
      line-height:1.9;
      max-width:700px;
    }

    .tools{
      margin-top:25px;
      display:flex;
      flex-wrap:wrap;
      gap:12px;
    }

    .search{
      flex:1;
      min-width:240px;
      height:52px;
      border:1px solid var(--line);
      border-radius:16px;
      padding:0 18px;
      background:white;
      color:var(--text);
      outline:none;
      font-family:inherit;
      box-shadow:0 8px 25px rgba(11,61,46,.05);
    }

    .search:focus{
      border-color:rgba(201,162,39,.55);
      box-shadow:0 0 0 4px rgba(201,162,39,.08);
    }

    .filters{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .filter{
      height:52px;
      border:1px solid var(--line);
      background:white;
      border-radius:15px;
      padding:0 17px;
      color:#456055;
      font-weight:800;
      cursor:pointer;
      font-family:inherit;
      transition:.22s;
    }

    .filter.active,
    .filter:hover{
      background:var(--green);
      color:white;
      border-color:var(--green);
      transform:translateY(-2px);
    }

    .section-title{
      margin:55px 0 22px;
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:15px;
    }

    .section-title h2{
      color:var(--green);
      font-size:28px;
    }

    .count{
      color:var(--muted);
      font-size:13px;
    }

    .stories{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }

    .story-card{
      background:white;
      border:1px solid var(--line);
      border-radius:25px;
      padding:24px;
      min-height:230px;
      box-shadow:0 12px 40px rgba(11,61,46,.06);
      transition:.3s;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    .story-card:hover{
      transform:translateY(-8px);
      box-shadow:0 25px 55px rgba(11,61,46,.13);
    }

    .story-card:after{
      content:"";
      position:absolute;
      left:-45px;
      bottom:-60px;
      width:150px;
      height:150px;
      border-radius:50%;
      background:#e5c75b;
      opacity:.07;
    }

    .badge{
      display:inline-flex;
      width:max-content;
      padding:7px 11px;
      border-radius:999px;
      background:#edf3ee;
      color:var(--green2);
      font-size:11px;
      font-weight:900;
      margin-bottom:15px;
    }

    .story-card h3{
      font-size:22px;
      color:var(--green);
      margin-bottom:9px;
    }

    .story-card p{
      color:var(--muted);
      line-height:1.8;
      font-size:14px;
      flex:1;
    }

    .read{
      margin-top:18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      color:#987719;
      font-weight:900;
      font-size:13px;
    }

    .empty{
      display:none;
      padding:45px;
      background:white;
      border-radius:22px;
      text-align:center;
      color:var(--muted);
      border:1px solid var(--line);
    }

    footer{
      background:#082c22;
      color:white;
      text-align:center;
      padding:35px 20px;
    }

    footer strong{
      color:#e5c75b;
    }

    footer p{
      color:rgba(255,255,255,.60);
      margin-top:8px;
      font-size:13px;
    }

    @media(max-width:900px){
      .stories{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:620px){
      .links{
        display:none;
      }

      .container{
        padding-top:25px;
      }

      .heading{
        padding:28px 22px;
      }

      .stories{
        grid-template-columns:1fr;
      }

      .section-title h2{
        font-size:24px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">

    <a class="brand" href="index.html">

      <span>الهداية</span>
    </a>

    <nav class="links">
      <a href="index.html">الرئيسية</a>
      <a href="quran.html">القرآن</a>
      <a href="adhkar.html">الأذكار</a>
      <a href="prayer.html">الصلاة</a>
      <a href="tasbeeh.html">التسبيح</a>
    </nav>

  </div>
</header>

<main class="container">

  <section class="heading">
    <small>مكتبة الهداية</small>
    <h1>قصص وعبر</h1>
    <p>
      قصص الأنبياء وما ثبت من أحداث السيرة النبوية،
      مرتبة في مكتبة واحدة ليسهل الوصول إليها والقراءة منها.
    </p>
  </section>

  <section class="tools">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="ابحث عن قصة..."
      autocomplete="off"
    >

    <div class="filters">
      <button class="filter active" data-filter="all">الكل</button>
      <button class="filter" data-filter="prophets">الأنبياء</button>
      <button class="filter" data-filter="quran">قصص القرآن</button>
      <button class="filter" data-filter="seerah">السيرة</button>
    </div>

  </section>

  <section class="section-title">
    <h2>مكتبة القصص</h2>
    <span id="count" class="count"></span>
  </section>

  <section id="stories" class="stories"></section>

  <div id="empty" class="empty">
    لا توجد قصة مطابقة للبحث.
  </div>

</main>

<footer>
  <strong>الهداية — نور يهديك</strong>
  <p>تطوير وبرمجة M11 — Mr. Mohamed Hussain © 2026</p>
</footer>

const container = document.getElementById("stories");
const search = document.getElementById("search");
const count = document.getElementById("count");
const empty = document.getElementById("empty");

let currentFilter = "all";

function render(){

  const term = search.value.trim().toLowerCase();

  const filtered = stories.filter(item => {

    const matchesCategory =
      currentFilter === "all" ||
      item.category === currentFilter;

    const text =
      (item.title + " " + item.description + " " + item.categoryName)
      .toLowerCase();

    const matchesSearch =
      !term || text.includes(term);

    return matchesCategory && matchesSearch;
  });

  container.innerHTML = filtered.map(item => `
    <a class="story-card"
       href="story.html?id=${encodeURIComponent(item.id)}">

      <span class="badge">${item.categoryName}</span>

      <h3>${item.title}</h3>

      <p>${item.description}</p>

      <div class="read">
        <span>اقرأ القصة</span>
        <span>←</span>
      </div>

    </a>
  `).join("");

  count.textContent = `${filtered.length} قصة`;

  empty.style.display =
    filtered.length === 0 ? "block" : "none";
}

document.querySelectorAll(".filter").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".filter")
      .forEach(x => x.classList.remove("active"));

    button.classList.add("active");

    currentFilter = button.dataset.filter;

    render();
  });

});

search.addEventListener("input", render);

render();
</script>
