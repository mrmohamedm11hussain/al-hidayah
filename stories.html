<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>القصص — الهداية</title>

<style>

:root{
  --green:#0b3d2e;
  --green2:#145c45;
  --gold:#c9a227;
  --gold2:#e5c75b;
  --cream:#f7f3e8;
  --text:#17382d;
  --muted:#718078;
  --line:rgba(11,61,46,.10);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 5%,rgba(201,162,39,.10),transparent 25%),
    var(--cream);
}

a{
  text-decoration:none;
  color:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(247,243,232,.9);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.nav{
  max-width:1250px;
  min-height:74px;
  margin:auto;
  padding:0 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--green);
  font-weight:900;
}

.logo{
  width:46px;
  height:46px;
  border-radius:15px;
  background:linear-gradient(145deg,#145c45,#082c22);
  color:var(--gold2);
  display:grid;
  place-items:center;
  font-size:24px;
}

.links{
  display:flex;
  gap:5px;
}

.links a{
  padding:10px 13px;
  border-radius:12px;
  font-size:13px;
  font-weight:800;
  color:#466056;
}

.links a:hover{
  background:#e9e2cf;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:42px 22px 90px;
}

.hero{
  position:relative;
  overflow:hidden;
  border-radius:32px;
  padding:40px;
  color:white;
  background:
    radial-gradient(circle at 85% 15%,rgba(229,199,91,.15),transparent 25%),
    linear-gradient(135deg,#082c22,#145c45);
  box-shadow:0 25px 70px rgba(11,61,46,.15);
}

.hero small{
  color:var(--gold2);
  font-weight:900;
}

.hero h1{
  margin:10px 0;
  font-size:clamp(40px,7vw,65px);
}

.hero p{
  max-width:720px;
  color:rgba(255,255,255,.70);
  line-height:2;
}

.search{
  margin-top:25px;
  width:100%;
  height:54px;
  border-radius:16px;
  border:1px solid var(--line);
  background:white;
  padding:0 18px;
  font-family:inherit;
  outline:none;
  color:var(--text);
}

.filters{
  margin:28px 0;
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.filter{
  border:1px solid var(--line);
  background:white;
  color:var(--green);
  padding:11px 15px;
  border-radius:13px;
  font-family:inherit;
  font-weight:900;
}

.filter.active{
  color:white;
  background:var(--green);
  border-color:var(--green);
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.story-card{
  position:relative;
  overflow:hidden;
  min-height:265px;
  display:flex;
  flex-direction:column;
  background:white;
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  box-shadow:0 10px 35px rgba(11,61,46,.055);
  transition:.28s;
}

.story-card:hover{
  transform:translateY(-7px);
  box-shadow:0 22px 55px rgba(11,61,46,.12);
}

.story-card:after{
  content:"";
  position:absolute;
  left:-35px;
  bottom:-40px;
  width:120px;
  height:120px;
  border-radius:50%;
  background:rgba(201,162,39,.07);
}

.card-icon{
  width:55px;
  height:55px;
  border-radius:18px;
  background:#edf3ee;
  display:grid;
  place-items:center;
  font-size:25px;
  margin-bottom:17px;
}

.badge{
  display:inline-flex;
  align-self:flex-start;
  padding:6px 9px;
  border-radius:999px;
  background:#f4f0e3;
  color:#947719;
  font-size:10px;
  font-weight:900;
}

.story-card h2{
  margin:10px 0 7px;
  color:var(--green);
  font-size:19px;
}

.story-card p{
  color:var(--muted);
  font-size:12px;
  line-height:1.9;
}

.open{
  margin-top:auto;
  padding-top:20px;
  color:#947719;
  font-size:12px;
  font-weight:900;
}

.empty{
  display:none;
  text-align:center;
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  padding:45px;
  color:var(--muted);
}

footer{
  background:#06271e;
  color:white;
  text-align:center;
  padding:38px 20px;
}

footer strong{
  color:var(--gold2);
}

footer p{
  margin-top:7px;
  color:rgba(255,255,255,.55);
  font-size:12px;
}

@media(max-width:1000px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:750px){

  .links{
    display:none;
  }

  .hero{
    padding:30px 22px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:470px){

  .grid{
    grid-template-columns:1fr;
  }

  .story-card{
    min-height:220px;
  }

}

</style>
</head>

<body>

<header>

<div class="nav">

<a href="index.html" class="brand">

<div class="logo">هـ</div>

<span>الهداية</span>

</a>

<nav class="links">

<a href="index.html">الرئيسية</a>
<a href="quran.html">القرآن</a>
<a href="adhkar.html">الأذكار</a>
<a href="prayer.html">الصلاة</a>
<a href="tasbeeh.html">التسبيح</a>

</nav>

</div>

</header>


<main class="container">

<section class="hero">

<small>اقرأ وتعلّم</small>

<h1>القصص</h1>

<p>
قصص الأنبياء والسيرة النبوية في صفحات مستقلة،
مع الآيات المرتبطة بالقصة والدروس المستفادة والمصادر.
</p>

</section>


<input
id="search"
class="search"
placeholder="ابحث عن قصة..."
autocomplete="off"
>


<div class="filters">

<button class="filter active" data-filter="all">
الكل
</button>

<button class="filter" data-filter="prophets">
الأنبياء
</button>

<button class="filter" data-filter="quran">
قصص القرآن
</button>

<button class="filter" data-filter="seerah">
السيرة النبوية
</button>

</div>


<div id="grid" class="grid"></div>

<div id="empty" class="empty">
لم نجد قصة بهذا الاسم.
</div>

</main>


<footer>

<strong>الهداية — نور يهديك</strong>

<p>
تطوير وبرمجة M11 — Mr. Mohamed Hussain © 2026
</p>

</footer>


<script>

const stories=[

["adam","آدم عليه السلام","prophets","قصة آدم عليه السلام وبداية خلق الإنسان.","👤"],

["idris","إدريس عليه السلام","prophets","قصة نبي الله إدريس عليه السلام.","📜"],

["nuh","نوح عليه السلام","prophets","قصة نوح عليه السلام ودعوته وقصة السفينة.","🌊"],

["hud","هود عليه السلام","prophets","قصة هود عليه السلام مع قوم عاد.","🏜️"],

["salih","صالح عليه السلام","prophets","قصة صالح عليه السلام وقوم ثمود.","🐪"],

["ibrahim","إبراهيم عليه السلام","prophets","قصة إبراهيم عليه السلام ومواقفه العظيمة.","🔥"],

["ismail","إسماعيل عليه السلام","prophets","قصة إسماعيل عليه السلام والصبر والطاعة.","🕋"],

["yusuf","يوسف عليه السلام","prophets","قصة يوسف عليه السلام وما فيها من الصبر والعفو.","🌙"],

["musa","موسى عليه السلام","prophets","قصة موسى عليه السلام وفرعون وبني إسرائيل.","🌊"],

["ayoub","أيوب عليه السلام","prophets","قصة أيوب عليه السلام والصبر.","🤲"],

["yunus","يونس عليه السلام","prophets","قصة يونس عليه السلام في بطن الحوت.","🐋"],

["dawud","داود عليه السلام","prophets","قصة داود عليه السلام والملك والحكمة.","👑"],

["sulaiman","سليمان عليه السلام","prophets","قصة سليمان عليه السلام وما آتاه الله من الملك.","👑"],

["zakariya","زكريا عليه السلام","prophets","قصة زكريا عليه السلام ودعائه.","🤲"],

["isa","عيسى عليه السلام","prophets","قصة عيسى عليه السلام ورسالته.","✨"],

["lut","لوط عليه السلام","prophets","قصة لوط عليه السلام وقومه.","🏜️"],

["shuaib","شعيب عليه السلام","prophets","قصة شعيب عليه السلام مع قوم مدين.","⚖️"],

["kahf","أصحاب الكهف","quran","قصة أصحاب الكهف كما وردت في سورة الكهف.","🪨"],

["qarun","قارون","quran","قصة قارون وما فيها من العبرة.","💰"],

["pharaoh","فرعون","quran","قصة فرعون مع موسى عليه السلام.","👑"],

["maryam","مريم عليها السلام","quran","قصة مريم عليها السلام كما وردت في القرآن.","🌿"],

["two_gardens","صاحب الجنتين","quran","قصة صاحب الجنتين والعبرة منها.","🌳"],

["birth","مولد النبي ﷺ","seerah","مولد النبي محمد ﷺ وبدايات حياته.","🌙"],

["childhood","طفولة النبي ﷺ","seerah","محطات من طفولة النبي ﷺ.","🌿"],

["khadijah","خديجة رضي الله عنها","seerah","خديجة رضي الله عنها ومكانتها في بداية الدعوة.","🤍"],

["hira","غار حراء ونزول الوحي","seerah","بداية نزول الوحي على النبي ﷺ.","⛰️"],

["makkah","الدعوة في مكة","seerah","مرحلة الدعوة في مكة وما واجهه المسلمون.","🕋"],

["hijrah","الهجرة النبوية","seerah","هجرة النبي ﷺ من مكة إلى المدينة.","🐪"],

["madinah","بناء المجتمع في المدينة","seerah","بدايات المجتمع الإسلامي في المدينة.","🕌"],

["badr","غزوة بدر","seerah","أحداث غزوة بدر وأبرز دروسها.","⚔️"],

["khandaq","غزوة الخندق","seerah","أحداث غزوة الخندق.","🛡️"],

["hudaybiyah","صلح الحديبية","seerah","قصة صلح الحديبية ودروسه.","🤝"],

["makkahVictory","فتح مكة","seerah","فتح مكة والعفو العظيم.","🕋"],

["farewell","حجة الوداع","seerah","حجة الوداع وخطبة النبي ﷺ.","🕋"]

];


let currentFilter="all";
let searchTerm="";

const grid=document.getElementById("grid");
const empty=document.getElementById("empty");

function categoryName(category){

  if(category==="prophets") return "الأنبياء";
  if(category==="quran") return "قصص القرآن";
  if(category==="seerah") return "السيرة النبوية";

  return "قصة";

}

function render(){

  const filtered=stories.filter(story=>{

    const id=story[0];
    const title=story[1];
    const category=story[2];
    const description=story[3];

    const matchesFilter=
      currentFilter==="all" ||
      category===currentFilter;

    const text=
      (title+" "+description).toLowerCase();

    const matchesSearch=
      text.includes(searchTerm.toLowerCase());

    return matchesFilter && matchesSearch;

  });

  empty.style.display=
    filtered.length ? "none" : "block";

  grid.innerHTML=filtered.map(story=>{

    const [id,title,category,description,icon]=story;

    return `

      <a class="story-card"
         href="story.html?id=${encodeURIComponent(id)}">

        <div class="card-icon">
          ${icon}
        </div>

        <span class="badge">
          ${categoryName(category)}
        </span>

        <h2>
          ${title}
        </h2>

        <p>
          ${description}
        </p>

        <span class="open">
          قراءة القصة ←
        </span>

      </a>

    `;

  }).join("");

}

document.querySelectorAll(".filter")
.forEach(button=>{

  button.addEventListener("click",()=>{

    document.querySelectorAll(".filter")
      .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    currentFilter=button.dataset.filter;

    render();

  });

});


document.getElementById("search")
.addEventListener("input",event=>{

  searchTerm=event.target.value.trim();

  render();

});


render();

</script>

</body>
</html>
