<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اختبار الهداية</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #061f18;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .box {
      width: min(90%, 600px);
      padding: 45px 25px;
      border-radius: 30px;
      background: linear-gradient(145deg, #0d4a36, #092d22);
      border: 2px solid #d6b76a;
      box-shadow: 0 25px 70px rgba(0,0,0,.4);
    }

    .logo {
      font-size: 60px;
      color: #e4c77c;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 15px;
    }

    p {
      color: #d7e3dd;
      line-height: 1.9;
    }

    .success {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      border-radius: 12px;
      background: #d6b76a;
      color: #092d22;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">هـ</div>

    <h1>تم تحديث صفحة القصص بنجاح ✅</h1>

    <p>
      إذا كنت ترى هذه الصفحة، فهذا يعني أن
      <strong>stories.html</strong>
      الجديد وصل بالفعل إلى الموقع.
    </p>

    <div class="success">
      M11 — اختبار التحديث
    </div>

  </div>

</body>
</html>
