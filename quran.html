<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>القرآن الكريم — الهداية</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap');

:root{
  --green:#123c2b;
  --green2:#1d6044;
  --gold:#c9a44c;
  --cream:#f8f4e8;
  --paper:#fffdf7;
  --text:#24352c;
  --muted:#718078;
  --border:#e7dfcc;
  --shadow:0 18px 55px rgba(25,55,40,.12);
  --quran-size:29px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Cairo,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 10%,rgba(201,164,76,.10),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(29,96,68,.08),transparent 30%),
    var(--cream);
}

button,input,select{font-family:inherit}

nav{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(18,60,43,.96);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.nav-inner{
  max-width:1250px;
  margin:auto;
  min-height:72px;
  padding:0 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  color:white;
  text-decoration:none;
  font-size:23px;
  font-weight:800;
}

.brand span{color:#e3c66e}

.nav-links{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.nav-links a{
  color:#f5f1df;
  text-decoration:none;
  padding:9px 14px;
  border-radius:12px;
  transition:.25s;
}

.nav-links a:hover,
.nav-links a.active{
  background:rgba(255,255,255,.12);
  color:#fff;
}

.hero{
  max-width:1250px;
  margin:35px auto 25px;
  padding:45px 28px;
  border-radius:30px;
  color:white;
  background:
    radial-gradient(circle at 15% 20%,rgba(201,164,76,.25),transparent 25%),
    radial-gradient(circle at 85% 80%,rgba(255,255,255,.08),transparent 25%),
    linear-gradient(135deg,#103b2a,#1d6044);
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}

.hero:before,
.hero:after{
  content:"";
  position:absolute;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50%;
}

.hero:before{
  width:300px;
  height:300px;
  left:-130px;
  top:-150px;
}

.hero:after{
  width:400px;
  height:400px;
  right:-200px;
  bottom:-220px;
}

.hero-content{
  position:relative;
  z-index:2;
}

.hero h1{
  margin:0 0 8px;
  font-size:clamp(34px,6vw,62px);
}

.hero p{
  margin:0;
  color:#e9eadc;
  font-size:17px;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:0 22px 60px;
}

.toolbar{
  background:var(--paper);
  border:1px solid var(--border);
  border-radius:22px;
  padding:18px;
  box-shadow:var(--shadow);
  margin-bottom:22px;
}

.search{
  width:100%;
  border:1px solid var(--border);
  background:white;
  border-radius:15px;
  padding:15px 18px;
  font-size:16px;
  outline:none;
}

.search:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 4px rgba(201,164,76,.12);
}

.layout{
  display:grid;
  grid-template-columns:310px 1fr;
  gap:22px;
  align-items:start;
}

.surahs{
  background:var(--paper);
  border:1px solid var(--border);
  border-radius:22px;
  padding:14px;
  box-shadow:var(--shadow);
  max-height:720px;
  overflow:auto;
}

.surah-btn{
  width:100%;
  border:0;
  background:transparent;
  padding:14px;
  margin-bottom:5px;
  border-radius:14px;
  text-align:right;
  cursor:pointer;
  color:var(--text);
  transition:.2s;
}

.surah-btn:hover{
  background:#f1ead7;
  transform:translateX(-3px);
}

.surah-btn.active{
  background:var(--green);
  color:white;
}

.surah-number{
  display:inline-flex;
  width:34px;
  height:34px;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  margin-left:9px;
  background:rgba(201,164,76,.2);
  color:var(--gold);
  font-weight:800;
}

.reader{
  background:var(--paper);
  border:1px solid var(--border);
  border-radius:28px;
  padding:28px;
  box-shadow:var(--shadow);
  min-width:0;
}

.reader-head{
  text-align:center;
  padding-bottom:25px;
  border-bottom:1px solid var(--border);
}

.reader-head h2{
  margin:0;
  font-size:35px;
  color:var(--green);
}

.meta{
  color:var(--muted);
  margin:7px 0 20px;
}

.controls{
  display:flex;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  cursor:pointer;
  border-radius:13px;
  padding:12px 18px;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-main{
  background:var(--green);
  color:white;
}

.btn-stop{
  background:#9b3b35;
  color:white;
}

.btn-light{
  background:#eee8d7;
  color:var(--green);
}

.basmala{
  text-align:center;
  font-family:Amiri,serif;
  font-size:30px;
  color:#9a7b2f;
  margin:28px 0;
}

.ayah{
  padding:23px 18px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  border-radius:18px;
  transition:.2s;
}

.ayah:hover,
.ayah.selected{
  background:#f6f0df;
}

.ayah-number{
  display:inline-flex;
  width:37px;
  height:37px;
  border-radius:50%;
  align-items:center;
  justify-content:center;
  background:var(--green);
  color:white;
  font-family:Cairo;
  font-size:14px;
  margin-left:9px;
}

.ayah-text{
  font-family:Amiri,serif;
  font-size:var(--quran-size);
  line-height:2.15;
  color:#172d22;
}

.tafsir{
  margin-top:30px;
  padding:24px;
  border-radius:22px;
  background:
    linear-gradient(135deg,rgba(29,96,68,.08),rgba(201,164,76,.08));
  border:1px solid var(--border);
}

.tafsir h3{
  margin-top:0;
  color:var(--green);
}

.tafsir-ayah{
  font-family:Amiri,serif;
  font-size:23px;
  line-height:2;
  margin-bottom:15px;
}

.tafsir-text{
  line-height:2;
  color:#405247;
}

.status{
  text-align:center;
  color:var(--muted);
  padding:30px;
}

footer{
  background:#0d2d21;
  color:#ddd8c8;
  text-align:center;
  padding:30px 20px;
}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .surahs{max-height:330px}
}

@media(max-width:600px){
  .nav-links{display:none}
  .hero{margin:15px 12px;padding:35px 20px}
  .container{padding:0 12px 40px}
  .reader{padding:17px}
  .ayah-text{font-size:25px}
}
</style>
</head>

<body>

<nav>
  <div class="nav-inner">
    <a class="brand" href="index.html">الهداية <span>✦</span></a>

    <div class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="stories.html">القصص</a>
      <a class="active" href="quran.html">القرآن</a>
      <a href="adhkar.html">الأذكار</a>
      <a href="prayer.html">الصلاة</a>
    </div>
  </div>
</nav>

<section class="hero">
  <div class="hero-content">
    <h1>القرآن الكريم</h1>
    <p>اقرأ، استمع، واختر أي آية لعرض تفسيرها بطريقة واضحة.</p>
  </div>
</section>

<main class="container">

  <div class="toolbar">
    <input
      id="search"
      class="search"
      type="search"
      placeholder="ابحث باسم السورة..."
    >
  </div>

  <div class="layout">

    <aside class="surahs" id="surahList">
      <div class="status">جاري تحميل السور...</div>
    </aside>

    <section class="reader">

      <div class="reader-head">
        <h2 id="surahName">الفاتحة</h2>
        <div class="meta" id="surahMeta">اختر سورة</div>

        <div class="controls">
          <button class="btn btn-main" id="playBtn">
            ▶ قراءة السورة كاملة
          </button>

          <button class="btn btn-stop" id="stopBtn">
            ⏸ إيقاف
          </button>

          <button class="btn btn-light" id="smaller">
            A−
          </button>

          <button class="btn btn-light" id="larger">
            A+
          </button>
        </div>
      </div>

      <div id="readerBody">
        <div class="status">
          اختر سورة من القائمة للبدء.
        </div>
      </div>

      <div class="tafsir" id="tafsirBox" style="display:none">
        <h3>📖 تفسير الآية المختارة</h3>
        <div class="tafsir-ayah" id="tafsirAyah"></div>
        <div class="tafsir-text" id="tafsirText">
          اختر آية من السورة.
        </div>
      </div>

    </section>
  </div>

</main>

<footer>
  <strong>الهداية</strong><br>
  نور يهديك — تطوير وبرمجة M11 — Mr. Mohamed Hussain
</footer>

<script>
const API = "https://api.alquran.cloud/v1";
const AUDIO_CDN =
  "https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/";

let surahs = [];
let currentSurah = null;
let currentAyahs = [];
let audio = null;

const list = document.getElementById("surahList");
const readerBody = document.getElementById("readerBody");
const surahName = document.getElementById("surahName");
const surahMeta = document.getElementById("surahMeta");
const search = document.getElementById("search");

async function loadSurahs(){
  try{
    const res = await fetch(API + "/surah");
    const json = await res.json();

    if(json.code !== 200) throw new Error();

    surahs = json.data;
    renderSurahs(surahs);

    const saved = Number(localStorage.getItem("hidayah_last_surah")) || 1;
    openSurah(saved);
  }catch(e){
    list.innerHTML =
      '<div class="status">تعذر تحميل السور. تحقق من اتصال الإنترنت.</div>';
  }
}

function renderSurahs(items){
  list.innerHTML = "";

  items.forEach(s => {
    const button = document.createElement("button");
    button.className = "surah-btn";
    button.dataset.number = s.number;

    button.innerHTML = `
      <span class="surah-number">${s.number}</span>
      <strong>${s.name.replace("سُورَةُ ","")}</strong>
      <small style="display:block;margin-top:4px;opacity:.7">
        ${s.numberOfAyahs} آية — ${s.revelationType === "Meccan" ? "مكية" : "مدنية"}
      </small>
    `;

    button.onclick = () => openSurah(s.number);

    list.appendChild(button);
  });
}

async function openSurah(number){
  stopAudio();

  document.querySelectorAll(".surah-btn").forEach(btn=>{
    btn.classList.toggle(
      "active",
      Number(btn.dataset.number) === Number(number)
    );
  });

  readerBody.innerHTML =
    '<div class="status">جاري تحميل السورة...</div>';

  try{
    const res = await fetch(
      `${API}/surah/${number}/quran-uthmani`
    );

    const json = await res.json();

    if(json.code !== 200) throw new Error();

    currentSurah = json.data;
    currentAyahs = currentSurah.ayahs;

    localStorage.setItem(
      "hidayah_last_surah",
      currentSurah.number
    );

    surahName.textContent =
      currentSurah.name.replace("سُورَةُ ","");

    surahMeta.textContent =
      `${currentSurah.numberOfAyahs} آية — ${
        currentSurah.revelationType === "Meccan" ? "مكية" : "مدنية"
      }`;

    renderReader();

  }catch(e){
    readerBody.innerHTML =
      '<div class="status">حدث خطأ أثناء تحميل السورة.</div>';
  }
}

function renderReader(){

  let html = "";

  if(currentSurah.number !== 9){
    html += `<div class="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
  }

  currentAyahs.forEach(ayah=>{
    html += `
      <div class="ayah" data-ayah="${ayah.numberInSurah}">
        <span class="ayah-number">
          ${ayah.numberInSurah}
        </span>

        <span class="ayah-text">
          ${ayah.text}
        </span>
      </div>
    `;
  });

  readerBody.innerHTML = html;

  document.querySelectorAll(".ayah").forEach(el=>{
    el.addEventListener("click",()=>{
      document.querySelectorAll(".ayah")
        .forEach(a=>a.classList.remove("selected"));

      el.classList.add("selected");

      const n = Number(el.dataset.ayah);
      const ayah = currentAyahs.find(
        a=>a.numberInSurah === n
      );

      showTafsir(ayah);
    });
  });

  document.getElementById("tafsirBox").style.display = "block";
  document.getElementById("tafsirAyah").textContent =
    "اختر آية من السورة";
  document.getElementById("tafsirText").textContent =
    "اضغط على أي آية لعرض التفسير المتاح.";
}

async function showTafsir(ayah){

  document.getElementById("tafsirAyah").textContent =
    ayah.text;

  document.getElementById("tafsirText").textContent =
    "جاري تحميل التفسير...";

  /*
    نحاول الحصول على تفسير عربي من API.
    في حالة عدم توفر الإصدار المطلوب، نعرض رسالة
    واضحة بدل وضع تفسير من عندنا.
  */

  const candidates = [
    "ar.muyassar",
    "ar.jalalayn",
    "ar.tafsir"
  ];

  for(const edition of candidates){

    try{
      const res = await fetch(
        `${API}/ayah/${currentSurah.number}:${ayah.numberInSurah}/${edition}`
      );

      if(!res.ok) continue;

      const json = await res.json();

      if(
        json.code === 200 &&
        json.data &&
        json.data.text &&
        json.data.edition &&
        json.data.edition.type === "tafsir"
      ){
        document.getElementById("tafsirText").textContent =
          json.data.text;

        return;
      }

    }catch(e){}
  }

  document.getElementById("tafsirText").innerHTML =
    `لم يتوفر تفسير عربي بهذا الإصدار من واجهة البيانات الحالية.
     يمكنك استخدام مصدر تفسير موثوق، ولن نضع تفسيرًا غير موثّق من عندنا.`;
}

function playFullSurah(){

  if(!currentSurah) return;

  stopAudio();

  audio = new Audio(
    AUDIO_CDN + currentSurah.number + ".mp3"
  );

  audio.preload = "auto";

  audio.play().catch(()=>{
    alert("اضغط مرة أخرى على زر القراءة لبدء الصوت.");
  });

  document.getElementById("playBtn").textContent =
    "🔊 السورة تعمل الآن";

  audio.onended = ()=>{
    document.getElementById("playBtn").textContent =
      "▶ قراءة السورة كاملة";
  };
}

function stopAudio(){

  if(audio){
    audio.pause();
    audio.currentTime = 0;
    audio = null;
  }

  document.getElementById("playBtn").textContent =
    "▶ قراءة السورة كاملة";
}

document.getElementById("playBtn")
  .addEventListener("click",playFullSurah);

document.getElementById("stopBtn")
  .addEventListener("click",stopAudio);

document.getElementById("larger")
  .addEventListener("click",()=>{
    let size = parseInt(
      getComputedStyle(document.documentElement)
      .getPropertyValue("--quran-size")
    ) || 29;

    size = Math.min(size + 2,46);

    document.documentElement.style
      .setProperty("--quran-size",size+"px");

    localStorage.setItem("quran_size",size);
  });

document.getElementById("smaller")
  .addEventListener("click",()=>{
    let size = parseInt(
      getComputedStyle(document.documentElement)
      .getPropertyValue("--quran-size")
    ) || 29;

    size = Math.max(size - 2,20);

    document.documentElement.style
      .setProperty("--quran-size",size+"px");

    localStorage.setItem("quran_size",size);
  });

search.addEventListener("input",()=>{
  const value = search.value.trim().toLowerCase();

  const filtered = surahs.filter(s =>
    s.name.toLowerCase().includes(value) ||
    s.englishName.toLowerCase().includes(value) ||
    String(s.number).includes(value)
  );

  renderSurahs(filtered);
});

const savedSize =
  Number(localStorage.getItem("quran_size")) || 29;

document.documentElement.style
  .setProperty("--quran-size",savedSize+"px");

window.addEventListener("beforeunload",stopAudio);

loadSurahs();
</script>

</body>
</html>
