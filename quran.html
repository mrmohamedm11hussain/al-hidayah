<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#073b2a">
<title>القرآن الكريم | الهداية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --green:#073b2a;
  --green2:#0b5940;
  --green3:#0f7252;
  --gold:#caa85e;
  --gold2:#e4c983;
  --cream:#f8f3e7;
  --cream2:#fffdf8;
  --text:#18352c;
  --muted:#6b7d74;
  --line:#e8dfca;
  --shadow:0 18px 50px rgba(7,59,42,.10);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Cairo",Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 5%,rgba(202,168,94,.13),transparent 25%),
    radial-gradient(circle at 90% 20%,rgba(11,89,64,.08),transparent 28%),
    var(--cream);
  color:var(--text);
  min-height:100vh;
}

button,input,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,59,42,.96);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(228,201,131,.18);
}

.nav{
  max-width:1250px;
  min-height:76px;
  margin:auto;
  padding:12px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  color:white;
  text-decoration:none;
}

.logo{
  width:46px;
  height:46px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#124e3a,#062e22);
  border:1px solid rgba(228,201,131,.45);
  color:var(--gold2);
  font-family:"Amiri",serif;
  font-size:29px;
}

.brand strong{
  display:block;
  font-size:18px;
}

.brand span{
  display:block;
  color:#cbdcd4;
  font-size:11px;
}

.nav-links{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.nav-links a{
  color:#e7f0eb;
  padding:9px 13px;
  border-radius:12px;
  font-size:13px;
  text-decoration:none;
  transition:.25s;
}

.nav-links a:hover,
.nav-links a.active{
  color:var(--gold2);
  background:rgba(202,168,94,.14);
}

.hero{
  max-width:1250px;
  margin:auto;
  padding:55px 22px 30px;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:25px;
  align-items:stretch;
}

.hero-text{
  padding:10px 0;
}

.eyebrow{
  color:#967936;
  font-size:13px;
  font-weight:800;
  margin-bottom:9px;
}

.hero h1{
  color:var(--green);
  font-size:clamp(38px,5vw,61px);
  line-height:1.12;
}

.hero h1 span{
  color:#b08b3d;
}

.hero p{
  color:var(--muted);
  line-height:2;
  font-size:14px;
  margin-top:14px;
  max-width:700px;
}

.mushaf{
  min-height:245px;
  border-radius:30px;
  background:
    radial-gradient(circle at 50% 35%,rgba(228,201,131,.18),transparent 30%),
    linear-gradient(145deg,#0c6246,#052d21);
  box-shadow:var(--shadow);
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
}

.mushaf::before,
.mushaf::after{
  content:"";
  position:absolute;
  border:1px solid rgba(228,201,131,.18);
  border-radius:50%;
}

.mushaf::before{
  width:250px;
  height:250px;
}

.mushaf::after{
  width:360px;
  height:360px;
}

.mushaf-inner{
  width:160px;
  height:190px;
  position:relative;
  z-index:2;
  border-radius:8px 16px 16px 8px;
  background:linear-gradient(90deg,#9a7434,#ead391,#ad863d);
  padding:9px;
  box-shadow:0 18px 35px rgba(0,0,0,.25);
  transform:perspective(500px) rotateY(-7deg);
}

.mushaf-page{
  height:100%;
  border:2px solid rgba(7,59,42,.5);
  border-radius:4px 11px 11px 4px;
  display:grid;
  place-items:center;
  text-align:center;
  padding:15px;
  color:#073b2a;
  background:#f8f0d9;
  font-family:"Amiri",serif;
  font-size:22px;
  line-height:1.8;
}

.controls{
  max-width:1250px;
  margin:auto;
  padding:0 22px 25px;
}

.controls-grid{
  display:grid;
  grid-template-columns:1fr 250px;
  gap:10px;
}

.control{
  min-height:54px;
  border:1px solid var(--line);
  background:rgba(255,253,248,.92);
  border-radius:17px;
  display:flex;
  align-items:center;
  padding:0 16px;
  box-shadow:0 8px 25px rgba(7,59,42,.05);
}

.control input,
.control select{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:14px;
}

.main{
  max-width:1250px;
  margin:auto;
  padding:0 22px 70px;
}

.layout{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:18px;
  align-items:start;
}

.panel{
  background:rgba(255,253,248,.92);
  border:1px solid var(--line);
  border-radius:23px;
  box-shadow:0 10px 30px rgba(7,59,42,.06);
  overflow:hidden;
}

.panel-title{
  padding:17px 18px;
  color:var(--green);
  border-bottom:1px solid var(--line);
  font-weight:800;
  font-size:15px;
}

.surah-list{
  max-height:650px;
  overflow:auto;
  padding:8px;
}

.surah{
  width:100%;
  border:0;
  background:transparent;
  border-radius:14px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:right;
  color:var(--text);
  transition:.2s;
}

.surah:hover{
  background:#f0f4ef;
}

.surah.active{
  background:var(--green);
  color:white;
}

.surah-number{
  width:34px;
  height:34px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:#edf3ef;
  color:var(--green2);
  font-size:11px;
  flex:0 0 auto;
}

.surah.active .surah-number{
  background:rgba(255,255,255,.12);
  color:var(--gold2);
}

.surah-name{
  flex:1;
}

.surah-name strong{
  display:block;
  font-size:13px;
}

.surah-name small{
  display:block;
  opacity:.65;
  margin-top:2px;
  font-size:10px;
}

.reader{
  min-height:650px;
  padding:25px;
}

.reader-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}

.reader-title h2{
  color:var(--green);
  font-family:"Amiri",serif;
  font-size:32px;
}

.reader-title p{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.audio-btn{
  border:0;
  min-width:50px;
  min-height:45px;
  border-radius:13px;
  background:var(--green);
  color:white;
  font-size:17px;
}

.audio-btn.playing{
  background:#a17d38;
}

.basmala{
  text-align:center;
  font-family:"Amiri",serif;
  font-size:27px;
  color:#a17d38;
  padding:25px 10px 20px;
}

.ayahs{
  font-family:"Amiri",serif;
  font-size:27px;
  line-height:2.25;
}

.ayah{
  display:inline;
  cursor:pointer;
  border-radius:8px;
  transition:.2s;
}

.ayah:hover{
  background:#f1ead7;
}

.ayah.selected{
  background:#e9f0eb;
}

.ayah-marker{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  margin:0 5px;
  border-radius:50%;
  color:#9a7739;
  border:1px solid #d6c28f;
  font-family:"Cairo",sans-serif;
  font-size:10px;
  vertical-align:middle;
}

.tafsir{
  margin-top:25px;
  padding:19px;
  background:#f1f5f1;
  border-right:4px solid var(--gold);
  border-radius:17px;
}

.tafsir h3{
  color:var(--green);
  font-size:13px;
  margin-bottom:8px;
}

.tafsir p{
  color:#64766e;
  line-height:2;
  font-size:13px;
}

.reader-actions{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:25px;
}

.action-btn{
  border:1px solid var(--line);
  background:#fffdf8;
  color:var(--green);
  padding:11px 16px;
  border-radius:13px;
  font-size:12px;
}

.action-btn.primary{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

.status{
  text-align:center;
  color:var(--muted);
  padding:45px 15px;
  font-size:13px;
}

.error{
  color:#9b4141;
  background:#f8e9e9;
  border-radius:14px;
  padding:15px;
  line-height:1.8;
}

@media(max-width:900px){
  .hero-grid{
    grid-template-columns:1fr;
  }

  .layout{
    grid-template-columns:1fr;
  }

  .surah-list{
    max-height:280px;
  }

  .controls-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:650px){
  .nav{
    min-height:68px;
    padding:9px 14px;
  }

  .nav-links{
    display:none;
  }

  .hero,
  .controls,
  .main{
    padding-left:16px;
    padding-right:16px;
  }

  .hero h1{
    font-size:40px;
  }

  .reader{
    padding:17px;
  }

  .ayahs{
    font-size:24px;
    line-height:2.15;
  }

  .reader-actions{
    flex-direction:column;
  }

  .action-btn{
    width:100%;
  }
}
</style>
</head>

<body>

<header class="header">
<nav class="nav">

<a href="index.html" class="brand">
  <div class="logo">هـ</div>
  <div>
    <strong>الهداية</strong>
    <span>نور يهديك</span>
  </div>
</a>

<div class="nav-links">
  <a href="index.html">الرئيسية</a>
  <a href="quran.html" class="active">القرآن</a>
  <a href="adhkar.html">الأذكار</a>
  <a href="stories.html">القصص</a>
  <a href="prayer.html">الصلاة</a>
  <a href="tasbeeh.html">التسبيح</a>
</div>

</nav>
</header>


<section class="hero">

<div class="hero-grid">

<div class="hero-text">
  <div class="eyebrow">كتاب الله</div>

  <h1>
    القرآن الكريم<br>
    <span>نور القلوب</span>
  </h1>

  <p>
    اقرأ القرآن الكريم بخط واضح، واستمع إلى التلاوة،
    وتابع موضعك أثناء القراءة.
  </p>
</div>

<div class="mushaf">
  <div class="mushaf-inner">
    <div class="mushaf-page">
      القرآن<br>
      الكريم
    </div>
  </div>
</div>

</div>

</section>


<section class="controls">

<div class="controls-grid">

<div class="control">
  <input id="searchInput" type="search" placeholder="ابحث باسم السورة أو كلمة من الآيات...">
</div>

<div class="control">
  <select id="surahSelect">
    <option value="">اختر السورة</option>
  </select>
</div>

</div>

</section>


<main class="main">

<div class="layout">

<aside class="panel">

<div class="panel-title">
  سور القرآن الكريم
</div>

<div class="surah-list" id="surahList">
  <div class="status">جاري تحميل السور...</div>
</div>

</aside>


<section class="panel reader" id="reader">

<div class="status">
  اختر سورة للبدء بالقراءة.
</div>

</section>

</div>

</main>


<script>
const API="https://api.alquran.cloud/v1";

const surahList=document.getElementById("surahList");
const surahSelect=document.getElementById("surahSelect");
const searchInput=document.getElementById("searchInput");
const reader=document.getElementById("reader");

let allSurahs=[];
let currentSurah=null;
let currentAudio=null;
let selectedAyah=null;

function escapeHTML(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function loadSurahs(){

  try{

    const response=await fetch(`${API}/surah`);

    const data=await response.json();

    if(!data.data){
      throw new Error("No data");
    }

    allSurahs=data.data;

    renderSurahs(allSurahs);

    surahSelect.innerHTML=
      `<option value="">اختر السورة</option>`+
      allSurahs.map(surah=>`
        <option value="${surah.number}">
          ${surah.number}. ${escapeHTML(surah.name)}
        </option>
      `).join("");

    const saved=Number(localStorage.getItem("alhidayah_last_surah"));

    if(saved>=1 && saved<=114){
      loadSurah(saved);
    }

  }catch(error){

    surahList.innerHTML=`
      <div class="status">
        تعذر تحميل قائمة السور.<br>
        تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.
      </div>
    `;

  }

}

function renderSurahs(list){

  if(!list.length){

    surahList.innerHTML=`
      <div class="status">
        لا توجد نتائج.
      </div>
    `;

    return;
  }

  surahList.innerHTML=list.map(surah=>`

    <button
      class="surah ${currentSurah?.number===surah.number?"active":""}"
      data-number="${surah.number}"
    >

      <span class="surah-number">
        ${surah.number}
      </span>

      <span class="surah-name">
        <strong>${escapeHTML(surah.name)}</strong>
        <small>${surah.englishName || ""}</small>
      </span>

    </button>

  `).join("");

  surahList.querySelectorAll("[data-number]").forEach(button=>{
    button.addEventListener("click",()=>{
      loadSurah(Number(button.dataset.number));
    });
  });

}

async function loadSurah(number){

  reader.innerHTML=`
    <div class="status">
      جاري تحميل السورة...
    </div>
  `;

  try{

    const response=await fetch(
      `${API}/surah/${number}/quran-uthmani`
    );

    const data=await response.json();

    if(!data.data){
      throw new Error("No surah");
    }

    currentSurah=data.data;

    selectedAyah=null;

    localStorage.setItem(
      "alhidayah_last_surah",
      String(number)
    );

    surahSelect.value=String(number);

    renderSurahs(
      filteredSurahs()
    );

    renderReader();

  }catch(error){

    reader.innerHTML=`
      <div class="error">
        حدث خطأ أثناء تحميل السورة.
        تأكد من اتصال الإنترنت ثم حاول مرة أخرى.
      </div>
    `;

  }

}

function renderReader(){

  if(!currentSurah){
    return;
  }

  const number=currentSurah.number;

  const showBasmala=number!==9;

  reader.innerHTML=`

    <div class="reader-head">

      <div class="reader-title">
        <h2>${escapeHTML(currentSurah.name)}</h2>
        <p>
          ${currentSurah.numberOfAyahs} آية
          ·
          ${currentSurah.revelationType==="Meccan"?"مكية":"مدنية"}
        </p>
      </div>

      <button class="audio-btn" id="audioBtn" title="تشغيل السورة">
        ▶
      </button>

    </div>

    ${showBasmala ? `
      <div class="basmala">
        بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
      </div>
    `:""}

    <div class="ayahs" id="ayahs">

      ${currentSurah.ayahs.map(ayah=>`

        <span
          class="ayah"
          data-ayah="${ayah.numberInSurah}"
          data-global="${ayah.number}"
        >
          ${escapeHTML(ayah.text)}
          <span class="ayah-marker">
            ${ayah.numberInSurah}
          </span>
        </span>

      `).join(" ")}

    </div>

    <div class="tafsir" id="tafsir">
      <h3>التفسير الميسر</h3>
      <p>
        اضغط على أي آية لعرض التفسير.
      </p>
    </div>

    <div class="reader-actions">

      <button class="action-btn" id="prevBtn">
        ← السورة السابقة
      </button>

      <button class="action-btn primary" id="saveBtn">
        حفظ موضعي
      </button>

      <button class="action-btn" id="nextBtn">
        السورة التالية →
      </button>

    </div>

  `;

  document
    .querySelectorAll(".ayah")
    .forEach(ayah=>{
      ayah.addEventListener("click",()=>{
        selectAyah(
          Number(ayah.dataset.ayah),
          Number(ayah.dataset.global),
          ayah
        );
      });
    });

  document
    .getElementById("audioBtn")
    .addEventListener("click",toggleAudio);

  document
    .getElementById("prevBtn")
    .addEventListener("click",()=>{
      if(number>1){
        loadSurah(number-1);
      }
    });

  document
    .getElementById("nextBtn")
    .addEventListener("click",()=>{
      if(number<114){
        loadSurah(number+1);
      }
    });

  document
    .getElementById("saveBtn")
    .addEventListener("click",()=>{
      if(selectedAyah){
        localStorage.setItem(
          "alhidayah_last_ayah",
          JSON.stringify({
            surah:number,
            ayah:selectedAyah
          })
        );
      }

      const button=document.getElementById("saveBtn");

      button.textContent="✓ تم الحفظ";

      setTimeout(()=>{
        button.textContent="حفظ موضعي";
      },1300);
    });

}

async function selectAyah(localNumber,globalNumber,element){

  document
    .querySelectorAll(".ayah.selected")
    .forEach(el=>el.classList.remove("selected"));

  element.classList.add("selected");

  selectedAyah=localNumber;

  const tafsir=document.getElementById("tafsir");

  tafsir.innerHTML=`
    <h3>التفسير الميسر</h3>
    <p>جاري تحميل التفسير...</p>
  `;

  try{

    const response=await fetch(
      `${API}/ayah/${globalNumber}/ar.muyassar`
    );

    const data=await response.json();

    if(data?.data?.text){

      tafsir.innerHTML=`
        <h3>التفسير الميسر — الآية ${localNumber}</h3>
        <p>${escapeHTML(data.data.text)}</p>
      `;

    }else{

      throw new Error("No tafsir");

    }

  }catch(error){

    tafsir.innerHTML=`
      <h3>التفسير الميسر</h3>
      <p>
        تعذر تحميل التفسير حاليًا.
      </p>
    `;

  }

}

function toggleAudio(){

  if(!currentSurah){
    return;
  }

  const button=document.getElementById("audioBtn");

  if(currentAudio){

    currentAudio.pause();
    currentAudio=null;

    button.textContent="▶";
    button.classList.remove("playing");

    return;
  }

  const audioURL=
    `https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${currentSurah.number}.mp3`;

  currentAudio=new Audio(audioURL);

  currentAudio.play()
    .then(()=>{
      button.textContent="Ⅱ";
      button.classList.add("playing");
    })
    .catch(()=>{
      currentAudio=null;
      button.textContent="▶";
    });

  currentAudio.onended=()=>{
    currentAudio=null;
    button.textContent="▶";
    button.classList.remove("playing");
  };

}

function filteredSurahs(){

  const query=searchInput.value
    .trim()
    .toLowerCase();

  if(!query){
    return allSurahs;
  }

  return allSurahs.filter(surah=>
    String(surah.number).includes(query) ||
    surah.name.toLowerCase().includes(query) ||
    surah.englishName.toLowerCase().includes(query)
  );

}

searchInput.addEventListener("input",()=>{
  renderSurahs(filteredSurahs());
});

surahSelect.addEventListener("change",()=>{
  const number=Number(surahSelect.value);

  if(number){
    loadSurah(number);
  }
});

loadSurahs();
</script>

</body>
  </html>
