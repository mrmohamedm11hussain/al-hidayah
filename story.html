<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0d3b2e">
<title>القصة | الهداية</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap');

:root{
  --green:#0d3b2e;
  --green2:#145a43;
  --green3:#1d7657;
  --gold:#c49a45;
  --gold2:#e0bd70;
  --cream:#f8f4e9;
  --paper:#fffdf7;
  --text:#26352f;
  --muted:#718078;
  --border:#e8e1d1;
  --shadow:0 18px 55px rgba(13,59,46,.10);
  --radius:26px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Cairo",sans-serif;
  background:
    radial-gradient(circle at 10% 10%,rgba(196,154,69,.08),transparent 28%),
    radial-gradient(circle at 90% 25%,rgba(29,118,87,.07),transparent 30%),
    var(--cream);
  color:var(--text);
  line-height:1.95;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font-family:inherit;
}

.top-progress{
  position:fixed;
  top:0;
  right:0;
  height:4px;
  width:0%;
  background:linear-gradient(90deg,var(--gold),#f0d18a,var(--gold));
  z-index:9999;
  box-shadow:0 0 15px rgba(196,154,69,.45);
}

.nav{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,253,247,.91);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(232,225,209,.8);
}

.nav-inner{
  width:min(1180px,92%);
  margin:auto;
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
  color:var(--green);
}

.brand-mark{
  width:44px;
  height:44px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,var(--green),var(--green2));
  color:#fff;
  font-family:"Amiri",serif;
  font-size:27px;
  box-shadow:0 9px 24px rgba(13,59,46,.18);
}

.brand-text{
  line-height:1.2;
}

.brand-text small{
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:500;
  margin-top:4px;
}

.back{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  border-radius:14px;
  background:#fff;
  border:1px solid var(--border);
  color:var(--green);
  font-weight:700;
  transition:.25s;
}

.back:hover{
  transform:translateY(-2px);
  border-color:var(--gold2);
  box-shadow:0 8px 20px rgba(13,59,46,.08);
}

.container{
  width:min(1020px,92%);
  margin:auto;
}

.breadcrumbs{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:13px;
  padding:28px 0 16px;
}

.breadcrumbs a:hover{
  color:var(--green);
}

.hero{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 90% 10%,rgba(224,189,112,.18),transparent 28%),
    linear-gradient(135deg,#0d3b2e,#155640 60%,#0c3328);
  color:white;
  border-radius:32px;
  padding:48px;
  box-shadow:var(--shadow);
  margin-bottom:28px;
}

.hero::before{
  content:"";
  position:absolute;
  width:240px;
  height:240px;
  border:1px solid rgba(224,189,112,.18);
  border-radius:50%;
  left:-80px;
  bottom:-100px;
}

.hero::after{
  content:"✦";
  position:absolute;
  color:rgba(224,189,112,.55);
  font-size:110px;
  left:55px;
  bottom:-10px;
  font-family:serif;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:800px;
}

.category{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#f4d994;
  border:1px solid rgba(224,189,112,.35);
  background:rgba(255,255,255,.07);
  padding:7px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  margin-bottom:17px;
}

.hero h1{
  font-family:"Amiri",serif;
  font-size:clamp(38px,6vw,66px);
  line-height:1.2;
  margin-bottom:14px;
}

.hero-desc{
  color:rgba(255,255,255,.82);
  font-size:16px;
  max-width:720px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:24px;
}

.meta span{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  padding:8px 13px;
  border-radius:12px;
  font-size:12px;
  color:#fff;
}

.quick-nav{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:4px 2px 16px;
  scrollbar-width:none;
}

.quick-nav::-webkit-scrollbar{
  display:none;
}

.quick-nav a{
  white-space:nowrap;
  background:#fff;
  border:1px solid var(--border);
  padding:10px 15px;
  border-radius:13px;
  font-size:13px;
  font-weight:700;
  color:var(--green);
  transition:.2s;
}

.quick-nav a:hover{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

.reader{
  background:var(--paper);
  border:1px solid var(--border);
  border-radius:30px;
  box-shadow:var(--shadow);
  padding:clamp(24px,5vw,58px);
  margin-bottom:28px;
}

.intro{
  background:linear-gradient(135deg,#f5efdf,#fffdf7);
  border-right:4px solid var(--gold);
  padding:22px 24px;
  border-radius:18px;
  margin-bottom:38px;
  color:#49564f;
}

.section{
  margin:48px 0;
  scroll-margin-top:110px;
}

.section:first-of-type{
  margin-top:0;
}

.section-title{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--green);
  margin-bottom:20px;
}

.section-number{
  min-width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:#edf5f0;
  color:var(--green);
  font-weight:800;
}

.section-title h2{
  font-family:"Amiri",serif;
  font-size:30px;
}

.story-text p{
  font-family:"Amiri",serif;
  font-size:21px;
  line-height:2.15;
  color:#334139;
  margin-bottom:20px;
}

.quote{
  position:relative;
  margin:32px 0;
  padding:30px;
  border-radius:22px;
  background:#f2f7f3;
  border:1px solid #dce9df;
}

.quote::before{
  content:"﴿";
  position:absolute;
  right:18px;
  top:3px;
  color:var(--gold);
  font-size:50px;
  font-family:"Amiri",serif;
}

.quote-text{
  font-family:"Amiri",serif;
  font-size:24px;
  line-height:2;
  color:var(--green);
  padding-right:20px;
}

.quote-source{
  margin-top:12px;
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}

.lessons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.lesson{
  padding:20px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  display:flex;
  gap:12px;
  align-items:flex-start;
  transition:.25s;
}

.lesson:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 28px rgba(13,59,46,.07);
}

.lesson-icon{
  width:34px;
  height:34px;
  flex:none;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:#f5ead0;
  color:#99722d;
  font-weight:900;
}

.simple{
  background:linear-gradient(135deg,#fff8e8,#fffdf7);
  border:1px solid #eadcb8;
  border-radius:22px;
  padding:27px;
}

.simple h3{
  color:#886627;
  margin-bottom:12px;
  font-size:19px;
}

.simple p{
  color:#4d574f;
}

.video-section{
  background:#102f27;
  border-radius:25px;
  padding:24px;
  color:white;
  margin-top:40px;
}

.video-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.video-head h2{
  font-size:21px;
}

.video-head span{
  color:#e1c57e;
  font-size:12px;
}

.video-frame{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  border-radius:18px;
  overflow:hidden;
  background:#071c17;
}

.video-frame iframe{
  width:100%;
  height:100%;
  border:0;
}

.sources{
  background:#faf8f1;
  border:1px solid var(--border);
  border-radius:22px;
  padding:25px;
}

.sources h2{
  color:var(--green);
  margin-bottom:15px;
}

.sources ul{
  padding-right:22px;
}

.sources li{
  margin:8px 0;
  color:#56625b;
}

.navigation{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-bottom:50px;
}

.nav-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px 20px;
  transition:.25s;
}

.nav-card:hover{
  border-color:var(--gold2);
  transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(13,59,46,.07);
}

.nav-card.next{
  text-align:left;
}

.nav-label{
  font-size:11px;
  color:var(--muted);
  display:block;
  margin-bottom:5px;
}

.nav-title{
  font-weight:800;
  color:var(--green);
}

.error{
  text-align:center;
  background:#fff;
  border:1px solid var(--border);
  border-radius:25px;
  padding:70px 25px;
  margin:50px auto;
  box-shadow:var(--shadow);
}

.error h1{
  color:var(--green);
  margin-bottom:12px;
}

.footer{
  background:#0b3025;
  color:rgba(255,255,255,.72);
  padding:38px 0;
  text-align:center;
}

.footer strong{
  color:#e0bd70;
}

.footer small{
  display:block;
  margin-top:8px;
  opacity:.65;
}

@media(max-width:700px){
  .nav-inner{
    min-height:68px;
  }

  .brand-text{
    font-size:14px;
  }

  .brand-text small{
    display:none;
  }

  .back{
    padding:9px 11px;
    font-size:12px;
  }

  .hero{
    padding:32px 23px;
    border-radius:25px;
  }

  .hero h1{
    font-size:43px;
  }

  .reader{
    padding:22px 17px;
    border-radius:23px;
  }

  .story-text p{
    font-size:19px;
  }

  .quote-text{
    font-size:21px;
  }

  .lessons{
    grid-template-columns:1fr;
  }

  .navigation{
    grid-template-columns:1fr;
  }

  .nav-card.next{
    text-align:right;
  }
}

.reveal{
  opacity:0;
  transform:translateY(20px);
  transition:opacity .6s ease,transform .6s ease;
}

.reveal.show{
  opacity:1;
  transform:none;
}
</style>
</head>

description:"قصة إبراهيم عليه السلام في البحث عن الحق، ومواجهة الشرك، والثبات على التوحيد.",
chapters:[
["البحث عن الحق",[
"نشأ إبراهيم عليه السلام في قوم يعبدون الأصنام، فلم يقبل عبادة ما لا يسمع ولا يبصر ولا يملك لنفسه نفعًا ولا ضرًا.",
"واجه قومه بالحجة، وبيّن لهم أن العبادة لا تكون إلا لله وحده."
]],
["مواجهة قومه",[
"استمر قومه في عبادة الأصنام، فبيّن إبراهيم بطلانها بطريقة جعلتهم يفكرون فيما يفعلون. ثم واجههم بوضوح بأن ما يعبدونه لا يستحق العبادة.",
"فازداد غضبهم عليه، وأرادوا الانتقام منه."
]],
["الثبات",[
"لم يتراجع إبراهيم عن توحيده، وكان قلبه متعلقًا بالله. وأصبح مثالًا في الثبات على الحق مهما كان ضغط المجتمع."
]]
],
verse:["﴿إِنَّنِي وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا﴾","الأنعام: 79"],
simple:"الإيمان يحتاج إلى عقل يبحث عن الحق وقلب ثابت عليه، وليس مجرد تقليد لما يفعله الآخرون.",
lessons:["التوحيد.","التفكير في الأدلة.","الثبات.","الشجاعة في الحق."],
sources:["القرآن الكريم: الأنعام 74–83.","القرآن الكريم: الأنبياء 51–70.","القرآن الكريم: البقرة 124–132."]
},

ismail:{
title:"إسماعيل عليه السلام",
category:"قصص الأنبياء",
icon:"🕋",
description:"قصة إسماعيل عليه السلام، وطاعته لله، وقصة بناء الكعبة مع إبراهيم عليه السلام.",
chapters:[
["إسماعيل في مكة",[
"ترك إبراهيم عليه السلام هاجر وإسماعيل في مكان لم يكن فيه زرع ولا ماء، امتثالًا لأمر الله. وكانت ثقة هاجر بالله عظيمة.",
"فجعل الله بعد الشدة فرجًا، وظهر ماء زمزم، ثم بدأت الحياة في المكان."
]],
["الطاعة",[
"كبر إسماعيل عليه السلام، وكان مثالًا في الطاعة والصبر. وجاء الاختبار العظيم الذي أخبر القرآن عنه، فاستسلم الأب والابن لأمر الله."
]],
["بناء الكعبة",[
"رفع إبراهيم وإسماعيل قواعد البيت، وكانا يدعوان الله أن يتقبل منهما وأن يجعل من ذريتهما أمة مسلمة له."
]]
],
verse:["﴿وَإِذْ يَرْفَعُ إِبْرَاهِيمُ الْقَوَاعِدَ مِنَ الْبَيْتِ وَإِسْمَاعِيلُ﴾","البقرة: 127"],
simple:"الطاعة الحقيقية تظهر عندما يكون الإنسان مستعدًا لتقديم أمر الله على رغباته.",
lessons:["الطاعة.","الصبر.","الثقة بالله.","الإخلاص في العمل."],
sources:["القرآن الكريم: البقرة 125–129.","القرآن الكريم: الصافات 100–113."]
},

yusuf:{
title:"يوسف عليه السلام",
category:"قصص الأنبياء",
icon:"🌙",
description:"قصة يوسف عليه السلام من الابتلاء في الصغر إلى التمكين، ثم العفو عن إخوته.",
chapters:[
["الرؤيا والغيرة",[
"رأى يوسف عليه السلام رؤيا عظيمة، فقصها على أبيه يعقوب عليه السلام. وكان يعقوب يعلم أن ليوسف شأنًا، ونصحه ألا يقص الرؤيا على إخوته.",
"لكن الغيرة دخلت قلوب بعض إخوته، فدبروا أمرًا لإبعاده عن أبيه."
]],
["الابتلاء",[
"ألقي يوسف في الجب، ثم انتقل إلى حياة جديدة في مصر. مرّ بعد ذلك باختبارات صعبة، ومنها السجن، لكنه ظل متمسكًا بالعفة والإيمان.",
"لم تجعل المحن يوسف يترك أخلاقه أو ييأس من رحمة الله."
]],
["التمكين",[
"خرج يوسف من السجن بعد أن ظهرت براءته، وأصبح مسؤولًا عن خزائن الأرض في وقت الشدة، وأدار الأزمة بحكمة.",
"ثم جاءت مرحلة اللقاء بإخوته، فعرفهم ولم ينتقم منهم، بل اختار العفو عندما أصبح قادرًا على ذلك."
]],
["النهاية",[
"اجتمعت الأسرة بعد سنوات طويلة، وتحققت رؤيا يوسف. وأظهر يوسف أن الصبر والتقوى يمكن أن يحولا المحنة إلى طريق للتمكين."
]]
],
verse:["﴿إِنَّهُ مَن يَتَّقِ وَيَصْبِرْ فَإِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ﴾","يوسف: 90"],
simple:"قد لا نفهم سبب الابتلاء وقت حدوثه، لكن الصبر والتقوى يجعلان الإنسان قادرًا على عبور المراحل الصعبة دون أن يفقد أخلاقه.",
lessons:["الصبر.","العفة.","العفو عند القدرة.","الثقة بتدبير الله.","عدم اليأس."],
sources:["القرآن الكريم: سورة يوسف كاملة."]
},

musa:{
title:"موسى عليه السلام",
category:"قصص الأنبياء",
icon:"🌊",
description:"قصة موسى عليه السلام مع فرعون، وخروجه ببني إسرائيل، وثباته أمام الطغيان.",
chapters:[
["مولد موسى",[
"ولد موسى عليه السلام في وقت كان فرعون يقتل أبناء بني إسرائيل خوفًا على ملكه. أوحى الله إلى أم موسى أن ترضعه، فإذا خافت عليه تجعله في اليم، ووعدها أن يرده إليها.",
"وصل موسى إلى بيت فرعون نفسه، لكن الله جعل له أسبابًا حتى عاد إلى أمه، فاطمأن قلبها."
]],
["الرسالة",[
"كبر موسى ثم اصطفاه الله رسولًا، وأمره أن يذهب إلى فرعون ويدعوه إلى عبادة الله وإطلاق بني إسرائيل.",
"طلب موسى من الله أن يشرح صدره وييسر أمره، وأن يجعل هارون أخاه عونًا له."
]],
["مواجهة فرعون",[
"جاء موسى وهارون بالرسالة، لكن فرعون استكبر وجادل. وأظهر الله من الآيات ما يؤيد موسى، ومع ذلك أصر فرعون على عناده.",
"وقف موسى أمام الخوف بثقة في الله، ولم يجعل قوة فرعون سببًا للتراجع."
]],
["الخروج والبحر",[
"أمر الله موسى أن يخرج ببني إسرائيل، فلحق بهم فرعون وجنوده. وعندما وصل موسى ومن معه إلى البحر، ظن بعضهم أن الخطر أدركهم.",
"قال موسى بثقة: إن الله معه، ثم جاء الفرج بأمر الله، وانشق البحر فكان طريقًا للنجاة، ثم أغرق الله فرعون وجنوده."
]]
],
verse:["﴿كَلَّا إِنَّ مَعِيَ رَبِّي سَيَهْدِينِ﴾","الشعراء: 62"],
simple:"عندما تبدو الأسباب كلها ضدك، لا يعني ذلك أن الله تركك. موسى عليه السلام واجه موقفًا شديدًا لكنه وثق بوعد الله.",
lessons:["الثقة بالله.","الشجاعة.","الصبر.","الاستعانة بالله.","عدم الاستسلام للظلم."],
sources:["القرآن الكريم: القصص 3–35.","القرآن الكريم: طه 9–79.","القرآن الكريم: الشعراء 10–68."],
video:"ZubVqCRp_Kc"
},

ayoub:{
title:"أيوب عليه السلام",
category:"قصص الأنبياء",
icon:"🌱",
description:"قصة أيوب عليه السلام في الصبر والدعاء والثقة برحمة الله.",
chapters:[
["الابتلاء",[
"ابتُلي أيوب عليه السلام ابتلاء شديدًا، ومع ذلك بقي متعلقًا بالله ولم يتحول ابتلاؤه إلى اعتراض على ربه."
]],
["الدعاء",[
"لما اشتد به الضر، دعا ربه بأدب وقال إنه مسه الضر وأن الله أرحم الراحمين. لم يكن دعاؤه يأسًا، بل رجاءً في رحمة الله."
]],
["الفرج",[
"استجاب الله له، وأمره بسبب من أسباب الشفاء، ورد عليه عافيته ورحمته، وجعل قصته مثالًا للصبر وحسن الظن بالله."
]]
],
verse:["﴿أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ﴾","الأنبياء: 83"],
simple:"الصبر لا يعني أن الإنسان لا يتألم، بل يعني ألا يفقد ثقته بالله أثناء الألم.",
lessons:["الصبر.","حسن الظن بالله.","الدعاء.","الرجوع إلى الله."],
sources:["القرآن الكريم: الأنبياء 83–84.","القرآن الكريم: ص 41–44."]
},

yunus:{
title:"يونس عليه السلام",
category:"قصص الأنبياء",
icon:"🐋",
description:"قصة يونس عليه السلام، والابتلاء، والدعاء، وفتح باب التوبة.",
chapters:[
["الدعوة",[
"أرسل الله يونس عليه السلام إلى قومه يدعوهم إلى الله. ثم مرّ عليه موقف شديد خرج بعده، وركب سفينة، فوقعت أحداث عظيمة."
]],
["في الظلمات",[
"كان يونس في ظلمات البحر وبطن الحوت والليل، وهناك أدرك عظمة حاجته إلى الله، فنادى ربه بتوحيد وتنزيه واعتراف بالخطأ."
]],
["النجاة",[
"استجاب الله له ونجّاه، وأنبت عليه شجرة من يقطين، ثم عاد إلى قومه فوجدهم قد آمنوا، فكان في قصته درس عظيم في التوبة والرجوع إلى الله."
]]
],
verse:["﴿لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ﴾","الأنبياء: 87"],
simple:"حتى في أشد لحظات الضيق يمكن للإنسان أن يعود إلى الله، ولا ينبغي أن ييأس من رحمته.",
lessons:["الدعاء.","التوبة.","عدم اليأس.","تنزيه الله.","الرجوع إلى الله."],
sources:["القرآن الكريم: الأنبياء 87–88.","القرآن الكريم: الصافات 139–148.","القرآن الكريم: القلم 48–50."]
},

dawud:{
title:"داود عليه السلام",
category:"قصص الأنبياء",
icon:"👑",
description:"قصة داود عليه السلام، الملك والنبي، وما منحه الله من الحكمة والقوة.",
chapters:[
["النصر",[
"كان داود عليه السلام من بني إسرائيل، وظهر في قصة مواجهة طالوت وجالوت، ثم آتاه الله الملك والحكمة."
]],
["الملك والحكمة",[
"لم يكن ملك داود قائمًا على القوة فقط، بل على العدل والحكمة والرجوع إلى الله. وكان الله قد منحه صوتًا حسنًا وتسبيحًا عظيمًا."
]],
["العمل",[
"كان داود يعمل بيده، وألان الله له الحديد، فكان يصنع منه ما ينتفع به الناس. وفي ذلك درس في الجمع بين العبادة والعمل."
]]
],
verse:["﴿وَشَدَدْنَا مُلْكَهُ وَآتَيْنَاهُ الْحِكْمَةَ وَفَصْلَ الْخِطَابِ﴾","ص: 20"],
simple:"القوة الحقيقية تحتاج إلى عدل وحكمة ومسؤولية.",
lessons:["العدل.","الحكمة.","العمل.","شكر النعم."],
sources:["القرآن الكريم: البقرة 246–251.","القرآن الكريم: ص 17–26."]
},

sulaiman:{
title:"سليمان عليه السلام",
category:"قصص الأنبياء",
icon:"🕊️",
description:"قصة سليمان عليه السلام وما أعطاه الله من الملك والحكمة وتسخير الريح والجن.",
chapters:[
["الملك والنعم",[
"ورث سليمان عليه السلام داود، وآتاه الله ملكًا عظيمًا وعلّمه منطق الطير، وسخّر له من خلقه ما شاء بأمر الله."
]],
["قصة النملة",[
"مر سليمان وجنوده بوادي النمل، فسمع نملة تحذر قومها، فتبسم من قولها وشكر الله على نعمه."
]],
["ملكة سبأ",[
"بلغ سليمان خبر قوم في سبأ يعبدون الشمس، فدعاهم إلى عبادة الله. وجاءت ملكة سبأ إلى سليمان، وانتهى الأمر بإسلامها لله."
]]
],
verse:["﴿رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ﴾","النمل: 19"],
simple:"كلما زادت النعم احتاج الإنسان إلى مزيد من الشكر والتواضع، لا إلى الغرور.",
lessons:["الشكر.","التواضع.","الحكمة.","استخدام القوة في الخير."],
sources:["القرآن الكريم: النمل 15–44.","القرآن الكريم: سبأ 12–14.","القرآن الكريم: ص 30–40."]
},

zakariya:{
title:"زكريا عليه السلام",
category:"قصص الأنبياء",
icon:"🤲",
description:"قصة زكريا عليه السلام ودعائه لله ورجائه في الذرية الصالحة.",
chapters:[
["دعاء خفي",[
"كان زكريا عليه السلام عبدًا صالحًا، ورأى من كرامة الله لمريم ما جعله يزداد يقينًا بقدرة الله ورحمته."
]],
["الرجاء",[
"دعا زكريا ربه أن يهب له ولدًا صالحًا، مع أن الأسباب الظاهرة كانت تدل على صعوبة ذلك، لكنه لم يجعل الأسباب تحدد قدرته على الله."
]],
["البشارة",[
"بشرته الملائكة بيحيى عليه السلام، فكانت استجابة الدعاء دليلًا على أن الله يسمع دعاء عباده ويقدر لهم الخير."
]]
],
verse:["﴿رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنتَ خَيْرُ الْوَارِثِينَ﴾","الأنبياء: 89"],
simple:"لا تجعل صعوبة الأسباب تمنعك من الدعاء، فالله على كل شيء قدير.",
lessons:["الدعاء.","الأمل.","حسن الظن بالله.","طلب الذرية الصالحة."],
sources:["القرآن الكريم: مريم 2–15.","القرآن الكريم: آل عمران 37–41.","القرآن الكريم: الأنبياء 89–90."]
},

isa:{
title:"عيسى عليه السلام",
category:"قصص الأنبياء",
icon:"✨",
description:"قصة عيسى ابن مريم عليه السلام كما وردت في القرآن الكريم، وميلاده ومعجزاته ودعوته.",
chapters:[
["البشارة بمريم",[
"اصطفى الله مريم عليها السلام وبشرها بولادة عيسى عليه السلام، وكانت ولادته آية عظيمة من آيات الله."
]],
["الدعوة",[
"أرسل الله عيسى إلى بني إسرائيل مؤيدًا بالبينات، ودعاهم إلى عبادة الله وحده."
]],
["المعجزات",[
"أيّد الله عيسى بمعجزات، منها شفاء بعض المرضى وإحياء الموتى بإذن الله، وكانت كل هذه الآيات بإذن الله وليست بقدرة مستقلة من عيسى."
]],
["الثبات",[
"واجه عيسى التكذيب من بعض قومه، وبقي يدعو إلى الحق. ويؤكد القرآن أن عيسى عبد الله ورسوله وليس إلهًا."
]]
],
verse:["﴿إِنَّمَا الْمَسِيحُ عِيسَى ابْنُ مَرْيَمَ رَسُولُ اللَّهِ﴾","النساء: 171"],
simple:"يعرض القرآن عيسى عليه السلام كنبي كريم ورسول من عند الله، ويدعو إلى عبادة الله وحده.",
lessons:["التوحيد.","الإيمان بالرسل.","الصدق.","الثبات."],
sources:["القرآن الكريم: آل عمران 42–59.","القرآن الكريم: مريم 16–36.","القرآن الكريم: النساء 157–172."]
},

lut:{
title:"لوط عليه السلام",
category:"قصص الأنبياء",
icon:"🏡",
description:"قصة لوط عليه السلام ودعوته قومه إلى الطهارة وترك الفساد.",
chapters:[
["الدعوة",[
"أرسل الله لوطًا إلى قومه، فدعاهم إلى ترك الفواحش والفساد والعودة إلى طريق الطهارة."
]],
["رفض القوم",[
"قابل القوم دعوة لوط بالرفض، ولم يقبلوا نصيحته، واستمروا في سلوكهم."
]],
["النجاة",[
"جاءت الملائكة إلى لوط وأخبرته بأمر الله، ونجّى الله لوطًا ومن آمن معه، وأهلك القوم بسبب إصرارهم على الفساد."
]]
],
verse:["﴿أَئِنَّكُمْ لَتَأْتُونَ الرِّجَالَ شَهْوَةً مِّن دُونِ النِّسَاءِ﴾","الأعراف: 81"],
simple:"الطريق إلى الله يحتاج إلى ترك الفساد والاستجابة للنصيحة قبل أن يفوت وقت التوبة.",
lessons:["الطهارة.","رفض الفساد.","الثبات.","الاستجابة للنصح."],
sources:["القرآن الكريم: هود 77–83.","القرآن الكريم: الأعراف 80–84.","القرآن الكريم: العنكبوت 28–35."]
},

shuaib:{
title:"شعيب عليه السلام",
category:"قصص الأنبياء",
icon:"⚖️",
description:"قصة شعيب عليه السلام مع مدين، ودعوته إلى التوحيد والعدل في التعامل.",
chapters:[
["مدين",[
"أرسل الله شعيبًا إلى قوم مدين، وكان من مشكلات قومه الغش في الكيل والميزان والفساد في التعامل."
]],
["العدل",[
"دعاهم شعيب إلى عبادة الله وإعطاء الناس حقوقهم وعدم إنقاص المكيال والميزان. وأوضح لهم أن الإصلاح خير من الفساد."
]],
["العاقبة",[
"استمر قسم منهم في التكذيب والسخرية، فكانت عاقبتهم الهلاك، ونجّى الله شعيبًا والذين آمنوا."
]]
],
verse:["﴿أَوْفُوا الْكَيْلَ وَالْمِيزَانَ بِالْقِسْطِ﴾","الأنعام: 152"],
simple:"الإيمان ليس صلاة فقط؛ بل يظهر أيضًا في الأمانة والبيع والشراء وإعطاء كل شخص حقه.",
lessons:["الأمانة.","العدل.","ترك الغش.","الإصلاح."],
sources:["القرآن الكريم: الأعراف 85–93.","القرآن الكريم: هود 84–95.","القرآن الكريم: الشعراء 176–191."]
},

kahf:{
title:"أصحاب الكهف",
category:"قصص القرآن",
icon:"🕯️",
description:"قصة الفتية الذين آمنوا بربهم فثبتوا على الإيمان، فحفظهم الله وأيقظهم بعد سنين طويلة.",
chapters:[
["الفتية والإيمان",[
"كان أصحاب الكهف مجموعة من الفتية آمنوا بالله ورفضوا الشرك الذي كان منتشرًا في قومهم. جمعهم الإيمان رغم أنهم كانوا شبابًا.",
"لما اشتد عليهم الخوف على دينهم، لجؤوا إلى الكهف وسألوا الله رحمته ورشده."
]],
["النوم الطويل",[
"أنامهم الله في الكهف سنين طويلة، ثم بعثهم ليتساءلوا عن المدة التي لبثوها، وأصبح وجودهم آية للناس."
]],
["اكتشاف أمرهم",[
"أرسلوا أحدهم إلى المدينة ليبحث عن الطعام، واكتشف الناس قصتهم، فكانت قصتهم دليلًا على قدرة الله على البعث."
]],
["الدرس",[
"تربط القصة بين الإيمان والشجاعة وحسن الاعتماد على الله، وتعلم أن الإنسان قد يكون ضعيفًا في نظر الناس لكنه قوي بإيمانه."
]]
],
verse:["﴿إِنَّهُمْ فِتْيَةٌ آمَنُوا بِرَبِّهِمْ وَزِدْنَاهُمْ هُدًى﴾","الكهف: 13"],
simple:"الشباب يستطيعون أن يكونوا أصحاب مبدأ وإيمان، والثبات على الحق قد يحتاج إلى شجاعة.",
lessons:["الثبات على الإيمان.","صحبة الصالحين.","الثقة بالله.","تذكر الآخرة."],
sources:["القرآن الكريم: سورة الكهف 9–26."],
video:"uFulKwehKcI"
},

qarun:{
title:"قارون",
category:"قصص القرآن",
icon:"💰",
description:"قصة قارون الذي أغرته أمواله فتكبر ونسب الفضل إلى نفسه.",
chapters:[
["الغنى والاختبار",[
"كان قارون من قوم موسى، وآتاه الله من الأموال ما إن مفاتحه لتنوء بالعصبة أولي القوة. كان المال في حد ذاته نعمة، لكنه تحول إلى اختبار."
]],
["الغرور",[
"نُصح قارون ألا يفرح فرح بطر، وأن يبتغي فيما آتاه الله الدار الآخرة، لكنه نسب ما عنده إلى نفسه وعلمه."
]],
["العاقبة",[
"خسف الله به وبداره، فأصبح ما كان يظنه سببًا لعظمته سببًا في سقوطه، وأدرك الناس أن المال لا ينفع صاحبه إذا صاحبه الكبر."
]]
],
verse:["﴿إِنَّمَا أُوتِيتُهُ عَلَىٰ عِلْمٍ عِندِي﴾","القصص: 78"],
simple:"المال نعمة، لكن قيمته الحقيقية تكون عندما يستخدمه الإنسان في الخير ولا يجعله سببًا للكبر.",
lessons:["الشكر.","التواضع.","عدم الاغترار بالمال.","العمل للآخرة."],
sources:["القرآن الكريم: القصص 76–83."]
},

pharaoh:{
title:"فرعون وموسى",
category:"قصص القرآن",
icon:"👑",
description:"قصة مواجهة موسى عليه السلام لفرعون، وتذكيرها بخطورة الكبر والاستبداد.",
chapters:[
["الطغيان",[
"كان فرعون مستبدًا بقومه، يستضعف بني إسرائيل ويقتل أبناءهم ويستبقي نساءهم. وكان يرى نفسه صاحب السلطة المطلقة."
]],
["دعوة موسى",[
"أرسل الله موسى وهارون إلى فرعون ليقولَا له قولًا لينًا ويدعواه إلى الحق. لكن فرعون استكبر ورفض."
]],
["الآيات",[
"أظهر الله لموسى آياته، وجاء السحرة الذين جمعهم فرعون، فلما رأوا الحق عرفوه وآمنوا بالله رغم تهديد فرعون."
]],
["النهاية",[
"خرج موسى ببني إسرائيل، ولحق بهم فرعون، ثم جاء الفرج للمؤمنين وهلاك فرعون، وبقيت قصته عبرة لمن يغتر بالقوة."
]]
],
verse:["﴿فَالْيَوْمَ نُنَجِّيكَ بِبَدَنِكَ لِتَكُونَ لِمَنْ خَلْفَكَ آيَةً﴾","يونس: 92"],
simple:"السلطة والقوة لا تجعل الإنسان فوق الحق، والظلم مهما طال ليس دليلًا على النجاح.",
lessons:["ترك الكبر.","رفض الظلم.","الثقة بالله.","عاقبة الطغيان."],
sources:["القرآن الكريم: القصص 3–42.","القرآن الكريم: يونس 75–92.","القرآن الكريم: طه 43–79."]
},

maryam:{
title:"مريم عليها السلام",
category:"قصص القرآن",
icon:"🌸",
description:"قصة مريم عليها السلام وعبادتها وبشارة ولادة عيسى عليه السلام.",
chapters:[
["نشأة مريم",[
"اصطفى الله مريم عليها السلام وقبلها بقبول حسن، وأنشأها نشأة طيبة، وكان زكريا عليه السلام يقوم على رعايتها."
]],
["البشارة",[
"جاءتها الملائكة بالبشارة بعيسى عليه السلام، وكانت ولادته آية عظيمة من آيات الله."
]],
["الميلاد",[
"ابتعدت مريم عن قومها، واشتدت عليها لحظة الولادة، ثم رزقها الله الماء والطعام، وأمرها ألا تحزن."
]],
["عودة مريم",[
"عادت مريم إلى قومها وهي تحمل عيسى، فاتهمها بعضهم، فكان كلام عيسى في المهد دفاعًا عنها وإظهارًا للحق."
]]
],
verse:["﴿يَا مَرْيَمُ إِنَّ اللَّهَ اصْطَفَاكِ وَطَهَّرَكِ﴾","آل عمران: 42"],
simple:"قصة مريم تعلمنا العبادة والصبر والحياء والثقة بعناية الله.",
lessons:["العبادة.","الصبر.","الحياء.","الثقة بالله."],
sources:["القرآن الكريم: آل عمران 35–51.","القرآن الكريم: مريم 16–36."]
},

two_gardens:{
title:"صاحب الجنتين",
category:"قصص القرآن",
icon:"🌴",
description:"قصة الرجلين وصاحب الجنتين، وكيف يمكن للنعمة أن تتحول إلى اختبار للغرور.",
chapters:[
["النعمة",[
"ضرب الله مثلًا لرجلين، جعل لأحدهما جنتين من أعناب وأشجار وزروع، وكان له ماء بينهما، فكانت نعمة كبيرة."
]],
["الغرور",[
"أعجب الرجل بماله وجنته، واغتر بقوته وكثرة ماله، وبدأ ينظر إلى صاحبه بنظرة استعلاء."
]],
["النصيحة",[
"ذكّره صاحبه بالله، وقال له ما معناه إن كان قد دخل جنته كان ينبغي أن يقول ما شاء الله لا قوة إلا بالله، وأن يعرف أن النعمة من الله."
]],
["زوال النعمة",[
"أصاب الجنتين أمر من الله فأصبحتا هشيماً، وأصبح الرجل يقلب كفيه على ما أنفق فيها، ولم يجد له قوة ينقذ بها ما فقد."
]]
],
verse:["﴿وَلَوْلَا إِذْ دَخَلْتَ جَنَّتَكَ قُلْتَ مَا شَاءَ اللَّهُ لَا قُوَّةَ إِلَّا بِاللَّهِ﴾","الكهف: 39"],
simple:"عندما ترى نعمة عندك، تذكر أنها من الله ولا تجعلها سببًا للاحتقار أو الكبر.",
lessons:["شكر النعمة.","التواضع.","عدم الاغترار.","تذكر زوال الدنيا."],
sources:["القرآن الكريم: الكهف 32–44."]
},

birth:{
title:"مولد النبي ﷺ",
category:"السيرة النبوية",
icon:"🌙",
description:"بداية حياة النبي محمد ﷺ في مكة، ونشأته في بيئة عربية قبل البعثة.",
chapters:[
["مولده",[
"وُلد محمد ﷺ في مكة من بني هاشم، ونشأ يتيم الأب، ثم فقد أمه وهو صغير، فكان في رعاية جده ثم عمه."
]],
["بيئة مكة",[
"كانت مكة مركزًا مهمًا للعرب، وكانت الكعبة مقصدًا للناس، لكن الشرك والعادات المختلفة كانت منتشرة."
]],
["العناية الإلهية",[
"نشأ النبي ﷺ في ظروف صعبة، ثم عرف بين قومه بالصدق والأمانة، حتى أصبح الناس يثقون به قبل البعثة."
]]
],
verse:["﴿أَلَمْ يَجِدْكَ يَتِيمًا فَآوَىٰ﴾","الضحى: 6"],
simple:"الظروف الصعبة لا تمنع الإنسان من أن يصبح صاحب خلق عظيم ورسالة عظيمة.",
lessons:["الصبر.","الصدق.","الأمانة.","رحمة اليتيم."],
sources:["السيرة النبوية من المصادر المعتمدة.","القرآن الكريم: سورة الضحى."]
},

childhood:{
title:"طفولة النبي ﷺ",
category:"السيرة النبوية",
icon:"🌱",
description:"محطات من طفولة النبي ﷺ ونشأته وما عُرف عنه من صفات قبل البعثة.",
chapters:[
["الطفولة",[
"نشأ النبي ﷺ في رعاية الله، وعاش في بيئة مكة ثم في بني سعد في طفولته، وعرف منذ صغره بصفات حميدة."
]],
["اليُتم",[
"فقد النبي ﷺ والده قبل ولادته، ثم فقد أمه وهو صغير، ثم جده، فتكفله عمه أبو طالب."
]],
["الأخلاق",[
"كبر محمد ﷺ وهو معروف بالصدق والأمانة، ولم يكن معروفًا بالكذب أو الخيانة، حتى صار الناس يثقون به."
]]
],
verse:["﴿وَوَجَدَكَ ضَالًّا فَهَدَىٰ﴾","الضحى: 7"],
simple:"الأخلاق الجميلة لا تحتاج إلى شهرة أو منصب؛ يمكن أن تبدأ منذ الصغر.",
lessons:["الصدق.","الأمانة.","الصبر.","بر الوالدين والأقارب."],
sources:["السيرة النبوية من المصادر المعتمدة.","القرآن الكريم: سورة الضحى."]
},

khadijah:{
title:"خديجة رضي الله عنها",
category:"السيرة النبوية",
icon:"🌷",
description:"قصة خديجة رضي الله عنها وموقفها من النبي ﷺ في بداية الدعوة.",
chapters:[
["خديجة رضي الله عنها",[
"كانت خديجة رضي الله عنها امرأة ذات مكانة وعقل وخلق، وعرفت عن النبي ﷺ الأمانة والصدق قبل زواجهما."
]],
["بداية الوحي",[
"عندما جاء النبي ﷺ من غار حراء بعد أول لقاء بالوحي وكان خائفًا مما حدث، رجع إلى خديجة رضي الله عنها، فكانت سندًا له."
]],
["الموقف العظيم",[
"طمأنته وذكّرته بصفاته الحسنة، ثم ذهبت به إلى ورقة بن نوفل، فبدأت مرحلة جديدة من حياته ﷺ."
]]
],
verse:["﴿وَوَجَدَكَ عَائِلًا فَأَغْنَىٰ﴾","الضحى: 8"],
simple:"في الأوقات الصعبة يحتاج الإنسان إلى شخص يثبته بالكلمة الطيبة والحكمة.",
lessons:["الدعم.","الحكمة.","الوفاء.","قوة الكلمة الطيبة."],
sources:["صحيح البخاري: كتاب بدء الوحي.","السيرة النبوية من المصادر المعتمدة."]
},

hira:{
title:"نزول الوحي وبداية الرسالة",
category:"السيرة النبوية",
icon:"🕋",
description:"بداية الوحي على النبي محمد ﷺ في غار حراء، وانطلاق الرسالة.",
chapters:[
["غار حراء",[
"كان النبي ﷺ قبل البعثة يحب الخلوة والتفكر، وكان يتعبد في غار حراء. وهناك جاءه جبريل عليه السلام بأول الوحي."
]],
["أول الوحي",[
"جاء جبريل عليه السلام إلى النبي ﷺ، ونزلت بداية سورة العلق. وكانت هذه اللحظة بداية الرسالة النبوية."
]],
["العودة إلى خديجة",[
"عاد النبي ﷺ إلى بيته متأثرًا بما حدث، فكانت خديجة رضي الله عنها إلى جواره، ثم ذهب معها إلى ورقة بن نوفل."
]],
["بداية الدعوة",[
"بعد ذلك بدأت مرحلة الدعوة إلى توحيد الله، فآمن بالنبي ﷺ من آمن، وبدأت الرسالة تنتقل من مكة إلى العالم."
]]
],
verse:["﴿اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ﴾","العلق: 1"],
simple:"بدأت الرسالة بكلمة تدعو إلى القراءة باسم الله، وفي ذلك مكانة عظيمة للعلم والمعرفة.",
lessons:["طلب العلم.","التوكل.","الصبر.","الدعوة بالحكمة."],
sources:["صحيح البخاري: كتاب بدء الوحي.","القرآن الكريم: سورة العلق."],
video:"a6x41OnBMlQ"
},

makkah:{
title:"الدعوة في مكة",
category:"السيرة النبوية",
icon:"🕋",
description:"مرحلة الدعوة المكية وما واجهه النبي ﷺ وأصحابه من صعوبات وثبات.",
chapters:[
["الدعوة السرية",[
"بدأ النبي ﷺ دعوته بأقرب الناس إليه، فآمن به عدد من الصحابة، وكانوا يتعلمون القرآن والإيمان بعيدًا عن أذى المشركين."
]],
["الجهر بالدعوة",[
"بعد ذلك أُمر النبي ﷺ بالجهر بالدعوة، فدعا قومه إلى عبادة الله وحده وترك الشرك."
]],
["الأذى",[
"واجه المسلمون أذى شديدًا، لكن النبي ﷺ علّمهم الصبر والثبات وعدم مقابلة الظلم بظلم."
]],
["الهجرة إلى الحبشة",[
"أذن النبي ﷺ لبعض أصحابه بالهجرة إلى الحبشة عندما اشتد الأذى، لأن فيها ملكًا لا يُظلم عنده أحد."
]]
],
verse:["﴿فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ﴾","الروم: 60"],
simple:"مرحلة مكة تعلمنا أن بناء الإيمان يحتاج إلى صبر طويل وثبات على المبدأ.",
lessons:["الصبر.","الثبات.","الرحمة.","الدعوة بالحكمة."],
sources:["السيرة النبوية من المصادر المعتمدة.","القرآن الكريم: المدثر 1–7."]
},

hijrah:{
title:"الهجرة إلى المدينة",
category:"السيرة النبوية",
icon:"🕌",
description:"رحلة الهجرة النبوية من مكة إلى المدينة وما فيها من تخطيط وثقة بالله.",
chapters:[
["الإذن بالهجرة",[
"بعد سنوات من الدعوة في مكة، أذن الله للنبي ﷺ بالهجرة إلى المدينة، حيث وجد المسلمون أنصارًا يحملون رسالة الإسلام."
]],
["التخطيط",[
"أخذ النبي ﷺ بالأسباب، واختار وقت الرحلة، واتخذ رفيقًا هو أبو بكر رضي الله عنه، واختبأ في الغار فترة من الرحلة."
]],
["في الغار",[
"لما اقترب المشركون من الغار، طمأن النبي ﷺ أبا بكر رضي الله عنه بأن الله معهما، كما قال القرآن."
]],
["الوصول",[
"وصل النبي ﷺ إلى المدينة، واستقبله أهلها، وبدأت مرحلة بناء المجتمع المسلم على الإيمان والأخوة."
]]
],
verse:["﴿لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا﴾","التوبة: 40"],
simple:"الثقة بالله لا تعني ترك التخطيط؛ النبي ﷺ جمع بين حسن التوكل وحسن الأخذ بالأسباب.",
lessons:["التخطيط.","التوكل.","الصداقة الصالحة.","الصبر."],
sources:["القرآن الكريم: التوبة 40.","صحيح البخاري: كتاب الهجرة.","السيرة النبوية من المصادر المعتمدة."]
},

madinah:{

icon:"🌿",
description:"بداية المجتمع المسلم في المدينة وبناء الأخوة والمسجد وتنظيم الحياة.",
chapters:[

]],
["المؤاخاة",[
"آخى النبي ﷺ بين المهاجرين والأنصار، فكانت الأخوة والتعاون جزءًا أساسيًا من المجتمع الجديد."
]],
["تنظيم المجتمع",[
"أصبح المجتمع المسلم أكثر تنظيمًا، وقامت العلاقات على العدل والحقوق والتعاون وتحمل المسؤولية."
]]

}

function setupAnimations(){
  const elements = document.querySelectorAll(".reveal");

  const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add("show");
        observer.unobserve(entry.target);
      }
    });
  },{
    threshold:.08
  });

  elements.forEach(el=>observer.observe(el));
}

function updateProgress(){
  const progress = document.getElementById("progress");
  const doc = document.documentElement;

  const scrollTop = window.scrollY;
  const scrollHeight = doc.scrollHeight - doc.clientHeight;

  const percent = scrollHeight > 0
    ? (scrollTop / scrollHeight) * 100
    : 0;

  progress.style.width = Math.min(100,Math.max(0,percent)) + "%";
}

render();
window.addEventListener("scroll",updateProgress,{passive:true});
updateProgress();
