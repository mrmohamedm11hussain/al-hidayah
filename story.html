<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>القصة | الهداية</title>
<meta name="description" content="اقرأ القصة الإسلامية بتفاصيلها، وتعرّف على أهم الدروس والعبر والآيات المرتبطة بها.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   AL HIDAYAH — STORY ENGINE
   M11 — Mr. Mohamed Hussain
========================================================= */

:root{
  --green-950:#05291f;
  --green-900:#07382a;
  --green-800:#0a4a37;
  --green-700:#0e6047;
  --green-600:#147457;

  --gold:#c6a14d;
  --gold-light:#e4c879;

  --cream:#fbfaf5;
  --paper:#ffffff;
  --soft:#f3f5ef;

  --text:#17231f;
  --muted:#68756f;

  --border:rgba(12,64,47,.10);

  --shadow:0 20px 60px rgba(7,56,42,.10);

  --radius-xl:34px;
  --radius-lg:24px;
  --radius-md:18px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 90% 0%,rgba(198,161,77,.10),transparent 24%),
    radial-gradient(circle at 0% 35%,rgba(14,96,71,.06),transparent 26%),
    var(--cream);

  color:var(--text);

  font-family:"Cairo",Tahoma,Arial,sans-serif;

  line-height:1.9;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

button{
  font-family:inherit;
}

/* =========================================================
   TOP PROGRESS
========================================================= */

#readingProgress{
  position:fixed;
  top:0;
  right:0;
  width:0%;
  height:4px;
  background:linear-gradient(
    90deg,
    var(--gold),
    var(--gold-light),
    var(--green-600)
  );
  z-index:9999;
}

/* =========================================================
   NAV
========================================================= */

.navbar{
  position:sticky;
  top:0;
  z-index:500;

  background:rgba(251,250,245,.88);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-bottom:1px solid var(--border);
}

.nav-inner{
  width:min(1180px,92%);
  margin:auto;

  min-height:78px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
}

.brand-mark{
  width:48px;
  height:48px;

  border-radius:16px;

  display:grid;
  place-items:center;

  color:white;

  background:
    radial-gradient(circle at 35% 30%,#e7d18c,#c6a14d 42%,#9a7428);

  box-shadow:
    0 10px 25px rgba(198,161,77,.25);

  font-family:"Amiri",serif;
  font-size:28px;
}

.brand-text{
  display:flex;
  flex-direction:column;
  line-height:1.3;
}

.brand-text strong{
  color:var(--green-900);
  font-size:17px;
}

.brand-text span{
  color:var(--muted);
  font-size:11px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:8px;
}

.nav-links a{
  padding:9px 13px;
  border-radius:12px;
  color:#50615a;
  font-size:14px;
  transition:.25s ease;
}

.nav-links a:hover{
  color:var(--green-800);
  background:rgba(14,96,71,.07);
}

.nav-back{
  border:1px solid var(--border);
  background:white;
  color:var(--green-800)!important;
}

/* =========================================================
   PAGE
========================================================= */

.page{
  width:min(1100px,92%);
  margin:auto;
  padding:36px 0 90px;
}

/* =========================================================
   BREADCRUMB
========================================================= */

.breadcrumbs{
  display:flex;
  align-items:center;
  gap:9px;

  color:#78837e;
  font-size:13px;

  margin-bottom:24px;

  flex-wrap:wrap;
}

.breadcrumbs a{
  color:var(--green-700);
  font-weight:700;
}

.breadcrumbs span{
  opacity:.45;
}

/* =========================================================
   HERO
========================================================= */

.story-hero{
  position:relative;
  overflow:hidden;

  padding:46px;

  border-radius:var(--radius-xl);

  color:white;

  background:
    radial-gradient(
      circle at 85% 20%,
      rgba(228,200,121,.25),
      transparent 28%
    ),
    radial-gradient(
      circle at 10% 90%,
      rgba(255,255,255,.07),
      transparent 28%
    ),
    linear-gradient(
      135deg,
      var(--green-950),
      var(--green-800)
    );

  box-shadow:var(--shadow);

  animation:heroIn .8s ease both;
}

.story-hero::before{
  content:"";
  position:absolute;

  width:260px;
  height:260px;

  border:1px solid rgba(228,200,121,.13);
  border-radius:50%;

  left:-110px;
  bottom:-130px;
}

.story-hero::after{
  content:"";
  position:absolute;

  width:130px;
  height:130px;

  border:1px solid rgba(228,200,121,.10);
  border-radius:50%;

  right:-45px;
  top:-45px;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:780px;
}

.story-category{
  display:inline-flex;
  align-items:center;
  gap:8px;

  padding:7px 13px;

  border-radius:999px;

  background:rgba(228,200,121,.13);
  border:1px solid rgba(228,200,121,.24);

  color:#f1d994;

  font-size:12px;
  font-weight:800;

  margin-bottom:18px;
}

.story-category::before{
  content:"✦";
}

.story-title{
  font-family:"Amiri",serif;

  font-size:clamp(34px,5vw,58px);

  line-height:1.2;

  margin-bottom:15px;
}

.story-description{
  color:rgba(255,255,255,.78);
  font-size:16px;
  max-width:720px;
}

.story-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:25px;
}

.meta-pill{
  display:inline-flex;
  align-items:center;
  gap:7px;

  padding:8px 12px;

  border-radius:999px;

  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);

  color:rgba(255,255,255,.78);

  font-size:12px;
}

/* =========================================================
   QUICK NAV
========================================================= */

.quick-nav{
  display:flex;
  flex-wrap:wrap;
  gap:10px;

  margin:25px 0;
}

.quick-nav a{
  background:white;
  border:1px solid var(--border);

  padding:10px 14px;

  border-radius:14px;

  font-size:13px;
  font-weight:700;

  color:var(--green-800);

  transition:.25s ease;

  box-shadow:0 8px 25px rgba(7,56,42,.04);
}

.quick-nav a:hover{
  transform:translateY(-2px);
  border-color:rgba(198,161,77,.35);
}

/* =========================================================
   CONTENT
========================================================= */

.story-reader{
  margin-top:20px;
}

.story-section{
  background:var(--paper);

  border:1px solid var(--border);

  border-radius:var(--radius-lg);

  padding:34px;

  margin-bottom:20px;

  box-shadow:0 10px 35px rgba(7,56,42,.045);

  animation:rise .7s ease both;
}

.section-heading{
  display:flex;
  align-items:center;
  gap:13px;

  margin-bottom:22px;
}

.section-icon{
  width:43px;
  height:43px;

  flex:none;

  border-radius:14px;

  display:grid;
  place-items:center;

  color:var(--green-900);

  background:
    linear-gradient(
      135deg,
      #f3e4b9,
      #d8bb72
    );

  font-size:18px;
}

.section-heading h2{
  color:var(--green-900);
  font-size:22px;
}

.section-heading p{
  color:var(--muted);
  font-size:12px;
  margin-top:1px;
}

.intro-note{
  padding:18px 20px;

  border-right:4px solid var(--gold);

  background:#fbf8ec;

  border-radius:14px;

  color:#59655f;

  font-size:14px;

  margin-bottom:25px;
}

/* =========================================================
   CHAPTERS
========================================================= */

.chapters{
  display:grid;
  gap:22px;
}

.chapter{
  padding-bottom:22px;
  border-bottom:1px dashed rgba(12,64,47,.13);
}

.chapter:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.chapter-number{
  display:inline-flex;

  width:34px;
  height:34px;

  border-radius:11px;

  align-items:center;
  justify-content:center;

  background:rgba(14,96,71,.08);

  color:var(--green-700);

  font-weight:800;

  margin-bottom:9px;
}

.chapter h3{
  color:var(--green-900);
  font-size:18px;
  margin-bottom:7px;
}

.chapter p{
  color:#47564f;
  font-size:15px;
}

/* =========================================================
   QURAN VERSE
========================================================= */

.verse-card{
  position:relative;

  overflow:hidden;

  padding:32px;

  border-radius:24px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(198,161,77,.17),
      transparent 34%
    ),
    #f8f6ec;

  border:1px solid rgba(198,161,77,.18);

  text-align:center;
}

.verse-card::before{
  content:"❝";

  position:absolute;

  top:-30px;
  right:20px;

  color:rgba(198,161,77,.12);

  font-family:Georgia,serif;
  font-size:120px;
}

.verse-text{
  position:relative;

  font-family:"Amiri",serif;

  color:var(--green-900);

  font-size:25px;

  line-height:2;

  margin-bottom:13px;
}

.verse-reference{
  color:#897340;
  font-size:13px;
  font-weight:800;
}

/* =========================================================
   SIMPLE EXPLANATION
========================================================= */

.explanation{
  background:
    linear-gradient(
      135deg,
      rgba(14,96,71,.06),
      rgba(198,161,77,.06)
    );

  border:1px solid rgba(14,96,71,.09);

  padding:24px;

  border-radius:20px;
}

.explanation-label{
  display:inline-block;

  padding:6px 11px;

  border-radius:999px;

  background:var(--green-800);

  color:white;

  font-size:11px;

  font-weight:800;

  margin-bottom:12px;
}

.explanation p{
  color:#45554e;
  font-size:15px;
}

/* =========================================================
   LESSONS
========================================================= */

.lessons-grid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:13px;
}

.lesson{
  padding:18px;

  border-radius:17px;

  background:#fafbf9;

  border:1px solid var(--border);

  transition:.25s ease;
}

.lesson:hover{
  transform:translateY(-4px);

  box-shadow:
    0 12px 30px rgba(7,56,42,.08);

  border-color:rgba(198,161,77,.28);
}

.lesson-number{
  color:var(--gold);
  font-weight:900;
  font-size:12px;
}

.lesson h3{
  color:var(--green-900);
  font-size:15px;
  margin:5px 0;
}

.lesson p{
  color:var(--muted);
  font-size:12px;
}

/* =========================================================
   VIDEO
========================================================= */

.video-section{
  display:none;

  margin-bottom:20px;

  padding:28px;

  border-radius:28px;

  color:white;

  background:
    radial-gradient(
      circle at 90% 0%,
      rgba(198,161,77,.18),
      transparent 30%
    ),
    linear-gradient(
      145deg,
      #05291f,
      #0b4d39
    );

  box-shadow:0 20px 55px rgba(5,41,31,.16);
}

.video-section.visible{
  display:block;
  animation:rise .7s ease both;
}

.video-heading{
  display:flex;
  align-items:center;
  gap:14px;

  margin-bottom:20px;
}

.video-icon{
  width:50px;
  height:50px;

  display:grid;
  place-items:center;

  border-radius:16px;

  color:var(--green-900);

  background:
    linear-gradient(
      135deg,
      #f0d992,
      #c6a14d
    );

  font-size:19px;
}

.video-heading h2{
  font-size:21px;
}

.video-heading p{
  color:rgba(255,255,255,.65);
  font-size:12px;
  margin-top:2px;
}

.video-frame{
  width:100%;
  aspect-ratio:16/9;

  overflow:hidden;

  border-radius:20px;

  background:#031912;

  box-shadow:
    0 18px 45px rgba(0,0,0,.28);
}

.video-frame iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.video-source{
  color:rgba(255,255,255,.58);
  font-size:11px;
  margin-top:12px;
}

/* =========================================================
   SOURCES
========================================================= */

.sources-list{
  display:grid;
  gap:10px;
}

.source-item{
  display:flex;
  gap:12px;
  align-items:flex-start;

  padding:14px;

  border-radius:14px;

  background:#fafbf9;

  border:1px solid var(--border);
}

.source-mark{
  width:30px;
  height:30px;

  flex:none;

  display:grid;
  place-items:center;

  border-radius:9px;

  background:rgba(14,96,71,.08);

  color:var(--green-700);

  font-size:13px;
}

.source-item strong{
  display:block;

  color:var(--green-900);

  font-size:13px;
}

.source-item span{
  display:block;

  color:var(--muted);

  font-size:11px;

  margin-top:2px;
}

/* =========================================================
   NAVIGATION
========================================================= */

.story-navigation{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:14px;

  margin-top:25px;
}

.story-nav-card{
  background:white;

  border:1px solid var(--border);

  border-radius:20px;

  padding:19px;

  transition:.25s ease;
}

.story-nav-card:hover{
  transform:translateY(-3px);

  box-shadow:var(--shadow);

  border-color:rgba(198,161,77,.30);
}

.story-nav-card small{
  display:block;

  color:var(--muted);

  font-size:11px;

  margin-bottom:4px;
}

.story-nav-card strong{
  color:var(--green-900);

  font-size:14px;
}

.story-nav-card.next{
  text-align:left;
}

/* =========================================================
   ERROR
========================================================= */

.error-page{
  text-align:center;

  background:white;

  border:1px solid var(--border);

  border-radius:30px;

  padding:70px 25px;

  box-shadow:var(--shadow);
}

.error-symbol{
  width:75px;
  height:75px;

  margin:0 auto 18px;

  display:grid;
  place-items:center;

  border-radius:24px;

  background:#f5eee0;

  color:#9b7a38;

  font-size:30px;
}

.error-page h1{
  color:var(--green-900);
  margin-bottom:7px;
}

.error-page p{
  color:var(--muted);
  margin-bottom:25px;
}

.main-button{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  padding:12px 19px;

  border-radius:14px;

  background:var(--green-800);

  color:white;

  font-weight:800;

  font-size:13px;

  transition:.25s ease;
}

.main-button:hover{
  background:var(--green-900);
  transform:translateY(-2px);
}

/* =========================================================
   FOOTER
========================================================= */

footer{
  margin-top:55px;

  padding:30px 0;

  text-align:center;

  color:#829089;

  font-size:12px;
}

footer strong{
  color:var(--green-800);
}

/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes heroIn{
  from{
    opacity:0;
    transform:translateY(18px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(18px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px){

  .nav-inner{
    min-height:68px;
  }

  .nav-links a:not(.nav-back){
    display:none;
  }

  .brand-mark{
    width:43px;
    height:43px;
  }

  .brand-text strong{
    font-size:15px;
  }

  .story-hero{
    padding:30px 23px;
    border-radius:25px;
  }

  .story-title{
    font-size:38px;
  }

  .story-description{
    font-size:14px;
  }

  .story-section{
    padding:24px 18px;
    border-radius:21px;
  }

  .lessons-grid{
    grid-template-columns:1fr;
  }

  .story-navigation{
    grid-template-columns:1fr;
  }

  .story-nav-card.next{
    text-align:right;
  }

  .video-section{
    padding:20px 15px;
    border-radius:22px;
  }

  .video-frame{
    border-radius:15px;
  }

  .verse-card{
    padding:25px 17px;
  }

  .verse-text{
    font-size:21px;
  }
}

</style>
</head>

  const currentIndex =
    order.indexOf(storyId);

  const previousId =
    currentIndex > 0
      ? order[currentIndex - 1]
      : null;

  const nextId =
    currentIndex < order.length - 1
      ? order[currentIndex + 1]
      : null;


  const chaptersHTML =
    story.chapters.map(
      (chapter,index)=>`

        <article class="chapter">

          <div class="chapter-number">
            ${index + 1}

          <h3>
            ${chapter.title}
          </h3>

          <p>
            ${chapter.text}

    ).join("");


  const lessonsHTML =
    story.lessons.map(
      (lesson,index)=>`

          <h3>
            ${lesson[0]}

            ${lesson[1]}

    ).join("");

    story.sources.map(

          <div class="source-mark">

    previousId

          href="story.html?id=${previousId}"

          </small>

          <strong>
            ${stories[previousId].title}

          href="story.html?id=${nextId}"

          <small>
            القصة التالية →

/* =========================================================
   READING PROGRESS
========================================================= */

window.addEventListener(
  "scroll",
  ()=>{

    const progress =
      document.getElementById(
        "readingProgress"
      );

    if(!progress){
      return;
    }

    const scrollTop =
      window.scrollY;

    const documentHeight =
      document.documentElement.scrollHeight
      -
      window.innerHeight;

    const percentage =
      documentHeight > 0
        ? (scrollTop / documentHeight) * 100
        : 0;

    progress.style.width =
      Math.min(
        100,
        Math.max(0,percentage)
      ) + "%";

  }
);

  }
