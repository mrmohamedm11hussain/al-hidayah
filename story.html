<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الهداية | القصة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --green:#123b2a;
    --green2:#1d6044;
    --green3:#2d7c58;
    --gold:#c9a45c;
    --gold2:#e4ca88;
    --cream:#faf7ef;
    --white:#fffdf9;
    --text:#26372e;
    --muted:#748179;
    --border:#e8dfcc;
    --shadow:0 18px 55px rgba(18,59,42,.09);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(circle at 5% 10%,rgba(201,164,92,.10),transparent 28%),
        radial-gradient(circle at 95% 20%,rgba(29,96,68,.08),transparent 30%),
        var(--cream);
    color:var(--text);
    font-family:"Cairo",sans-serif;
    line-height:2;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(250,247,239,.94);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(201,164,92,.25);
}

.nav{
    width:min(1200px,92%);
    min-height:78px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:var(--green);
}

.logo{
    width:48px;
    height:48px;
    border-radius:16px;
    display:grid;
    place-items:center;
    color:var(--gold2);
    background:linear-gradient(135deg,var(--green),var(--green3));
    font-family:"Amiri";
    font-size:31px;
    box-shadow:0 8px 25px rgba(18,59,42,.18);
}

.brand strong{
    display:block;
    font-size:17px;
}

.brand span{
    display:block;
    color:var(--muted);
    font-size:10px;
}

.navlinks{
    display:flex;
    gap:6px;
}

.navlinks a{
    text-decoration:none;
    color:#526159;
    padding:9px 13px;
    border-radius:12px;
    font-size:13px;
}

.navlinks a:hover{
    background:#eee7d8;
    color:var(--green);
}

.hero{
    width:min(1200px,92%);
    margin:42px auto 25px;
    border-radius:32px;
    overflow:hidden;
    background:
        radial-gradient(circle at 85% 15%,rgba(228,202,136,.18),transparent 25%),
        linear-gradient(135deg,#103726,#246b4d);
    color:white;
    box-shadow:var(--shadow);
}

.heroInner{
    padding:55px;
}

.badge{
    display:inline-block;
    padding:7px 14px;
    border-radius:50px;
    color:#f0d995;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(228,202,136,.22);
    font-size:12px;
    margin-bottom:18px;
}

.hero h1{
    font-family:"Amiri",serif;
    font-size:clamp(38px,6vw,68px);
    line-height:1.2;
    margin-bottom:15px;
}

.hero p{
    max-width:800px;
    color:#e7eee9;
    font-size:16px;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:27px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    border:0;
    cursor:pointer;
    font-family:inherit;
    padding:12px 20px;
    border-radius:14px;
    font-weight:700;
    transition:.25s;
}

.btnGold{
    color:#173727;
    background:var(--gold2);
}

.btnGold:hover{
    transform:translateY(-2px);
    background:#efd998;
}

.btnLight{
    color:white;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.18);
}

.btnLight:hover{
    background:rgba(255,255,255,.17);
}

.layout{
    width:min(1200px,92%);
    margin:35px auto 70px;
    display:grid;
    grid-template-columns:minmax(0,1fr) 310px;
    gap:25px;
}

.card{
    background:rgba(255,253,249,.95);
    border:1px solid var(--border);
    border-radius:26px;
    box-shadow:0 12px 38px rgba(18,59,42,.055);
}

.story{
    padding:clamp(25px,5vw,55px);
}

.story h2{
    font-family:"Amiri";
    color:var(--green);
    font-size:32px;
    margin-bottom:25px;
}

.storyText{
    font-family:"Amiri",serif;
    font-size:22px;
    line-height:2.45;
}

.storyText p{
    margin-bottom:25px;
}

.quote{
    margin:30px 0;
    padding:22px 25px;
    border-right:5px solid var(--gold);
    border-radius:16px;
    background:#f4efe3;
}

.quran{
    margin-top:35px;
    padding:28px;
    border-radius:22px;
    color:white;
    background:linear-gradient(135deg,#123b2a,#286d4e);
}

.quranTitle{
    color:#e4ca88;
    font-size:13px;
    font-weight:bold;
    margin-bottom:10px;
}

.quranText{
    font-family:"Amiri";
    font-size:25px;
    line-height:2.1;
}

.quranRef{
    margin-top:12px;
    color:#d7e4db;
    font-size:13px;
}

.lesson{
    margin-top:30px;
    padding:28px;
    border:1px solid #e8d8ad;
    border-radius:22px;
    background:#fff9e9;
}

.lesson h2{
    font-family:"Cairo";
    font-size:21px;
    margin-bottom:8px;
}

.lesson p{
    color:#5d675f;
    font-family:"Cairo";
    font-size:14px;
}

.video{
    margin-top:30px;
    padding:30px;
    text-align:center;
}

.video h2{
    color:var(--green);
    margin-bottom:8px;
}

.video p{
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
}

.videoButton{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:15px 24px;
    background:var(--green);
    color:white;
    text-decoration:none;
    border-radius:15px;
    font-weight:700;
    transition:.25s;
}

.videoButton:hover{
    background:var(--green2);
    transform:translateY(-2px);
}

.videoSmall{
    margin-top:13px;
    color:#8a918c;
    font-size:11px;
}

.side{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.sideCard{
    padding:25px;
}

.sideCard h3{
    color:var(--green);
    font-size:18px;
    margin-bottom:17px;
}

.info{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:11px 0;
    border-bottom:1px solid #eee7da;
    font-size:13px;
}

.info:last-child{
    border-bottom:0;
}

.info span:first-child{
    color:var(--muted);
}

.info span:last-child{
    color:var(--green);
    font-weight:700;
}

.navigation{
    width:min(1200px,92%);
    margin:0 auto 75px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.navigation a{
    padding:20px;
    border-radius:18px;
    background:white;
    border:1px solid var(--border);
    text-decoration:none;
    color:var(--green);
    transition:.25s;
}

.navigation a:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow);
}

.navigation small{
    display:block;
    color:var(--muted);
    margin-bottom:4px;
}

.error{
    width:min(850px,92%);
    margin:90px auto;
    padding:50px;
    text-align:center;
}

.error h1{
    color:var(--green);
}

.error a{
    display:inline-block;
    margin-top:20px;
    background:var(--green);
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:13px;
}

footer{
    padding:35px 20px;
    background:#0d3021;
    color:#dbe6df;
    text-align:center;
}

footer strong{
    color:#e4ca88;
}

footer small{
    display:block;
    color:#99aea2;
    margin-top:7px;
}

@media(max-width:900px){

    .navlinks{
        display:none;
    }

    .layout{
        grid-template-columns:1fr;
    }

    .heroInner{
        padding:35px 25px;
    }
}

@media(max-width:600px){

    .hero{
        border-radius:22px;
        margin-top:20px;
    }

    .hero h1{
        font-size:41px;
    }

    .story{
        padding:22px;
    }

    .storyText{
        font-size:19px;
        line-height:2.25;
    }

    .quranText{
        font-size:22px;
    }

    .navigation{
        grid-template-columns:1fr;
    }
}
</style>
</head>
