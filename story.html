<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f3d2e">
<title>القصة | الهداية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --green:#0f3d2e;
  --green2:#14543f;
  --green3:#1c6b50;
  --gold:#c7a15a;
  --gold2:#e4c98a;
  --cream:#fbf8f0;
  --paper:#fffdf8;
  --text:#19382d;
  --muted:#718078;
  --line:#e8e2d4;
  --shadow:0 18px 45px rgba(15,61,46,.10);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Cairo",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 0%,rgba(199,161,90,.09),transparent 28%),
    linear-gradient(180deg,#fdfbf6,#f5f2e9);
  min-height:100vh;
}

a{
  color:inherit;
  text-decoration:none;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(253,251,246,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}

.progress{
  position:absolute;
  bottom:-1px;
  right:0;
  height:3px;
  width:0;
  background:linear-gradient(90deg,var(--gold),var(--green3));
}

.nav{
  width:min(1100px,calc(100% - 30px));
  min-height:70px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-mark{
  width:43px;
  height:43px;
  border-radius:14px;
  display:grid;
  place-items:center;
  color:var(--gold2);
  background:linear-gradient(145deg,var(--green),var(--green3));
  font-family:"Amiri",serif;
  font-size:26px;
}

.brand strong{
  display:block;
  color:var(--green);
  font-size:16px;
}

.brand span{
  color:var(--muted);
  font-size:10px;
}

.back{
  color:var(--green);
  font-size:13px;
  font-weight:800;
  padding:9px 13px;
  border-radius:12px;
}

.back:hover{
  background:#f0ede4;
}

.container{
  width:min(900px,calc(100% - 30px));
  margin:auto;
}

.breadcrumb{
  padding:25px 0 13px;
  color:var(--muted);
  font-size:12px;
}

.breadcrumb a{
  color:var(--green);
  font-weight:800;
}

.hero{
  background:linear-gradient(135deg,var(--green),#174b3a);
  color:white;
  border-radius:30px;
  padding:40px;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.hero:before,
.hero:after{
  content:"";
  position:absolute;
  border:1px solid rgba(228,201,138,.20);
  border-radius:50%;
}

.hero:before{
  width:300px;
  height:300px;
  left:-160px;
  top:-170px;
}

.hero:after{
  width:210px;
  height:210px;
  right:-100px;
  bottom:-120px;
}

.tag{
  color:var(--gold2);
  font-size:12px;
  font-weight:800;
  margin-bottom:9px;
}

.hero h1{
  font-family:"Amiri",serif;
  font-size:clamp(38px,6vw,58px);
  line-height:1.15;
  margin-bottom:10px;
}

.hero p{
  color:rgba(255,255,255,.78);
  line-height:1.95;
  font-size:14px;
  max-width:690px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:20px;
}

.meta span{
  padding:7px 11px;
  border-radius:99px;
  background:rgba(255,255,255,.10);
  color:rgba(255,255,255,.84);
  font-size:11px;
}

.reader{
  margin:24px 0;
}

.chapter{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:27px;
  padding:31px;
  margin-bottom:18px;
  box-shadow:0 10px 30px rgba(15,61,46,.05);
}

.chapter h2{
  color:var(--green);
  font-family:"Amiri",serif;
  font-size:30px;
  margin-bottom:15px;
}

.chapter p{
  font-family:"Amiri",serif;
  font-size:22px;
  line-height:2.15;
  color:#2c4037;
}

.note{
  border-right:4px solid var(--gold);
  background:#f6f1e5;
  border-radius:16px;
  padding:17px 19px;
  margin-top:20px;
  color:#52635b;
  font-size:13px;
  line-height:1.9;
}

.note strong{
  color:var(--green);
  display:block;
  margin-bottom:3px;
}

.quran-box{
  background:
    radial-gradient(circle at 90% 10%,rgba(228,201,138,.14),transparent 28%),
    linear-gradient(145deg,#f3f6f1,#fbf8f0);
  border:1px solid #dfe4da;
  border-radius:24px;
  padding:28px;
  margin-top:22px;
}

.quran-label{
  color:var(--gold);
  font-weight:800;
  font-size:12px;
  margin-bottom:10px;
}

.ayah{
  font-family:"Amiri",serif;
  font-size:25px;
  line-height:2.15;
  color:var(--green);
  min-height:40px;
}

.ayah-source{
  margin-top:13px;
  color:var(--muted);
  font-size:11px;
}

.loading{
  color:var(--muted);
  font-size:13px;
}

.lessons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:16px;
}

.lesson{
  background:#faf8f2;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
}

.lesson b{
  display:block;
  color:var(--green);
  margin-bottom:6px;
  font-size:13px;
}

.lesson span{
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
}

.source{
  color:var(--muted);
  font-size:12px;
  line-height:1.9;
}

.source strong{
  color:var(--green);
}

.video{
  margin-top:20px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:27px;
  padding:25px;
  box-shadow:0 10px 30px rgba(15,61,46,.05);
}

.video h2{
  font-family:"Amiri",serif;
  color:var(--green);
  font-size:29px;
  margin-bottom:13px;
}

.video-frame{
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:19px;
  background:#12251e;
}

.video-frame iframe{
  width:100%;
  height:100%;
  border:0;
}

.video-note{
  color:var(--muted);
  font-size:11px;
  margin-top:10px;
}

.navigation{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:20px 0 45px;
}

.nav-story{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:19px;
  padding:18px;
  transition:.2s;
}

.nav-story:hover{
  transform:translateY(-2px);
  border-color:#d7c18d;
}

.nav-story small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:4px;
}

.nav-story strong{
  color:var(--green);
  font-family:"Amiri",serif;
  font-size:21px;
}

.error{
  margin:35px 0;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:25px;
  padding:45px 25px;
  text-align:center;
}

.error h1{
  color:var(--green);
  font-family:"Amiri",serif;
  margin-bottom:8px;
}

.error p{
  color:var(--muted);
  margin-bottom:20px;
}

.error a{
  display:inline-flex;
  padding:12px 20px;
  background:var(--green);
  color:white;
  border-radius:14px;
  font-weight:800;
}

.footer{
  text-align:center;
  color:#8b918c;
  font-size:12px;
  padding:10px 0 45px;
}

@media(max-width:700px){
  .hero{
    padding:29px 22px;
    border-radius:23px;
  }

  .chapter{
    padding:23px 18px;
    border-radius:22px;
  }

  .chapter p{
    font-size:20px;
  }

  .lessons{
    grid-template-columns:1fr;
  }

  .navigation{
    grid-template-columns:1fr;
  }

  .quran-box{
    padding:21px 17px;
  }

  .ayah{
    font-size:22px;
  }
}

@media(max-width:480px){
  .container,
  .nav{
    width:min(100% - 20px,900px);
  }

  .brand span{
    display:none;
  }

  .back{
    font-size:11px;
  }

  .meta span{
    font-size:10px;
  }
}
</style>
</head>

</header>

<main class="container">

    <span id="crumb">القصة</span>

  <div id="app"></div>

</main>

      ["الهداية","أعظم الهداية هي الهداية إلى توحيد الله."]
    ],
    source:"القرآن الكريم — سورة العلق. وأحاديث بدء الوحي في صحيح البخاري.",
    video:"https://www.youtube-nocookie.com/embed/a6x41OnBMlQ"
  }
};

const order=[
  "adam",
  "nuh",
  "ibrahim",
  "musa",
  "yunus",
  "kahf",
  "hira"
];

const params=new URLSearchParams(location.search);
const id=params.get("id");
const story=stories[id];

const app=document.getElementById("app");
const crumb=document.getElementById("crumb");

function escapeHTML(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function renderError(){
  document.title="القصة غير موجودة | الهداية";

  app.innerHTML=`
    <section class="error">
      <h1>القصة غير موجودة</h1>
      <p>هذه الصفحة غير متاحة حاليًا.</p>
      <a href="stories.html">العودة إلى القصص</a>
    </section>
  `;
}

async function loadAyah(surah,ayah){
  const box=document.getElementById("ayah");

  try{
    const response=await fetch(
      "https://api.alquran.cloud/v1/ayah/" +
      surah +
      ":" +
      ayah +
      "/quran-uthmani"
    );

    if(!response.ok) throw new Error("Quran API error");

    const json=await response.json();

    const text=json?.data?.text;

    if(!text) throw new Error("No ayah");

    box.textContent=text;

    const source=document.getElementById("ayahSource");
    source.textContent=
      "سورة " +
      (json.data.surah?.name || "") +
      " — الآية " +
      ayah;

  }catch(error){
    box.textContent="تعذر تحميل الآية حاليًا.";
    document.getElementById("ayahSource").textContent=
      "يمكنك المحاولة مرة أخرى عند توفر الاتصال.";
  }
}

function render(){
  if(!story){
    renderError();
    return;
  }

  document.title=story.title+" | الهداية";
  crumb.textContent=story.title;

  const chapterHTML=story.chapters.map(chapter=>`
    <article class="chapter">
      <h2>${escapeHTML(chapter.title)}</h2>
      <p>${escapeHTML(chapter.text)}</p>
    </article>
  `).join("");

  const lessonsHTML=story.lessons.map(item=>`
    <div class="lesson">
      <b>${escapeHTML(item[0])}</b>
      <span>${escapeHTML(item[1])}</span>
    </div>
  `).join("");

  const index=order.indexOf(id);

  const previous=
    index>0
      ? order[index-1]
      : null;

  const next=
    index<order.length-1
      ? order[index+1]
      : null;

  const previousHTML=previous
    ? `
      <a class="nav-story" href="story.html?id=${previous}">
        <small>القصة السابقة</small>
        <strong>${escapeHTML(stories[previous].title)}</strong>
      </a>
    `
    : `
      <div></div>
    `;

  const nextHTML=next
    ? `
      <a class="nav-story" href="story.html?id=${next}">
        <small>القصة التالية</small>
        <strong>${escapeHTML(stories[next].title)}</strong>
      </a>
    `
    : `
      <a class="nav-story" href="stories.html">
        <small>انتهت القائمة</small>
        <strong>كل القصص ←</strong>
      </a>
    `;

  app.innerHTML=`

    <section class="hero">
      <div class="tag">${escapeHTML(story.category)}</div>

      <h1>${escapeHTML(story.title)}</h1>

      <p>${escapeHTML(story.description)}</p>

      <div class="meta">
        <span>📖 قراءة</span>
        <span>${escapeHTML(story.time)}</span>
        <span>🌿 فهم مبسط</span>
      </div>
    </section>

    <section class="reader">

      ${chapterHTML}

      <div class="quran-box">

        <div class="quran-label">
          آية مرتبطة بالقصة
        </div>

        <div class="ayah" id="ayah">
          <span class="loading">جاري تحميل الآية...</span>
        </div>

        <div class="ayah-source" id="ayahSource"></div>

      </div>

      <article class="chapter">

        <h2>فهم مبسط</h2>

        <div class="note">
          <strong>تنبيه</strong>
          هذا القسم شرح مبسط للمعنى العام للقصة،
          وليس نصًا من القرآن الكريم ولا تفسيرًا حرفيًا.
        </div>

        <div class="lessons">
          ${lessonsHTML}
        </div>

      </article>

      <article class="chapter">

        <h2>المصادر</h2>

        <p class="source">
          <strong>المصدر:</strong>
          ${escapeHTML(story.source)}
        </p>

      </article>

      ${
        story.video
        ? `
          <section class="video">

            <h2>فيديو عن القصة</h2>

            <div class="video-frame">
              <iframe
                src="${story.video}"
                title="${escapeHTML(story.title)}"
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
              </iframe>
            </div>

            <div class="video-note">
              الفيديو إضافة اختيارية للقصة، ويمكنك قراءة القصة كاملة بدونه.
            </div>

          </section>
        `
        : ""
      }

      <div class="navigation">
        ${previousHTML}
        ${nextHTML}
      </div>

    </section>
  `;

  loadAyah(story.ayah[0],story.ayah[1]);

  try{
    localStorage.setItem("hidayahLastStory",id);
  }catch{}
}

function updateReadingProgress(){
  const doc=document.documentElement;

  const scrollTop=
    window.scrollY ||
    doc.scrollTop ||
    0;

  const max=
    doc.scrollHeight -
    window.innerHeight;

  const percent=
    max>0
      ? Math.min(100,(scrollTop/max)*100)
      : 0;

  document.getElementById("readingProgress")
    .style.width=percent+"%";
}

window.addEventListener(
  "scroll",
  updateReadingProgress,
  {passive:true}
);

render();
updateReadingProgress();
</script>

</body>
</html>
