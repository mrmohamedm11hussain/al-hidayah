<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القصة | الهداية</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap');

:root{
  --green:#0b3d2e;
  --green2:#145c43;
  --green3:#1b7655;
  --gold:#c8a45d;
  --gold2:#e0c27b;
  --cream:#fbf8f0;
  --paper:#fffdf8;
  --text:#17231e;
  --muted:#69756f;
  --border:rgba(11,61,46,.12);
  --shadow:0 20px 60px rgba(11,61,46,.12);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Cairo",sans-serif;
  background:
    radial-gradient(circle at 10% 10%,rgba(200,164,93,.09),transparent 25%),
    radial-gradient(circle at 90% 20%,rgba(20,92,67,.08),transparent 25%),
    var(--cream);
  color:var(--text);
  line-height:1.9;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(11,61,46,.96);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(224,194,123,.2);
}

.nav{
  width:min(1200px,92%);
  margin:auto;
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  color:white;
  text-decoration:none;
  font-weight:800;
  font-size:1.25rem;
}

.logo-mark{
  width:44px;
  height:44px;
  border-radius:14px;
  display:grid;
  place-items:center;
  color:var(--gold2);
  font-family:"Amiri",serif;
  font-size:1.8rem;
  border:1px solid rgba(224,194,123,.4);
  background:linear-gradient(145deg,#174f3c,#092e23);
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.nav-links{
  display:flex;
  align-items:center;
  gap:7px;
}

.nav-links a{
  color:rgba(255,255,255,.8);
  text-decoration:none;
  padding:9px 14px;
  border-radius:12px;
  font-size:.9rem;
  transition:.25s;
}

.nav-links a:hover,
.nav-links a.active{
  color:white;
  background:rgba(255,255,255,.1);
}

.back{
  color:var(--gold2);
  text-decoration:none;
  font-size:.9rem;
  font-weight:700;
}

/* ================= PAGE ================= */

.page{
  width:min(1100px,92%);
  margin:45px auto 80px;
}

/* ================= HERO ================= */

.story-hero{
  position:relative;
  overflow:hidden;
  min-height:420px;
  border-radius:32px;
  padding:55px 55px;
  display:flex;
  align-items:flex-end;
  background:
    linear-gradient(120deg,rgba(5,35,26,.97),rgba(11,61,46,.87)),
    radial-gradient(circle at 80% 20%,rgba(224,194,123,.3),transparent 30%);
  box-shadow:var(--shadow);
  color:white;
}

.story-hero::before{
  content:"";
  position:absolute;
  width:400px;
  height:400px;
  border-radius:50%;
  border:1px solid rgba(224,194,123,.18);
  right:-150px;
  top:-170px;
  box-shadow:
    0 0 0 35px rgba(224,194,123,.035),
    0 0 0 75px rgba(224,194,123,.025);
}

.story-hero::after{
  content:"✦";
  position:absolute;
  color:rgba(224,194,123,.5);
  font-size:80px;
  left:8%;
  top:15%;
  animation:float 5s ease-in-out infinite;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:760px;
}

.category{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 14px;
  border-radius:999px;
  background:rgba(224,194,123,.12);
  border:1px solid rgba(224,194,123,.28);
  color:var(--gold2);
  font-size:.85rem;
  margin-bottom:18px;
}

.story-hero h1{
  font-family:"Amiri",serif;
  font-size:clamp(2.4rem,6vw,4.7rem);
  line-height:1.2;
  margin-bottom:15px;
}

.story-hero p{
  color:rgba(255,255,255,.78);
  font-size:1.05rem;
  max-width:700px;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:28px;
}

.btn{
  border:0;
  cursor:pointer;
  text-decoration:none;
  font-family:inherit;
  font-weight:800;
  padding:12px 21px;
  border-radius:14px;
  transition:.25s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.btn-gold{
  color:#183327;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
}

.btn-gold:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(224,194,123,.2);
}

.btn-light{
  color:white;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
}

.btn-light:hover{
  background:rgba(255,255,255,.15);
}

/* ================= LAYOUT ================= */

.content-grid{
  margin-top:28px;
  display:grid;
  grid-template-columns:1fr 300px;
  gap:25px;
}

.main-card,
.side-card{
  background:rgba(255,253,248,.92);
  border:1px solid var(--border);
  border-radius:26px;
  box-shadow:0 12px 40px rgba(11,61,46,.07);
}

.main-card{
  padding:38px;
}

.side-card{
  padding:24px;
  height:max-content;
  position:sticky;
  top:100px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
}

.section-title span{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:rgba(200,164,93,.13);
  color:#99772f;
}

.section-title h2{
  font-size:1.35rem;
  color:var(--green);
}

.story-text{
  font-family:"Amiri",serif;
  font-size:1.35rem;
  line-height:2.25;
  color:#26352e;
}

.story-text p{
  margin-bottom:24px;
}

.dropcap:first-letter{
  color:var(--gold);
  font-size:3.4rem;
  font-weight:bold;
  float:right;
  line-height:1;
  padding-left:8px;
}

/* ================= VERSE ================= */

.verse{
  margin:30px 0;
  padding:28px;
  border-radius:22px;
  background:
    linear-gradient(135deg,rgba(11,61,46,.97),rgba(20,92,67,.96));
  color:white;
  position:relative;
  overflow:hidden;
}

.verse::before{
  content:"۞";
  position:absolute;
  left:20px;
  top:8px;
  color:rgba(224,194,123,.18);
  font-size:100px;
}

.verse-label{
  color:var(--gold2);
  font-size:.8rem;
  font-weight:bold;
  margin-bottom:13px;
}

.verse-text{
  font-family:"Amiri",serif;
  font-size:1.5rem;
  line-height:2.1;
  position:relative;
}

.verse-ref{
  color:rgba(255,255,255,.65);
  margin-top:14px;
  font-size:.85rem;
}

/* ================= LESSON ================= */

.lesson{
  margin-top:30px;
  padding:27px;
  border-radius:22px;
  background:#f5f0e2;
  border:1px solid rgba(200,164,93,.2);
}

.lesson h3{
  color:var(--green);
  margin-bottom:12px;
}

.lesson p{
  color:#49574f;
}

/* ================= AUDIO ================= */

.audio-box{
  margin-top:30px;
  padding:25px;
  border-radius:22px;
  background:linear-gradient(135deg,#f5f8f5,#edf3ef);
  border:1px solid rgba(11,61,46,.1);
}

.audio-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.audio-head h3{
  color:var(--green);
}

.audio-controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.audio-controls button{
  border:0;
  cursor:pointer;
  font-family:inherit;
  font-weight:bold;
  padding:10px 16px;
  border-radius:12px;
  color:white;
  background:var(--green);
}

.audio-controls button.secondary{
  background:#d9e3dd;
  color:var(--green);
}

/* ================= SIDEBAR ================= */

.side-card h3{
  color:var(--green);
  margin-bottom:18px;
}

.info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
  font-size:.9rem;
}

.info:last-child{
  border-bottom:0;
}

.info span:first-child{
  color:var(--muted);
}

.info span:last-child{
  color:var(--green);
  font-weight:700;
}

.source-list{
  margin-top:25px;
}

.source-list a{
  display:block;
  color:var(--green);
  text-decoration:none;
  padding:10px 0;
  border-bottom:1px solid var(--border);
  font-size:.9rem;
}

.source-list a:hover{
  color:#99772f;
}

/* ================= NEXT ================= */

.next-story{
  margin-top:28px;
  padding:25px;
  border-radius:23px;
  background:var(--green);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.next-story small{
  color:rgba(255,255,255,.65);
}

.next-story h3{
  color:white;
  margin-top:4px;
}

/* ================= ERROR ================= */

.error{
  text-align:center;
  padding:80px 20px;
  background:white;
  border-radius:28px;
  box-shadow:var(--shadow);
}

.error-icon{
  font-size:60px;
  margin-bottom:15px;
}

.error h1{
  color:var(--green);
  margin-bottom:10px;
}

/* ================= FOOTER ================= */

footer{
  margin-top:80px;
  padding:35px 20px;
  text-align:center;
  background:#082f24;
  color:rgba(255,255,255,.65);
}

footer strong{
  color:var(--gold2);
}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-12px) rotate(5deg)}
}

.fade{
  animation:fade .55s ease both;
}

@keyframes fade{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}

/* ================= MOBILE ================= */

@media(max-width:850px){
  .nav-links{
    display:none;
  }

  .content-grid{
    grid-template-columns:1fr;
  }

  .side-card{
    position:static;
  }

  .story-hero{
    padding:35px 25px;
    min-height:390px;
  }

  .main-card{
    padding:25px 20px;
  }

  .story-text{
    font-size:1.2rem;
  }
}

@media(max-width:500px){
  .page{
    width:94%;
    margin-top:25px;
  }

  .story-hero{
    border-radius:23px;
  }

  .story-hero h1{
    font-size:2.4rem;
  }

  .next-story{
    align-items:flex-start;
    flex-direction:column;
  }
}
</style>
</head>

  verse:"إِنَّهُ مَن يَتَّقِ وَيَصْبِرْ فَإِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ",
  ref:"سورة يوسف — الآية 90",
  lesson:"الصبر والتقوى قد يأخذان وقتًا طويلًا، لكن الله لا يضيع أجر المحسنين.",
  source:"سورة يوسف كاملة",
  next:"musa"
},

musa:{
  title:"موسى عليه السلام",
  category:"قصص الأنبياء",
  intro:"قصة موسى عليه السلام في مواجهة فرعون، وخروج بني إسرائيل، ونجاة المؤمنين.",
  era:"الأنبياء",
  quran:"طه 9–79",
  text:[
    "ولد موسى عليه السلام في زمن كان فرعون يقتل أبناء بني إسرائيل. أوحى الله إلى أمه أن تضعه في التابوت وتلقيه في اليم، ووعدها أن يرده إليها.",
    "وصل موسى إلى بيت فرعون، ونشأ فيه بعناية الله. ثم كبر وخرج من مصر، وبعد سنوات اصطفاه الله وأرسله إلى فرعون.",
    "واجه موسى فرعون ودعاه إلى توحيد الله، وأيده الله بالآيات. لكن فرعون استكبر وكذب.",
    "خرج موسى ببني إسرائيل، ولحق بهم فرعون وجنوده. وعندما وصلوا إلى البحر، أوحى الله إلى موسى أن يضرب البحر بعصاه، فانفلق ونجا موسى ومن معه، وغرق فرعون وجنوده."
  ],
  verse:"كَلَّا ۖ إِنَّ مَعِيَ رَبِّي سَيَهْدِينِ",
  ref:"سورة الشعراء — الآية 62",
  lesson:"عندما تضيق الأسباب أمام الإنسان، يبقى اليقين بالله سببًا للقوة والثبات.",
  source:"سورة طه، سورة القصص، سورة الشعراء",
  next:"yunus"
},

yunus:{
  title:"يونس عليه السلام",
  category:"قصص الأنبياء",
  intro:"قصة يونس عليه السلام، والابتلاء، والدعاء، والنجاة برحمة الله.",
  era:"الأنبياء",
  quran:"الأنبياء 87–88",
  text:[
    "أرسل الله يونس عليه السلام إلى قومه يدعوهم إلى الله. وخرج منهم قبل أن يؤذن له، فكان ذلك ابتلاءً له.",
    "ركب يونس سفينة، ثم وقعت القرعة عليه، فألقي في البحر، فابتلعه الحوت بأمر الله.",
    "في ظلمات البحر وبطن الحوت، دعا يونس ربه معترفًا بخطئه، فاستجاب الله له ونجاه.",
    "أصبح دعاء يونس من أعظم الأدعية التي تذكر المؤمن بالتوحيد والاعتراف بالتقصير والرجوع إلى الله."
  ],
  verse:"لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ",
  ref:"سورة الأنبياء — الآية 87",
  lesson:"عندما يخطئ الإنسان، فإن أفضل طريق هو الاعتراف والرجوع إلى الله وعدم اليأس من رحمته.",
  source:"سورة الأنبياء: 87–88، وسورة الصافات",
  next:"ayoub"
},

ayoub:{
  title:"أيوب عليه السلام",
  category:"قصص الأنبياء",
  intro:"قصة أيوب عليه السلام والصبر على الابتلاء والرجوع إلى الله.",
  era:"الأنبياء",
  quran:"الأنبياء 83–84",
  text:[
    "ابتُلي أيوب عليه السلام ابتلاءً شديدًا، ومع ذلك بقي متعلقًا بالله ولم يفقد حسن ظنه بربه.",
    "دعا أيوب ربه، ولم يكن دعاؤه اعتراضًا على قدر الله، بل كان رجوعًا إلى رحمة الله.",
    "استجاب الله له، وكشف عنه الضر، ورد عليه نعمته. وأصبحت قصته مثالًا خالدًا في الصبر.",
    "الصبر لا يعني أن الإنسان لا يشعر بالألم، بل يعني ألا يفقد ثقته بالله أثناء الألم."
  ],
  verse:"أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ",
  ref:"سورة الأنبياء — الآية 83",
  lesson:"الصبر والثقة بالله لا تضيعان، ورحمة الله أوسع من كل ابتلاء.",
  source:"سورة الأنبياء: 83–84، وسورة ص: 41–44",
  next:"sulaiman"
},

sulaiman:{
  title:"سليمان عليه السلام",
  category:"قصص الأنبياء",
  intro:"قصة سليمان عليه السلام وما منحه الله من الملك والعلم، وقصة ملكة سبأ.",
  era:"الأنبياء",
  quran:"النمل 15–44",
  text:[
    "كان سليمان عليه السلام نبيًا وملكًا، وآتاه الله علمًا وملكًا عظيمًا، وسخر له من جنوده الإنس والجن والطير بإذن الله.",
    "تفقد سليمان الطير، فلاحظ غياب الهدهد. ثم عاد الهدهد بخبر عن قوم في سبأ تحكمهم امرأة وكانوا يسجدون للشمس.",
    "أرسل سليمان رسالة إلى ملكة سبأ يدعوها وقومها إلى الله، ثم جرت أحداث عظيمة حتى جاءت الملكة إلى سليمان.",
    "وفي النهاية أدركت ملكة سبأ الحق وقالت إنها أسلمت مع سليمان لله رب العالمين."
  ],
  verse:"رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ",
  ref:"سورة النمل — الآية 19",
  lesson:"القوة والملك والعلم نعم، لكن أعظم ما يصنعه الإنسان بهذه النعم هو شكر الله واستخدامها في الخير.",
  source:"سورة النمل: 15–44",
  next:"dawud"
},

dawud:{
  title:"داود عليه السلام",
  category:"قصص الأنبياء",
  intro:"قصة داود عليه السلام، والملك، والحكمة، والانتصار على جالوت.",
  era:"الأنبياء",
  quran:"البقرة 246–251",
  text:[
    "كان داود عليه السلام من عباد الله الصالحين، وآتاه الله الملك والحكمة.",
    "في قصة طالوت وجالوت، ظهر داود بشجاعته وإيمانه، وتمكن بإذن الله من قتل جالوت.",
    "بعد ذلك آتاه الله الملك والحكمة، وعلّمه مما يشاء.",
    "وتذكر قصته بأن النصر لا يرتبط بكثرة العدد وحدها، وإنما بالإيمان والطاعة والتوكل على الله."
  ],
  verse:"وَقَتَلَ دَاوُودُ جَالُوتَ وَآتَاهُ اللَّهُ الْمُلْكَ وَالْحِكْمَةَ",
  ref:"سورة البقرة — الآية 251",
  lesson:"قد تكون الإمكانات محدودة، لكن الإيمان والثبات قد يصنعان فرقًا كبيرًا.",
  source:"سورة البقرة: 246–251، وسورة ص",
  next:"kahf"
},

kahf:{
  title:"أصحاب الكهف",
  category:"قصص القرآن",
  intro:"قصة مجموعة من الفتية الذين ثبتوا على الإيمان فحفظهم الله.",
  era:"قصة قرآنية",
  quran:"سورة الكهف 9–26",
  text:[
    "كان أصحاب الكهف مجموعة من الفتية آمنوا بربهم ورفضوا الشرك الذي كان منتشرًا في قومهم.",
    "عندما اشتد عليهم الأمر، اعتزلوا قومهم ولجؤوا إلى الكهف، وسألوا الله رحمته وهدايته.",
    "أنامهم الله في الكهف سنين طويلة، ثم بعثهم ليكون أمرهم آية للناس.",
    "تخبرنا القصة أن الثبات على الإيمان قد يحتاج إلى شجاعة، وأن الله قادر على حفظ عباده بطرق لا يتوقعونها."
  ],
  verse:"إِنَّهُمْ فِتْيَةٌ آمَنُوا بِرَبِّهِمْ وَزِدْنَاهُمْ هُدًى",
  ref:"سورة الكهف — الآية 13",
  lesson:"الثبات على الإيمان يحتاج إلى شجاعة، والله يزيد من يتمسك بالحق هدى.",
  source:"سورة الكهف: 9–26",
  next:"qarun"
},

qarun:{
  title:"قارون",
  category:"قصص القرآن",
  intro:"قصة قارون، والغنى الذي تحول إلى سبب للغرور، ثم كانت نهايته عبرة.",
  era:"قصة قرآنية",
  quran:"القصص 76–82",
  text:[
    "كان قارون من قوم موسى، وآتاه الله من الأموال ما إن مفاتحه لتنوء بالعصبة أولي القوة.",
    "لكن المال جعله مغرورًا، فنسب ما عنده إلى علمه وقدرته ولم يشكر نعمة الله.",
    "نصحَه قومه ألا يفرح فرح بطر، وأن يبتغي فيما آتاه الله الدار الآخرة، لكنه استمر في غروره.",
    "فخسف الله به وبداره الأرض، وأصبح ما حدث له عبرة لكل من يغتر بالمال وينسى المنعم."
  ],
  verse:"وَابْتَغِ فِيمَا آتَاكَ اللَّهُ الدَّارَ الْآخِرَةَ",
  ref:"سورة القصص — الآية 77",
  lesson:"المال نعمة، لكنه يصبح خطرًا عندما يجعل صاحبه ينسى الله ويتكبر على الناس.",
  source:"سورة القصص: 76–82",
  next:"pharaoh"
},

pharaoh:{
  title:"فرعون",
  category:"قصص القرآن",
  intro:"قصة فرعون واستكباره في الأرض ومواجهته لموسى عليه السلام.",
  era:"قصة قرآنية",
  quran:"طه 24–79",
  text:[
    "كان فرعون حاكمًا متكبرًا، طغى في الأرض وجعل أهلها شيعًا واستضعف طائفة منهم.",
    "أرسل الله إليه موسى وهارون عليهما السلام ليدعواه إلى عبادة الله وترك الطغيان.",
    "جاء موسى بالآيات، لكن فرعون كذب واستكبر واتهم موسى بالسحر.",
    "انتهى أمر فرعون عندما تبع موسى وبني إسرائيل، فأغرقه الله، وأصبح مصيره عبرة للطغاة والمتكبرين."
  ],
  verse:"إِنَّ فِي ذَٰلِكَ لَعِبْرَةً لِّمَن يَخْشَىٰ",
  ref:"سورة النازعات — الآية 26",
  lesson:"القوة والسلطة لا تمنح الإنسان الحق في الظلم، ونهاية الظلم مهما طال ليست نجاة.",
  source:"سورة القصص، سورة طه، سورة الشعراء، سورة يونس",
  next:"maryam"
},

maryam:{
  title:"مريم عليها السلام",
  category:"قصص القرآن",
  intro:"قصة مريم عليها السلام وولادة عيسى عليه السلام بمعجزة من الله.",
  era:"قصة قرآنية",
  quran:"مريم 16–36",
  text:[
    "كانت مريم عليها السلام عابدة صالحة اصطفاها الله وطهرها. وكانت تعيش في عبادة الله وطاعته.",
    "بشرها الملك بعيسى عليه السلام، فتعجبت كيف يكون لها ولد ولم يمسسها بشر، فأخبرها أن الأمر خلق من الله.",
    "حملت مريم بعيسى، ثم جاءها المخاض عند جذع النخلة. وأمرها الله أن تهز جذع النخلة فتساقط عليها رطبًا.",
    "ولد عيسى بمعجزة من الله، وكان عبدًا لله ورسولًا، وكانت قصته آية عظيمة على قدرة الله."
  ],
  verse:"إِنَّ اللَّهَ اصْطَفَاكِ وَطَهَّرَكِ وَاصْطَفَاكِ عَلَىٰ نِسَاءِ الْعَالَمِينَ",
  ref:"سورة آل عمران — الآية 42",
  lesson:"الابتلاء قد يكون شديدًا، لكن الله يرى عباده ويعلم ما يمرون به، وقد يجعل بعد الشدة فرجًا.",
  source:"سورة مريم، وسورة آل عمران",
  next:"muhammad"
},

muhammad:{
  title:"محمد ﷺ",
  category:"السيرة النبوية",
  intro:"لمحة من سيرة خاتم الأنبياء محمد ﷺ ورسالته في دعوة الناس إلى عبادة الله.",
  era:"السيرة النبوية",
  quran:"الأحزاب 21",
  text:[
    "وُلد محمد ﷺ في مكة، ونشأ معروفًا بين قومه بالصدق والأمانة. ثم اصطفاه الله بالرسالة وهو في سن الأربعين.",
    "بدأ ﷺ دعوة الناس إلى توحيد الله وترك عبادة الأصنام. واجه المسلمون الأوائل أذى شديدًا، لكنهم ثبتوا على إيمانهم.",
    "هاجر النبي ﷺ إلى المدينة، وهناك تأسس المجتمع المسلم، واستمرت الدعوة وانتشرت.",
    "كان ﷺ قدوة في الرحمة والصدق والصبر والعفو، وأرسل الله رسالته هدى ورحمة للعالمين."
  ],
  verse:"لَّقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ",
  ref:"سورة الأحزاب — الآية 21",
  lesson:"سيرة النبي ﷺ ليست مجرد أحداث تاريخية؛ فيها نماذج عملية للصبر والرحمة والصدق وحسن التعامل.",
  source:"سورة الأحزاب: 21، ومصادر السيرة النبوية الموثوقة",
  next:"hijrah"
},

hijrah:{
  title:"الهجرة النبوية",
  category:"السيرة النبوية",
  intro:"قصة هجرة النبي ﷺ من مكة إلى المدينة وما فيها من توكل وتخطيط وثبات.",
  era:"السيرة النبوية",
  quran:"التوبة 40",
  text:[
    "اشتد أذى المشركين للمسلمين في مكة، وأذن الله للنبي ﷺ وأصحابه بالهجرة إلى المدينة.",
    "خرج النبي ﷺ مع أبي بكر رضي الله عنه، واتخذا الأسباب اللازمة للحفاظ على الرحلة، ومنها الاختباء في الغار.",
    "عندما اقترب المشركون من الغار، قال أبو بكر رضي الله عنه للنبي ﷺ إنه لو نظر أحدهم تحت قدميه لرآهما، فقال النبي ﷺ: لا تحزن إن الله معنا.",
    "وصل النبي ﷺ إلى المدينة، وبدأت مرحلة جديدة من تاريخ الدعوة الإسلامية."
  ],
  verse:"لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا",
  ref:"سورة التوبة — الآية 40",
  lesson:"التوكل على الله لا يعني ترك الأسباب؛ بل يجمع بين الثقة بالله والأخذ بالأسباب الممكنة.",
  source:"سورة التوبة: 40، ومصادر السيرة النبوية",
  next:"bilal"
},

bilal:{
  title:"بلال بن رباح رضي الله عنه",
  category:"قصص وعبر",
  intro:"قصة بلال رضي الله عنه وثباته على الإسلام رغم الأذى.",
  era:"عصر النبوة",
  quran:"آل عمران 200",
  text:[
    "كان بلال رضي الله عنه من أوائل من دخلوا في الإسلام، وقد تعرض بسبب إيمانه للأذى الشديد من المشركين.",
    "ثبت بلال على توحيد الله ولم يتخل عن إيمانه رغم الضغط الذي تعرض له.",
    "اشتراه أبو بكر رضي الله عنه وأعتقه، فأصبح بلال من أصحاب النبي ﷺ ومن أبرز المؤذنين في الإسلام.",
    "أصبحت قصته مثالًا في الثبات، وأن قيمة الإنسان ليست في نسبه أو ماله، وإنما في إيمانه وتقواه."
  ],
  verse:"إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ",
  ref:"سورة الحجرات — الآية 13",
  lesson:"الإيمان يجعل الإنسان ثابتًا على الحق، ولا يحدد قدر الإنسان لونه أو أصله أو ماله.",
  source:"مصادر السيرة والتراجم الموثوقة",
  next:"ashab"
},

ashab:{
  title:"أصحاب الأخدود",
  category:"قصص وعبر",
  intro:"قصة أصحاب الأخدود والثبات على الإيمان رغم محاولة إجبارهم على تركه.",
  era:"قصة قرآنية",
  quran:"البروج 4–10",
  text:[
    "ذكر القرآن قصة أصحاب الأخدود الذين تعرضوا للاضطهاد بسبب إيمانهم بالله.",
    "كان أصحاب الأخدود يواجهون اختبارًا شديدًا، وكان المطلوب منهم أن يتركوا إيمانهم.",
    "لكن المؤمنين ثبتوا ولم يبيعوا إيمانهم مقابل النجاة الدنيوية.",
    "جاءت القصة في سورة البروج لتخلد موقف الثبات على الحق وتبين عاقبة الظلم."
  ],
  verse:"قُتِلَ أَصْحَابُ الْأُخْدُودِ",
  ref:"سورة البروج — الآية 4",
  lesson:"الثبات على الإيمان قيمة عظيمة، والظلم لا يمحو الحق.",
  source:"سورة البروج: 4–10",
  next:"luqman"
},

luqman:{
  title:"لقمان الحكيم",
  category:"قصص وعبر",
  intro:"وصايا لقمان لابنه في الإيمان والأخلاق والتواضع.",
  era:"قصة قرآنية",
  quran:"لقمان 12–19",
  text:[
    "ذكر الله لقمان وأعطاه الحكمة، ومن أعظم ما نقل عنه وصاياه لابنه.",
    "بدأت وصاياه بالتوحيد والتحذير من الشرك، ثم أوصى ببر الوالدين ومراقبة الله.",
    "علّمه أن الله يعلم كل شيء، وأن الإنسان مسؤول عن أعماله مهما صغرت.",
    "كما أوصاه بالصلاة والأمر بالمعروف والنهي عن المنكر والصبر، ونهاه عن الكبر ورفع الصوت."
  ],
  verse:"يَا بُنَيَّ أَقِمِ الصَّلَاةَ وَأْمُرْ بِالْمَعْرُوفِ وَانْهَ عَنِ الْمُنكَرِ وَاصْبِرْ عَلَىٰ مَا أَصَابَكَ",
  ref:"سورة لقمان — الآية 17",
  lesson:"التربية الصالحة تجمع بين العقيدة والعبادة والأخلاق وحسن التعامل مع الناس.",
  source:"سورة لقمان: 12–19",

    </section>
  `;

/* =========================================================
   القراءة الآلية
========================================================= */

let speech;

function getReadingText(){

  if(!story) return "";

  return `${story.title}. ${story.intro}. ${story.text.join(" ")}. فهم مبسط: ${story.lesson}`;

}

function startReading(){

  if(!("speechSynthesis" in window)){

    alert("المتصفح الحالي لا يدعم القراءة الآلية.");

    return;
  }

  speechSynthesis.cancel();

  speech = new SpeechSynthesisUtterance(getReadingText());

  speech.lang = "ar-SA";
  speech.rate = .82;
  speech.pitch = 1;
  speech.volume = 1;

  const status = document.getElementById("audioStatus");

  if(status){
    status.textContent = "🔊 جارٍ قراءة القصة...";
  }

  speech.onend = () => {

    if(status){
      status.textContent = "تمت قراءة القصة";
    }

  };

  speech.onerror = () => {

    if(status){
      status.textContent = "تعذر تشغيل القراءة";
    }

  };

  speechSynthesis.speak(speech);
}


function pauseReading(){

  if("speechSynthesis" in window){

    speechSynthesis.pause();

    const status = document.getElementById("audioStatus");

    if(status){
      status.textContent = "⏸ القراءة متوقفة مؤقتًا";
    }

  }

}


function stopReading(){

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const status = document.getElementById("audioStatus");

    if(status){
      status.textContent = "تم إيقاف القراءة";
    }

  }

}


/* =========================================================
   تنظيف الصوت عند مغادرة الصفحة
========================================================= */

window.addEventListener("beforeunload",()=>{

  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }

});

</script>
