:root{

  --gold:#caa85e;

  --cream:#f8f3e7;
  --white:#fffdf8;
  --text:#18352c;
  --muted:#6b7d74;
  --line:#e8dfca;
  --shadow:0 18px 50px rgba(7,59,42,.10);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Cairo",Arial,sans-serif;
  background:
    radial-gradient(circle at 8% 5%,rgba(202,168,94,.13),transparent 25%),
    radial-gradient(circle at 90% 20%,rgba(11,89,64,.08),transparent 28%),
    var(--cream);
  color:var(--text);
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,59,42,.96);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(228,201,131,.18);
}

.nav{
  max-width:1050px;
  min-height:76px;
  margin:auto;
  padding:12px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  color:white;
  text-decoration:none;
}

.logo{
  width:46px;
  height:46px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#124e3a,#062e22);
  border:1px solid rgba(228,201,131,.45);
  color:var(--gold2);
  font-family:"Amiri",serif;
  font-size:29px;
}

.brand strong{
  display:block;
  font-size:18px;
}

.brand span{
  display:block;
  color:#cbdcd4;
  font-size:11px;
}

.nav-links{
  display:flex;
  gap:6px;
}

.nav-links a{
  color:#e7f0eb;
  padding:9px 13px;
  border-radius:12px;
  font-size:13px;
  text-decoration:none;
}

.nav-links a:hover{
  color:var(--gold2);
  background:rgba(202,168,94,.14);
}

.progress{
  position:fixed;
  top:0;
  right:0;
  height:3px;
  width:0;
  z-index:200;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
}

.container{
  max-width:950px;
  margin:auto;
  padding:35px 22px 80px;
}

.breadcrumb{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:11px;
  margin-bottom:18px;
}

.breadcrumb a{
  color:#8f7139;
  text-decoration:none;
}

.hero{
  background:
    radial-gradient(circle at 80% 20%,rgba(228,201,131,.16),transparent 24%),
    linear-gradient(135deg,#0b6045,#052d21);
  color:white;
  border-radius:30px;
  padding:38px;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
  margin-bottom:25px;
}

.hero::before,
.hero::after{
  content:"";
  position:absolute;
  border:1px solid rgba(228,201,131,.14);
  border-radius:50%;
}

.hero::before{
  width:280px;
  height:280px;
  left:-130px;
  bottom:-170px;
}

.hero::after{
  width:350px;
  height:350px;
  right:-190px;
  top:-200px;
}

.hero-content{
  position:relative;
  z-index:2;
}

.hero .eyebrow{
  color:var(--gold2);
  font-size:12px;
  font-weight:800;
  margin-bottom:9px;
}

.hero h1{
  font-family:"Amiri",serif;
  font-size:clamp(42px,6vw,62px);
  line-height:1.15;
}

.hero p{
  color:#d4e1db;
  line-height:2;
  font-size:13px;
  margin-top:8px;
}

.article{
  background:rgba(255,253,248,.95);
  border:1px solid var(--line);
  border-radius:27px;
  box-shadow:0 12px 35px rgba(7,59,42,.06);
  overflow:hidden;
}

.article-inner{
  padding:35px;
}

.chapter{
  margin-bottom:38px;
}

.chapter:last-child{
  margin-bottom:0;
}

.chapter h2{
  color:var(--green);
  font-family:"Amiri",serif;
  font-size:30px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:10px;
}

.chapter h2::before{
  content:"";
  width:7px;
  height:30px;
  border-radius:10px;
  background:var(--gold);
  display:inline-block;
}

.chapter p{
  color:#455c53;
  font-family:"Amiri",serif;
  font-size:21px;
  line-height:2.15;
  margin-bottom:14px;
}

.quran-box{
  margin:28px 0;
  padding:25px;
  background:linear-gradient(135deg,#f5efdf,#fffdf8);
  border:1px solid #dfd2ad;
  border-radius:20px;
  position:relative;
}

.quran-label{
  color:#92713a;
  font-size:11px;
  font-weight:800;
  margin-bottom:12px;
}

.quran-text{
  font-family:"Amiri",serif;
  font-size:26px;
  line-height:2;
  color:#27483b;
}

.quran-ref{
  color:var(--muted);
  font-size:11px;
  margin-top:12px;
}

.simple{
  margin:28px 0;
  background:#eef4ef;
  border-right:5px solid var(--green2);
  border-radius:17px;
  padding:21px;
}

.simple h3{
  color:var(--green);
  font-size:16px;
  margin-bottom:8px;
}

.simple p{
  color:#536a61;
  line-height:2;
  font-size:14px;
}

.lessons{
  display:grid;
  gap:10px;
  margin-top:14px;
}

.lesson{
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:14px;
  background:#f7f4eb;
  border-radius:15px;
  color:#52655e;
  line-height:1.9;
  font-size:13px;
}

.lesson-number{
  flex:0 0 auto;
  width:29px;
  height:29px;
  border-radius:10px;
  background:var(--green);
  color:var(--gold2);
  display:grid;
  place-items:center;
  font-size:11px;
  font-weight:800;
}

.sources{
  margin-top:35px;
  padding:20px;
  border-top:1px solid var(--line);
}

.sources h3{
  color:var(--green);
  font-size:15px;
  margin-bottom:9px;
}

.sources ul{
  padding-right:20px;
  color:var(--muted);
  line-height:2;
  font-size:12px;
}

.video-section{
  margin-top:30px;
  padding-top:30px;
  border-top:1px solid var(--line);
}

.video-section h3{
  color:var(--green);
  font-size:17px;
  margin-bottom:14px;
}

.video-note{
  color:var(--muted);
  font-size:11px;
  margin-bottom:13px;
}

.video-frame{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  border-radius:20px;
  overflow:hidden;
  background:#092d22;
}

.video-frame iframe{
  width:100%;
  height:100%;
  border:0;
}

.navigation{
  margin-top:25px;
  display:grid;
  grid-template-columns:1fr 1.2fr 1fr;
  gap:10px;
}

.nav-btn{
  min-height:55px;
  border:1px solid var(--line);
  background:var(--white);
  border-radius:15px;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:var(--green);
  transition:.2s;
}

.nav-btn:hover{
  border-color:#c8b37c;
  transform:translateY(-2px);
}

.nav-btn strong{
  font-size:12px;
}

.nav-btn small{
  color:var(--muted);
  font-size:9px;
}

.nav-btn.back{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

.error{
  max-width:700px;
  margin:70px auto;
  text-align:center;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:25px;
  padding:45px 25px;
}

.error h1{
  color:var(--green);
  font-family:"Amiri",serif;
  font-size:35px;
}

.error p{
  color:var(--muted);
  margin:10px 0 20px;
}

.error a{
  display:inline-block;
  padding:11px 18px;
  border-radius:13px;
  background:var(--green);
  color:white;
  text-decoration:none;
  font-size:12px;
}

.footer{
  background:var(--green);
  color:#cbdcd4;
  text-align:center;
  padding:30px 20px;
  font-size:11px;
  line-height:2;
}

.footer strong{
  color:var(--gold2);
}

@media(max-width:650px){

  .nav{
    min-height:68px;
    padding:9px 14px;
  }

  .nav-links{
    display:none;
  }

  .container{
    padding:22px 14px 60px;
  }

  .hero{
    padding:30px 22px;

  }

  .hero h1{

  }

  .article-inner{

  }

  .chapter p{
    font-size:19px;
    line-height:2.05;
  }

  .quran-text{
    font-size:23px;
  }

  .navigation{
    grid-template-columns:1fr;
  }
}

const order=[

const params=new URLSearchParams(location.search);
const id=params.get("id") || "adam";
const story=stories[id];

const title=document.getElementById("storyTitle");
const subtitle=document.getElementById("storySubtitle");
const crumb=document.getElementById("crumb");
const article=document.getElementById("articleContent");

if(!story){

title.textContent="القصة غير موجودة";
subtitle.textContent="";

article.innerHTML=`
<div class="error">
<h1>لم يتم العثور على القصة</h1>
<p>يمكنك العودة إلى مكتبة القصص واختيار قصة أخرى.</p>
<a href="stories.html">العودة إلى القصص</a>
</div>
`;

}else{

title.textContent=story.title;
subtitle.textContent=story.subtitle;
crumb.textContent=story.title;

localStorage.setItem(
"alhidayah_last_story",
id
);

renderStory();

}

function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function renderStory(){

const chapters=story.chapters.map(chapter=>`

<section class="chapter">

<h2>
${escapeHTML(chapter.title)}
</h2>

${chapter.paragraphs.map(paragraph=>`
<p>${escapeHTML(paragraph)}</p>
`).join("")}

</section>

`).join("");

article.innerHTML=`

${chapters}

<section class="quran-box">

<div class="quran-label">
آية مرتبطة بالقصة
</div>

<div class="quran-text" id="quranText">
جاري تحميل الآية...
</div>

<div class="quran-ref">
سورة ${story.ayah[0]} — الآية ${story.ayah[1]}
</div>

</section>

<section class="simple">

<h3>فهم مبسط</h3>

<p>
هذا شرح تعليمي مبسط لفكرة القصة والعبرة منها،
وليس نصًا من القرآن الكريم ولا تفسيرًا حرفيًا للآيات.
</p>

<p>
${escapeHTML(story.simple)}
</p>

</section>

<section class="chapter">

<h2>ما نتعلمه من القصة</h2>

<div class="lessons">

${story.lessons.map((lesson,index)=>`

<div class="lesson">

<span class="lesson-number">
${index+1}
</span>

<span>
${escapeHTML(lesson)}
</span>

</div>

`).join("")}

</div>

</section>

<section class="sources">

<h3>المصادر</h3>

<ul>

${story.sources.map(source=>`
<li>${escapeHTML(source)}</li>
`).join("")}

</ul>

</section>

${story.video ? `

<section class="video-section">

<h3>فيديو كرتوني مرتبط بالقصة</h3>

<p class="video-note">
فيديو تعليمي للأطفال مرتبط بالقصة. وجود الفيديو لا يغني عن قراءة القصة ومصادرها.
</p>

<div class="video-frame">

<iframe
src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(story.video)}"
title="${escapeHTML(story.title)}"
loading="lazy"
allowfullscreen>
</iframe>

</div>

</section>

`:""}

${renderNavigation()}

`;

loadAyah();

}

async function loadAyah(){

const quranText=document.getElementById("quranText");

try{

const response=await fetch(
`${API}/ayah/${story.ayah[0]}:${story.ayah[1]}/quran-uthmani`
);

const data=await response.json();

if(data?.data?.text){

quranText.textContent=data.data.text;

}else{

throw new Error("No ayah");

}

}catch(error){

quranText.textContent=
"تعذر تحميل الآية حاليًا. حاول تحديث الصفحة.";

}

}

function renderNavigation(){

const index=order.indexOf(id);

const previousId=
index>0
?order[index-1]
:null;

const nextId=
index<order.length-1
?order[index+1]
:null;

const previous=
previousId
?stories[previousId]
:null;

const next=
nextId
?stories[nextId]
:null;

return`

<div class="navigation">

${
previous
?`
<a
class="nav-btn"
href="story.html?id=${encodeURIComponent(previousId)}"
>
<small>القصة السابقة</small>
<strong>← ${escapeHTML(previous.title)}</strong>
</a>
`
:`
<a class="nav-btn" href="stories.html">
<small>العودة</small>
<strong>← مكتبة القصص</strong>
</a>
`
}

<a class="nav-btn back" href="stories.html">
<small>مكتبة القصص</small>
<strong>كل القصص</strong>
</a>

${
next
?`
<a
class="nav-btn"
href="story.html?id=${encodeURIComponent(nextId)}"
>
<small>القصة التالية</small>
<strong>${escapeHTML(next.title)} →</strong>
</a>
`
:`
<a class="nav-btn" href="stories.html">
<small>النهاية</small>
<strong>مكتبة القصص →</strong>
</a>
`
}

</div>

`;

}

window.addEventListener("scroll",()=>{

const scrollTop=window.scrollY;

const height=
document.documentElement.scrollHeight-
window.innerHeight;

const percent=
height>0
?Math.min(100,(scrollTop/height)*100)
:0;

document.getElementById("progress").style.width=
percent+"%";

});
