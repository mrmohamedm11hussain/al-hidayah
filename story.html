<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b3d2e">

<title>القصة | الهداية — نور يهديك</title>
<meta name="description" content="قصص الأنبياء والقصص الواردة في القرآن والسيرة النبوية — منصة الهداية">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --green-950:#06271d;
  --green-900:#08372a;
  --green-800:#0b4938;
  --green-700:#12624b;
  --green-600:#19755a;
  --gold:#c8a45a;
  --gold-light:#e5cb8a;
  --cream:#f7f2e8;
  --cream-2:#fffdf8;
  --text:#19352b;
  --muted:#718078;
  --border:rgba(24,65,51,.12);
  --shadow:0 18px 50px rgba(7,45,34,.10);
  --radius:24px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Cairo",Arial,sans-serif;
  background:
    radial-gradient(circle at 85% 5%,rgba(200,164,90,.10),transparent 28%),
    linear-gradient(180deg,#f9f6ef 0%,#fffdf8 45%,#f4f0e6 100%);
  color:var(--text);
  min-height:100vh;
  line-height:1.9;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

::selection{
  background:rgba(200,164,90,.28);
}

/* Reading progress */
.reading-progress{
  position:fixed;
  top:0;
  right:0;
  height:4px;
  width:0;
  background:linear-gradient(90deg,var(--gold),var(--gold-light));
  z-index:9999;
  box-shadow:0 0 12px rgba(200,164,90,.45);
}

/* NAV */
.nav{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,253,248,.90);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.nav-inner{
  max-width:1180px;
  margin:auto;
  min-height:74px;
  padding:10px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
}

.brand-logo{
  width:45px;
  height:45px;
  border-radius:15px;
  display:grid;
  place-items:center;
  color:var(--gold-light);
  background:
    radial-gradient(circle at 35% 25%,#176a51,#06271d 70%);
  border:1px solid rgba(200,164,90,.35);
  box-shadow:0 8px 24px rgba(6,39,29,.16);
  font-family:"Amiri",serif;
  font-size:26px;
}

.brand-name{
  font-size:18px;
  color:var(--green-900);
}

.brand-name span{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:600;
  line-height:1.2;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}

.nav-links a{
  padding:8px 13px;
  border-radius:12px;
  color:#466157;
  font-size:13px;
  font-weight:700;
  transition:.25s;
}

.nav-links a:hover{
  background:#edf3ef;
  color:var(--green-900);
}

.back-btn{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:9px 14px;
  border-radius:13px;
  background:var(--green-900);
  color:white;
  font-size:12px;
  font-weight:700;
  transition:.25s;
}

.back-btn:hover{
  transform:translateY(-1px);
  background:var(--green-800);
}

/* PAGE */
.page{
  max-width:1050px;
  margin:auto;
  padding:34px 20px 70px;
}

/* Breadcrumb */
.breadcrumb{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  color:#819087;
  font-size:12px;
  margin-bottom:18px;
}

.breadcrumb a{
  color:var(--green-700);
  font-weight:700;
}

.breadcrumb .sep{
  opacity:.5;
}

/* Hero */
.story-hero{
  position:relative;
  overflow:hidden;
  border-radius:32px;
  background:
    radial-gradient(circle at 85% 15%,rgba(229,203,138,.18),transparent 26%),
    radial-gradient(circle at 10% 90%,rgba(38,126,94,.18),transparent 30%),
    linear-gradient(135deg,#073326,#0c4a38 55%,#0b392c);
  color:white;
  padding:42px 42px 38px;
  box-shadow:0 25px 65px rgba(5,43,32,.20);
  margin-bottom:24px;
}

.story-hero::before{
  content:"";
  position:absolute;
  width:240px;
  height:240px;
  border:1px solid rgba(229,203,138,.18);
  border-radius:50%;
  left:-90px;
  bottom:-130px;
}

.story-hero::after{
  content:"✦";
  position:absolute;
  left:34px;
  top:28px;
  color:rgba(229,203,138,.5);
  font-size:26px;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:760px;
}

.category{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--gold-light);
  border:1px solid rgba(229,203,138,.30);
  background:rgba(255,255,255,.06);
  border-radius:999px;
  padding:6px 12px;
  font-size:11px;
  font-weight:800;
  margin-bottom:16px;
}

.story-title{
  font-family:"Amiri",serif;
  font-size:clamp(38px,7vw,70px);
  line-height:1.15;
  margin-bottom:12px;
  color:#fffdf7;
}

.story-subtitle{
  color:rgba(255,255,255,.77);
  font-size:15px;
  line-height:2;
  max-width:720px;
}

.story-meta{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:22px;
}

.meta-item{
  padding:7px 12px;
  border-radius:11px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);
  color:rgba(255,255,255,.82);
  font-size:11px;
}

/* quick nav */
.quick-nav{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:3px 2px 14px;
  margin-bottom:12px;
  scrollbar-width:none;
}

.quick-nav::-webkit-scrollbar{
  display:none;
}

.quick-nav button{
  white-space:nowrap;
  border:1px solid var(--border);
  background:#fff;
  color:#52665d;
  border-radius:999px;
  padding:8px 14px;
  font-size:12px;
  font-weight:700;
  transition:.2s;
}

.quick-nav button:hover{
  border-color:rgba(200,164,90,.45);
  color:var(--green-900);
  transform:translateY(-1px);
}

/* Main card */
.reader{
  background:rgba(255,255,255,.78);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.reader-top{
  padding:22px 28px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#fffefa,#faf7ef);
}

.reader-label{
  color:var(--green-700);
  font-size:12px;
  font-weight:800;
}

.reader-intro{
  margin-top:6px;
  color:#63756d;
  font-size:13px;
}

.story-body{
  padding:34px 40px 42px;
}

.section{
  margin-bottom:38px;
  animation:rise .65s ease both;
}

.section:last-child{
  margin-bottom:0;
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.section-number{
  display:inline-flex;
  width:34px;
  height:34px;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:#edf4ef;
  color:var(--green-700);
  font-size:12px;
  font-weight:800;
  margin-bottom:9px;
}

.section h2{
  color:var(--green-900);
  font-family:"Amiri",serif;
  font-size:29px;
  margin-bottom:12px;
}

.section p{
  color:#384f46;
  font-size:16px;
  line-height:2.25;
  margin-bottom:13px;
}

.section p:last-child{
  margin-bottom:0;
}

/* Quran reference */
.quran-card{
  margin:26px 0;
  padding:25px;
  border-radius:22px;
  background:
    linear-gradient(145deg,#fbf4df,#fffdf7);
  border:1px solid rgba(200,164,90,.27);
  position:relative;
  overflow:hidden;
}

.quran-card::before{
  content:"۞";
  position:absolute;
  left:18px;
  top:8px;
  color:rgba(200,164,90,.20);
  font-family:"Amiri",serif;
  font-size:48px;
}

.quran-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.quran-label{
  color:#866c30;
  font-size:11px;
  font-weight:800;
}

.quran-ref{
  color:#9a8b67;
  font-size:10px;
}

.ayah{
  font-family:"Amiri",serif;
  font-size:25px;
  line-height:2.15;
  text-align:center;
  color:#3d3525;
  min-height:40px;
}

.ayah.loading{
  color:#9c978b;
  font-family:"Cairo",sans-serif;
  font-size:13px;
}

.ayah-error{
  color:#9c5f4e;
  font-size:12px;
  text-align:center;
}

.tafsir-note{
  margin-top:13px;
  padding-top:12px;
  border-top:1px solid rgba(200,164,90,.18);
  color:#7b7058;
  font-size:11px;
}

/* simplified */
.simple-box{
  border-radius:20px;
  padding:23px 25px;
  background:#edf5f0;
  border:1px solid rgba(18,98,75,.10);
}

.simple-title{
  color:var(--green-800);
  font-weight:800;
  font-size:13px;
  margin-bottom:8px;
}

.simple-box p{
  font-size:14px;
  line-height:2.05;
  color:#4d655b;
  margin:0;
}

/* Lessons */
.lessons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.lesson{
  padding:18px;
  border:1px solid var(--border);
  border-radius:18px;
  background:#fff;
}

.lesson strong{
  display:block;
  color:var(--green-900);
  font-size:13px;
  margin-bottom:4px;
}

.lesson span{
  color:#6e7d76;
  font-size:12px;
  line-height:1.8;
}

/* video */
.video-section{
  margin-top:30px;
  padding:25px;
  border-radius:23px;
  background:#0a3328;
  color:white;
}

.video-section h2{
  font-family:"Amiri",serif;
  color:#fff;
  font-size:27px;
  margin-bottom:4px;
}

.video-section > p{
  color:rgba(255,255,255,.67);
  font-size:12px;
  margin-bottom:17px;
}

.video-wrap{
  position:relative;
  aspect-ratio:16/9;
  border-radius:17px;
  overflow:hidden;
  background:#061d17;
  border:1px solid rgba(255,255,255,.10);
}

.video-wrap iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

/* sources */
.sources{
  margin-top:30px;
  padding:22px;
  border-radius:19px;
  background:#f6f3eb;
  border:1px solid var(--border);
}

.sources h3{
  color:var(--green-900);
  font-size:14px;
  margin-bottom:10px;
}

.sources ul{
  list-style:none;
  display:grid;
  gap:7px;
}

.sources li{
  color:#697a72;
  font-size:11px;
  padding-right:16px;
  position:relative;
}

.sources li::before{
  content:"•";
  position:absolute;
  right:0;
  color:var(--gold);
  font-size:18px;
  line-height:1;
}

/* nav story */
.story-navigation{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:25px;
}

.story-nav{
  display:flex;
  flex-direction:column;
  gap:5px;
  padding:18px 20px;
  border-radius:18px;
  border:1px solid var(--border);
  background:white;
  transition:.25s;
}

.story-nav:hover{
  transform:translateY(-2px);
  border-color:rgba(200,164,90,.38);
  box-shadow:0 12px 30px rgba(6,39,29,.07);
}

.story-nav.next{
  text-align:left;
  direction:ltr;
}

.story-nav.next span,
.story-nav.next strong{
  direction:rtl;
  text-align:right;
}

.story-nav small{
  color:#9a9d98;
  font-size:10px;
}

.story-nav strong{
  color:var(--green-900);
  font-size:13px;
}

/* error */
.error{
  text-align:center;
  padding:70px 25px;
  background:white;
  border:1px solid var(--border);
  border-radius:28px;
  box-shadow:var(--shadow);
}

.error-icon{
  width:65px;
  height:65px;
  margin:0 auto 14px;
  display:grid;
  place-items:center;
  border-radius:20px;
  background:#edf4ef;
  color:var(--green-800);
  font-size:28px;
}

.error h1{
  font-family:"Amiri",serif;
  font-size:30px;
  color:var(--green-900);
  margin-bottom:7px;
}

.error p{
  color:#718078;
  font-size:13px;
  margin-bottom:18px;
}

/* footer */
.footer{
  max-width:1050px;
  margin:0 auto;
  padding:0 20px 45px;
  text-align:center;
  color:#89948e;
  font-size:10px;
}

.footer strong{
  color:var(--green-800);
}

/* mobile */
@media(max-width:800px){
  .nav-inner{
    min-height:68px;
  }

  .nav-links{
    display:none;
  }

  .brand-name{
    font-size:16px;
  }

  .back-btn{
    padding:8px 11px;
  }

  .page{
    padding:22px 13px 50px;
  }

  .story-hero{
    padding:31px 23px 29px;
    border-radius:25px;
  }

  .story-title{
    font-size:45px;
  }

  .story-subtitle{
    font-size:13px;
  }

  .story-body{
    padding:27px 20px 31px;
  }

  .section h2{
    font-size:25px;
  }

  .section p{
    font-size:15px;
    line-height:2.15;
  }

  .ayah{
    font-size:22px;
  }

  .lessons{
    grid-template-columns:1fr;
  }
}

@media(max-width:500px){
  .brand-logo{
    width:40px;
    height:40px;
    border-radius:13px;
  }

  .brand-name span{
    display:none;
  }

  .back-btn{
    font-size:10px;
  }

  .story-meta{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .meta-item{
    text-align:center;
  }

  .story-navigation{
    grid-template-columns:1fr;
  }

  .story-nav.next{
    text-align:right;
  }

  .story-nav.next span,
  .story-nav.next strong{
    text-align:right;
  }

  .quran-card{
    padding:20px 15px;
  }

  .ayah{
    font-size:20px;
    line-height:2.2;
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    scroll-behavior:auto!important;
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getStoryId(){
  const params = new URLSearchParams(window.location.search);
  return params.get("id") || "adam";
}

function categoryIcon(category){
  if(category === "prophets") return "☾";
  if(category === "quran") return "✦";
  return "۞";
}

function categoryName(category){
  if(category === "prophets") return "قصص الأنبياء";
  if(category === "quran") return "قصص القرآن";
  return "السيرة النبوية";
}


/* =========================================================
   QURAN API
   ========================================================= */

async function loadAyah(story){

  const box = document.getElementById("ayahBox");

  if(!box) return;

  if(!story.quranAyah || !story.quranVerse){
    box.innerHTML = `
      <div class="ayah-error">
        لا توجد آية محددة معروضة في هذه القصة.
        راجع المصادر المذكورة أسفل الصفحة.
      </div>
    `;
    return;
  }

  box.classList.add("loading");
  box.textContent = "جاري تحميل الآية من مصدر القرآن…";

  try{

    const url =
      `https://api.alquran.cloud/v1/ayah/${story.quranAyah}:${story.quranVerse}/quran-uthmani`;

    const response = await fetch(url);

    if(!response.ok){
      throw new Error("Quran API request failed");
    }

    const result = await response.json();

    if(
      result.code !== 200 ||
      !result.data ||
      !result.data.text
    ){
      throw new Error("Invalid Quran response");
    }

    box.classList.remove("loading");

    box.innerHTML = `
      ${escapeHTML(result.data.text)}
    `;

  }catch(error){

    box.classList.remove("loading");

    box.innerHTML = `
      <div class="ayah-error">
        تعذر تحميل الآية الآن.
        <br>
        المرجع: ${escapeHTML(story.quranRef || "القرآن الكريم")}
      </div>
    `;
  }
}

/* =========================================================
   READING PROGRESS
   ========================================================= */

function updateReadingProgress(){

  const progress =
    document.getElementById("readingProgress");

  if(!progress) return;

  const scrollTop =
    window.scrollY || document.documentElement.scrollTop;

  const documentHeight =
    document.documentElement.scrollHeight -
    window.innerHeight;

  if(documentHeight <= 0){
    progress.style.width = "100%";
    return;
  }

  const percentage =
    Math.min(
      100,
      Math.max(
        0,
        (scrollTop / documentHeight) * 100
      )
    );

  progress.style.width = percentage + "%";
}

window.addEventListener(
  "scroll",
  updateReadingProgress,
  {passive:true}
);

renderStory(storyId);

updateReadingProgress();
