<!-- =========================
     VIDEO SYSTEM — AL HIDAYAH
========================= -->

<style>
.video-section{
  margin-top:45px;
  padding:28px;
  border-radius:28px;
  background:
    radial-gradient(circle at top right,rgba(198,161,77,.12),transparent 35%),
    linear-gradient(145deg,#0b3d2e,#123f32);
  border:1px solid rgba(198,161,77,.25);
  box-shadow:0 20px 55px rgba(0,0,0,.12);
  color:#fff;
  overflow:hidden;
}

.video-head{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.video-icon{
  width:52px;
  height:52px;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#c6a14d,#e5ca82);
  color:#123b2d;
  font-size:23px;
  box-shadow:0 8px 25px rgba(198,161,77,.25);
}

.video-head h2{
  margin:0;
  font-size:24px;
}

.video-head p{
  margin:5px 0 0;
  color:rgba(255,255,255,.72);
  font-size:14px;
}

.video-frame{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  border-radius:22px;
  overflow:hidden;
  background:#061c15;
  box-shadow:0 18px 45px rgba(0,0,0,.3);
}

.video-frame iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.video-note{
  margin-top:14px;
  color:rgba(255,255,255,.65);
  font-size:13px;
  line-height:1.8;
}

.no-video{
  display:none;
}
</style>

<section id="storyVideo" class="video-section no-video">

  <div class="video-head">
    <div class="video-icon">▶</div>

    <div>
      <h2>شاهد القصة</h2>
      <p id="videoTitle">فيديو تعليمي مرتبط بهذه القصة</p>
    </div>
  </div>

  <div class="video-frame">
    <iframe
      id="storyVideoFrame"
      title="فيديو القصة"
      loading="lazy"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>

  <div class="video-note">
    الفيديو مستضاف على YouTube ويُعرض داخل منصة الهداية من خلال المشغّل الرسمي.
  </div>

</section>

<script>
/* =========================================
   VERIFIED STORY VIDEOS
   لا يوجد ID مكرر بين القصص
========================================= */

const verifiedStoryVideos = {

  /* قصص الأنبياء */

  adam: {
    id: "v0NBZLxW-Hk",
    title: "قصة سيدنا آدم عليه السلام للأطفال"
  },

  nuh: {
    id: "43phxxmP1j4",
    title: "قصة النبي نوح عليه السلام للأطفال"
  },

  yusuf: {
    id: "BYgezu9EUQE",
    title: "قصة سيدنا يوسف عليه السلام للأطفال"
  },

  musa: {
    id: "ZubVqCRp_Kc",
    title: "قصة سيدنا موسى عليه السلام للأطفال"
  },

  yunus: {
    id: "PJn8xuBwmSs",
    title: "قصة سيدنا يونس عليه السلام للأطفال"
  },

  kahf: {
    id: "uFulKwehKcI",
    title: "قصة أصحاب الكهف للأطفال"
  },

  /* السيرة */

  hira: {
    id: "a6x41OnBMlQ",
    title: "نزول الوحي وبداية الدعوة السرية"
  }

};


/* =========================================
   تشغيل الفيديو حسب ID القصة
========================================= */

(function(){

  const params = new URLSearchParams(window.location.search);
  const storyId = params.get("id");

  const videoData = verifiedStoryVideos[storyId];

  const section = document.getElementById("storyVideo");
  const frame = document.getElementById("storyVideoFrame");
  const title = document.getElementById("videoTitle");

  if(!section || !frame){
    return;
  }

  /*
    لو الفيديو غير موجود:
    لا نظهر أي صندوق فيديو.
  */

  if(!videoData){
    section.classList.add("no-video");
    return;
  }

  /*
    YouTube Privacy Enhanced Mode
  */

  frame.src =
    "https://www.youtube-nocookie.com/embed/" +
    videoData.id +
    "?rel=0&modestbranding=1";

  title.textContent = videoData.title;

  section.classList.remove("no-video");

})();
</script>
