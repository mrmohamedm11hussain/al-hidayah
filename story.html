<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>القصة — الهداية</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --green:#103d2b;
  --green2:#1b5a40;
  --green3:#08261b;
  --gold:#c8a45d;
  --gold2:#e4c982;
  --cream:#f8f3e8;
  --paper:#fffdf8;
  --text:#28372f;
  --muted:#77837d;
  --line:rgba(16,61,43,.12);
  --shadow:0 25px 70px rgba(16,45,34,.12);
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Tahoma","Arial",sans-serif;
  background:
    radial-gradient(circle at 10% 5%,rgba(200,164,93,.11),transparent 25%),
    linear-gradient(180deg,#f8f5ed,#eef3ee 55%,#f8f4e9);
  color:var(--text);
  min-height:100vh;
}

/* READING PROGRESS */

.progress{
  position:fixed;
  top:0;
  right:0;
  left:0;
  height:4px;
  z-index:999;
  background:rgba(0,0,0,.05);
}

.progress-bar{
  width:0;
  height:100%;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
}

/* NAV */

.nav{
  position:sticky;
  top:4px;
  z-index:100;
  height:70px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(8,38,27,.95);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(228,201,130,.12);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  color:white;
  text-decoration:none;
}

.logo{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:linear-gradient(145deg,var(--gold2),var(--gold));
  color:var(--green3);
  font-size:24px;
  font-weight:bold;
}

.brand strong{
  font-size:19px;
}

.brand small{
  display:block;
  color:#d9d4c8;
  font-size:10px;
  margin-top:3px;
}

.nav-actions{
  display:flex;
  gap:8px;
}

.nav-btn{
  text-decoration:none;
  color:#f7efdc;
  border:1px solid rgba(255,255,255,.12);
  border-radius:11px;
  padding:9px 14px;
  font-size:13px;
}

.nav-btn:hover{
  background:rgba(255,255,255,.07);
}

/* HERO */

.hero{
  width:min(1100px,92%);
  margin:45px auto 25px;
  padding:48px;
  border-radius:30px;
  background:
    radial-gradient(circle at 85% 15%,rgba(228,201,130,.2),transparent 30%),
    linear-gradient(135deg,#0a2c20,#1a533b);
  color:white;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.hero:before{
  content:"";
  position:absolute;
  width:370px;
  height:370px;
  border:1px solid rgba(228,201,130,.14);
  border-radius:50%;
  right:-190px;
  top:-190px;
}

.hero:after{
  content:"";
  position:absolute;
  width:230px;
  height:230px;
  border:1px solid rgba(228,201,130,.1);
  border-radius:50%;
  left:-120px;
  bottom:-130px;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:800px;
}

.breadcrumb{
  color:#cfc9b8;
  font-size:12px;
  margin-bottom:18px;
}

.category{
  display:inline-flex;
  padding:7px 12px;
  border-radius:20px;
  background:rgba(228,201,130,.13);
  border:1px solid rgba(228,201,130,.2);
  color:var(--gold2);
  font-size:12px;
  margin-bottom:15px;
}

.hero h1{
  font-size:clamp(35px,6vw,62px);
  line-height:1.12;
  margin-bottom:15px;
}

.hero p{
  line-height:2;
  color:#e0e9e3;
  font-size:16px;
}

.meta{
  margin-top:22px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.meta span{
  padding:7px 11px;
  border-radius:10px;
  background:rgba(255,255,255,.07);
  color:#d8e0db;
  font-size:11px;
}

/* MAIN */

.main{
  width:min(900px,92%);
  margin:0 auto 70px;
}

/* QUICK NAV */

.quick{
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:17px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.04);
}

.quick a{
  color:var(--green);
  text-decoration:none;
  font-size:13px;
  font-weight:bold;
}

.quick a:hover{
  color:#8a692e;
}

/* READER */

.reader{
  background:var(--paper);
  border:1px solid rgba(110,80,30,.12);
  border-radius:28px;
  padding:55px clamp(25px,6vw,75px);
  box-shadow:var(--shadow);
}

.intro{
  padding:22px;
  border-radius:18px;
  background:#f4efe3;
  border-right:4px solid var(--gold);
  line-height:2;
  color:#59635e;
  margin-bottom:35px;
}

.chapter{
  margin-bottom:45px;
}

.chapter h2{
  color:var(--green);
  font-size:26px;
  margin-bottom:18px;
  position:relative;
  padding-right:16px;
}

.chapter h2:before{
  content:"";
  position:absolute;
  right:0;
  top:5px;
  width:4px;
  height:26px;
  border-radius:5px;
  background:var(--gold);
}

.chapter p{
  font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  font-size:21px;
  line-height:2.25;
  color:#343832;
  margin-bottom:18px;
}

/* QURAN VERSE */

.verse{
  margin:35px 0;
  padding:30px;
  border-radius:22px;
  background:
    radial-gradient(circle at 50% 0,rgba(200,164,93,.1),transparent 50%),
    #f7f1e2;
  border:1px solid rgba(200,164,93,.3);
  text-align:center;
  position:relative;
}

.verse-label{
  color:#8b6b30;
  font-size:12px;
  margin-bottom:17px;
  font-weight:bold;
}

.verse-text{
  font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  font-size:25px;
  line-height:2;
  color:#513d20;
}

.verse-source{
  margin-top:14px;
  color:#8a8376;
  font-size:12px;
}

/* SIMPLE EXPLANATION */

.explain{
  margin:35px 0;
  border:1px solid rgba(16,61,43,.12);
  background:#f2f6f2;
  border-radius:22px;
  padding:28px;
}

.explain-label{
  display:inline-block;
  background:var(--green);
  color:white;
  padding:7px 12px;
  border-radius:9px;
  font-size:12px;
  margin-bottom:15px;
}

.explain p{
  margin:0;
  font-family:inherit;
  font-size:15px;
  line-height:2;
  color:#56615a;
}

/* LESSONS */

.lessons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:20px;
}

.lesson{
  background:white;
  border:1px solid var(--line);
  border-radius:17px;
  padding:18px;
}

.lesson-number{
  width:30px;
  height:30px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#f2e8d1;
  color:#765522;
  font-size:12px;
  margin-bottom:10px;
}

.lesson p{
  font-family:inherit;
  font-size:14px;
  line-height:1.9;
  margin:0;
  color:#59635d;
}

/* VIDEO */

.video-box{
  margin:40px 0;
  display:none;
}

.video-box.active{
  display:block;
}

.video-title{
  color:var(--green);
  font-weight:bold;
  margin-bottom:13px;
}

.video-frame{
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:20px;
  background:#06150f;
  box-shadow:0 20px 45px rgba(0,0,0,.12);
}

.video-frame iframe{
  width:100%;
  height:100%;
  border:0;
}

/* SOURCES */

.sources{
  margin-top:40px;
  padding-top:30px;
  border-top:1px solid var(--line);
}

.sources h3{
  color:var(--green);
  margin-bottom:13px;
}

.sources ul{
  padding-right:20px;
}

.sources li{
  margin-bottom:9px;
  color:#68736d;
  line-height:1.8;
  font-size:13px;
}

/* NAV STORIES */

.story-navigation{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:20px;
}

.story-nav{
  text-decoration:none;
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  transition:.25s;
}

.story-nav:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 35px rgba(0,0,0,.06);
}

.story-nav small{
  display:block;
  color:var(--muted);
  margin-bottom:8px;
}

.story-nav strong{
  color:var(--green);
}

/* ERROR */

.error{
  width:min(700px,92%);
  margin:80px auto;
  background:white;
  padding:50px 30px;
  border-radius:25px;
  text-align:center;
  box-shadow:var(--shadow);
}

.error h1{
  color:var(--green);
  margin-bottom:12px;
}

.error a{
  display:inline-block;
  margin-top:20px;
  background:var(--green);
  color:white;
  padding:12px 20px;
  border-radius:12px;
  text-decoration:none;
}

/* FOOTER */

footer{
  text-align:center;
  padding:35px 20px;
  color:#7a847e;
  font-size:12px;
}

/* ANIMATION */

.reveal{
  animation:reveal .65s ease both;
}

@keyframes reveal{
  from{
    opacity:0;
    transform:translateY(18px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* MOBILE */

@media(max-width:700px){

  .nav{
    padding:0 4%;
  }

  .brand small{
    display:none;
  }

  .brand strong{
    font-size:16px;
  }

  .hero{
    padding:35px 23px;
    margin-top:25px;
  }

  .hero h1{
    font-size:38px;
  }

  .quick{
    overflow-x:auto;
    justify-content:flex-start;
  }

  .quick a{
    white-space:nowrap;
  }

  .reader{
    padding:35px 20px;
    border-radius:22px;
  }

  .chapter p{
    font-size:19px;
    line-height:2.15;
  }

  .verse{
    padding:22px 15px;
  }

  .verse-text{
    font-size:21px;
  }

  .lessons{
    grid-template-columns:1fr;
  }

  .story-navigation{
    grid-template-columns:1fr;
  }

}

</style>
</head>

  params.get("id");

  document.getElementById("app");

  renderError("لم يتم تحديد قصة.");

  renderStory(

/* ----------------------------------------------------------

---------------------------------------------------------- */

function renderStory(id,data){

  const currentIndex =
    order.indexOf(id);

  const previousId =
    currentIndex > 0
      ? order[currentIndex - 1]
      : null;

  const nextId =
    currentIndex < order.length - 1
      ? order[currentIndex + 1]
      : null;

  localStorage.setItem(
    "hidayah_last_story",
    id
  );

  app.innerHTML = `

    <section class="hero reveal">

      <div class="hero-content">

        <div class="breadcrumb">
          الهداية / القصص / ${data.title}
        </div>

        <div class="category">
          ${data.category}
        </div>

        <h1>${data.title}</h1>

        <p>
          ${data.description}
        </p>

        <div class="meta">
          ${data.meta
            .map(x=>`<span>${x}</span>`)
            .join("")}
        </div>

      </div>

    </section>

    <main class="main">

      <nav class="quick">

        <a href="stories.html">
          ← كل القصص
        </a>

        <a href="#story">
          بداية القصة
        </a>

        <a href="#lessons">
          الدروس
        </a>

        <a href="#sources">
          المصادر
        </a>

      </nav>

      <article class="reader reveal" id="story">

        <div class="intro">
          <strong>نبذة عن القصة</strong>
          <br>
          ${data.intro}
        </div>

        ${data.chapters.map(chapter=>`

          <section class="chapter">

            <h2>
              ${chapter.title}
            </h2>

            ${chapter.paragraphs
              .map(p=>`<p>${p}</p>`)
              .join("")}

          </section>

        `).join("")}

        <section class="verse">

          <div class="verse-label">
            آية من القرآن الكريم
          </div>

          <div class="verse-text">
            ﴿${data.verse}﴾
          </div>

          <div class="verse-source">
            ${data.verseSource}
          </div>

        </section>

        <section class="explain">

          <div class="explain-label">
            فهم مبسط
          </div>

          <p>
            ${data.explanation}
          </p>

        </section>

        <section id="lessons" class="chapter">

          <h2>
            دروس مستفادة
          </h2>

          <div class="lessons">

            ${data.lessons.map((lesson,index)=>`

              <div class="lesson">

                <div class="lesson-number">
                  ${index + 1}
                </div>

                <p>
                  ${lesson}
                </p>

              </div>

            `).join("")}

          </div>

        </section>

        <section
          class="video-box ${data.video ? "active" : ""}"
          id="video"
        >

          <div class="video-title">
            🎬 فيديو مرتبط بالقصة
          </div>

          <div class="video-frame">

            <iframe
              src="https://www.youtube-nocookie.com/embed/${data.video}"
              title="${data.title}"
              loading="lazy"
              allowfullscreen
              referrerpolicy="strict-origin-when-cross-origin">
            </iframe>

          </div>

        </section>

        <section class="sources" id="sources">

          <h3>
            المصادر
          </h3>

          <ul>

            ${data.sources
              .map(source=>`<li>${source}</li>`)
              .join("")}

          </ul>

        </section>

      </article>

      <div class="story-navigation">

        ${
          previousId
          ? `
            <a
              class="story-nav"
              href="story.html?id=${previousId}"
            >
              <small>القصة السابقة</small>
              <strong>
                ${getStoryTitle(previousId)}
              </strong>
            </a>
          `
          : `<div></div>`
        }

        ${
          nextId
          ? `
            <a
              class="story-nav"
              href="story.html?id=${nextId}"
            >
              <small>القصة التالية</small>
              <strong>
                ${getStoryTitle(nextId)}
              </strong>
            </a>
          `
          : `<div></div>`
        }

      </div>

    </main>

  `;

}

function renderIncomplete(id){

  app.innerHTML = `

    <div class="error">

      <h1>
        ${titles[id]}
      </h1>

      <p style="line-height:2;color:#68736d">

        هذه الصفحة موجودة ضمن قسم القصص،
        لكن المحتوى التفصيلي لم تتم إضافته بعد.

        <br><br>

        لن يتم وضع معلومات غير موثقة أو قصة مختلقة.
        سيتم إضافة المحتوى الموثق في النسخة النهائية.

      </p>

      <a href="stories.html">
        العودة إلى القصص
      </a>

    </div>

  `;

}

/* ----------------------------------------------------------
   خطأ
---------------------------------------------------------- */

function renderError(message){

  app.innerHTML = `

    <div class="error">

      <h1>
        ${message}
      </h1>

      <p style="color:#718078">
        ارجع إلى مكتبة القصص واختر قصة من القائمة.
      </p>

      <a href="stories.html">
        فتح القصص
      </a>

    </div>

  `;

}

/* ----------------------------------------------------------
   العنوان
---------------------------------------------------------- */

function getStoryTitle(id){

  if(stories[id]){
    return stories[id].title;
  }

  return titles[id] || "القصة";

}

/* ----------------------------------------------------------
   Reading progress
---------------------------------------------------------- */

window.addEventListener("scroll",()=>{

  const bar =
    document.getElementById("progressBar");

  const scrollTop =
    window.scrollY;

  const height =
    document.documentElement.scrollHeight -
    window.innerHeight;

  const percentage =
    height > 0
      ? (scrollTop / height) * 100
      : 0;

  bar.style.width =
    `${Math.min(100,percentage)}%`;

});

</script>
