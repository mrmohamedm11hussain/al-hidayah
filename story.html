<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قصة من الهداية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --green:#123b2a;
    --green2:#1d5b40;
    --green3:#287553;
    --gold:#c9a45c;
    --gold2:#e1c47c;
    --cream:#faf7ef;
    --paper:#fffdf8;
    --text:#24332b;
    --muted:#718077;
    --border:#e9e1d0;
    --shadow:0 20px 60px rgba(18,59,42,.10);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Cairo",sans-serif;
    background:
        radial-gradient(circle at 10% 10%,rgba(201,164,92,.08),transparent 30%),
        radial-gradient(circle at 90% 20%,rgba(29,91,64,.08),transparent 30%),
        var(--cream);
    color:var(--text);
    line-height:2;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(250,247,239,.94);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(201,164,92,.22);
}

.nav{
    width:min(1200px,92%);
    margin:auto;
    min-height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:var(--green);
}

.logo{
    width:48px;
    height:48px;
    border-radius:16px;
    background:linear-gradient(135deg,var(--green),var(--green3));
    color:var(--gold2);
    display:grid;
    place-items:center;
    font-family:"Amiri",serif;
    font-size:30px;
    font-weight:bold;
    box-shadow:0 8px 25px rgba(18,59,42,.2);
}

.brand-text strong{
    display:block;
    font-size:17px;
}

.brand-text span{
    display:block;
    color:var(--muted);
    font-size:11px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:8px;
}

.nav-links a{
    text-decoration:none;
    color:#53635a;
    padding:9px 13px;
    border-radius:12px;
    font-size:13px;
    transition:.25s;
}

.nav-links a:hover{
    background:#eee8da;
    color:var(--green);
}

/* HERO */

.hero{
    width:min(1200px,92%);
    margin:45px auto 25px;
    border-radius:32px;
    overflow:hidden;
    background:
        radial-gradient(circle at 80% 20%,rgba(225,196,124,.18),transparent 28%),
        linear-gradient(135deg,#123b2a,#1d5b40);
    color:white;
    box-shadow:var(--shadow);
    position:relative;
}

.hero::after{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    border:1px solid rgba(225,196,124,.18);
    border-radius:50%;
    left:-90px;
    bottom:-130px;
}

.hero-inner{
    padding:55px;
    position:relative;
    z-index:2;
}

.category{
    display:inline-flex;
    align-items:center;
    gap:7px;
    color:#f0d99d;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(225,196,124,.22);
    padding:7px 14px;
    border-radius:50px;
    font-size:12px;
    margin-bottom:20px;
}

.hero h1{
    font-family:"Amiri",serif;
    font-size:clamp(36px,6vw,66px);
    line-height:1.2;
    margin-bottom:15px;
}

.hero-intro{
    max-width:800px;
    color:#e8eee9;
    font-size:16px;
    line-height:2.1;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:30px;
}

.btn{
    border:0;
    cursor:pointer;
    text-decoration:none;
    font-family:inherit;
    padding:12px 20px;
    border-radius:14px;
    font-weight:700;
    transition:.25s;
}

.btn-main{
    background:var(--gold2);
    color:#183525;
}

.btn-main:hover{
    transform:translateY(-2px);
    background:#efd795;
}

.btn-light{
    color:white;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08);
}

.btn-light:hover{
    background:rgba(255,255,255,.15);
}

/* LAYOUT */

.layout{
    width:min(1200px,92%);
    margin:35px auto 80px;
    display:grid;
    grid-template-columns:minmax(0,1fr) 310px;
    gap:25px;
}

.card{
    background:rgba(255,253,248,.92);
    border:1px solid var(--border);
    border-radius:26px;
    box-shadow:0 12px 40px rgba(18,59,42,.06);
}

/* STORY */

.story-card{
    padding:clamp(25px,5vw,55px);
}

.story-title{
    font-family:"Amiri",serif;
    color:var(--green);
    font-size:30px;
    margin-bottom:25px;
}

.story-content{
    font-family:"Amiri",serif;
    font-size:22px;
    line-height:2.45;
    color:#2d3932;
}

.story-content p{
    margin-bottom:25px;
}

.story-content .highlight{
    padding:22px 25px;
    margin:30px 0;
    background:#f3efe4;
    border-right:5px solid var(--gold);
    border-radius:15px;
    color:#31463a;
}

/* QURAN */

.quran-box{
    margin-top:40px;
    padding:28px;
    border-radius:22px;
    background:
        linear-gradient(135deg,rgba(18,59,42,.96),rgba(29,91,64,.96));
    color:white;
}

.quran-label{
    color:#e1c47c;
    font-size:13px;
    font-weight:bold;
    margin-bottom:10px;
}

.quran-text{
    font-family:"Amiri",serif;
    font-size:25px;
    line-height:2.1;
}

.quran-ref{
    color:#d8e3dc;
    font-size:13px;
    margin-top:15px;
}

/* SIMPLE UNDERSTANDING */

.lesson-box{
    margin-top:30px;
    padding:28px;
    background:#fff9e9;
    border:1px solid #ead9ad;
    border-radius:22px;
}

.lesson-box h2{
    color:var(--green);
    margin-bottom:12px;
    font-size:21px;
}

.lesson-box p{
    color:#59645d;
}

/* AUDIO */

.audio-box{
    margin-top:30px;
    padding:25px;
    background:#f4f0e6;
    border:1px solid var(--border);
    border-radius:22px;
}

.audio-box h2{
    font-size:19px;
    color:var(--green);
    margin-bottom:8px;
}

.audio-box p{
    color:var(--muted);
    font-size:13px;
}

.audio-controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:17px;
}

.audio-controls button{
    font-family:inherit;
    border:0;
    cursor:pointer;
    background:var(--green);
    color:white;
    padding:10px 16px;
    border-radius:12px;
}

.audio-controls button:hover{
    background:var(--green2);
}

/* VIDEO */

.video-section{
    margin-top:30px;
    padding:28px;
}

.video-section h2{
    color:var(--green);
    margin-bottom:8px;
}

.video-note{
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
}

.video-frame{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:20px;
    overflow:hidden;
    background:#102b20;
}

.video-frame iframe{
    width:100%;
    height:100%;
    border:0;
}

.video-fallback{
    padding:20px;
    background:#f5f1e7;
    border-radius:15px;
    margin-top:15px;
    font-size:13px;
}

/* SIDEBAR */

.sidebar{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.info-card{
    padding:25px;
}

.info-card h3{
    color:var(--green);
    margin-bottom:18px;
    font-size:18px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:11px 0;
    border-bottom:1px solid #eee8da;
    font-size:13px;
}

.info-row:last-child{
    border-bottom:0;
}

.info-row span:first-child{
    color:var(--muted);
}

.info-row span:last-child{
    color:var(--green);
    font-weight:700;
    text-align:left;
}

.source-list{
    list-style:none;
}

.source-list li{
    padding:9px 0;
    font-size:13px;
    color:#68756d;
}

.source-list a{
    color:var(--green2);
}

/* NAV STORIES */

.story-navigation{
    width:min(1200px,92%);
    margin:0 auto 80px;
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.story-navigation a{
    flex:1;
    text-decoration:none;
    color:var(--green);
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    transition:.25s;
}

.story-navigation a:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow);
}

.story-navigation small{
    display:block;
    color:var(--muted);
    margin-bottom:5px;
}

/* FOOTER */

footer{
    background:#0f3022;
    color:#dce7df;
    text-align:center;
    padding:35px 20px;
}

footer strong{
    color:#e1c47c;
}

footer small{
    display:block;
    margin-top:7px;
    color:#9bb0a3;
}

/* ERROR */

.error{
    width:min(900px,92%);
    margin:80px auto;
    text-align:center;
    padding:50px;
}

.error h1{
    color:var(--green);
    margin-bottom:15px;
}

.error a{
    display:inline-block;
    margin-top:20px;
    color:white;
    background:var(--green);
    padding:12px 20px;
    border-radius:13px;
    text-decoration:none;
}

/* RESPONSIVE */

@media(max-width:900px){

    .nav-links{
        display:none;
    }

    .layout{
        grid-template-columns:1fr;
    }

    .hero-inner{
        padding:35px 25px;
    }

    .story-content{
        font-size:20px;
    }

}

@media(max-width:600px){

    .hero{
        border-radius:22px;
        margin-top:20px;
    }

    .hero h1{
        font-size:40px;
    }

    .story-card{
        padding:22px;
    }

    .story-content{
        font-size:19px;
        line-height:2.2;
    }

    .quran-text{
        font-size:22px;
    }

    .story-navigation{
        flex-direction:column;
    }

}

</style>
</head>

<body>

<header>
    <div class="nav">

        <a class="brand" href="index.html">
            <div class="logo">هـ</div>

            <div class="brand-text">
                <strong>الهداية</strong>

            </div>
        </a>

        <nav class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="stories.html">القصص</a>
            <a href="quran.html">القرآن</a>
            <a href="adhkar.html">الأذكار</a>
            <a href="prayer.html">الصلاة</a>
        </nav>

    </div>
</header>

<main id="app"></main>

<footer>
    <strong>الهداية</strong>
    <p>منصة عربية للمعرفة الإسلامية النافعة</p>

</footer>

<script>

/* =========================================================
   قصص الهداية
   ========================================================= */

const stories = {

adam:{
    title:"قصة آدم عليه السلام",
    category:"قصص الأنبياء",
    era:"بداية الخلق",
    reference:"البقرة: 30–37",
    intro:"قصة بداية خلق الإنسان، وابتلاء آدم عليه السلام، ثم توبته ورجوعه إلى الله.",
    video:"https://www.youtube.com/embed/AuNcSZD4dK8",
    source:"القرآن الكريم — سورة البقرة، الأعراف، طه",
    text:`
    <p>
    أخبر الله سبحانه وتعالى الملائكة أنه جاعل في الأرض خليفة، وخلق آدم عليه السلام وعلّمه من العلم ما شاء الله له أن يتعلم.
    </p>

    <p>
    وأمر الله الملائكة أن يسجدوا لآدم سجود تكريم، فسجدوا جميعًا إلا إبليس، الذي أبى واستكبر، فكان عصيانه سببًا في طرده من رحمة الله.
    </p>

    <p>
    وأسكن الله آدم وزوجه الجنة، وأباح لهما نعيمها، ونهاهما عن الاقتراب من شجرة معينة. فوسوس لهما الشيطان، فأكلا منها، ثم شعرا بخطئهما وندما.
    </p>

    <div class="highlight">
    لم يصرّ آدم عليه السلام على الخطأ، بل رجع إلى الله وتاب إليه، فتاب الله عليه.
    </div>

    <p>
    وهكذا بدأت حياة الإنسان في الأرض، ومعها بدأت رحلة الاختبار والإيمان والعمل الصالح.
    </p>
    `,
    lesson:"الخطأ قد يقع فيه الإنسان، لكن المؤمن لا يتمادى فيه، بل يرجع إلى الله ويطلب المغفرة."
},

nuh:{
    title:"قصة نوح عليه السلام",
    category:"قصص الأنبياء",
    era:"قوم نوح",
    reference:"هود: 25–49",
    intro:"قصة نبي الله نوح عليه السلام ودعوته الطويلة لقومه، وبناء السفينة، والنجاة.",
    video:"https://www.youtube.com/embed/AuNcSZD4dK8",
    source:"القرآن الكريم — سورة هود، المؤمنون، القمر",
    text:`
    <p>
    أرسل الله نوحًا عليه السلام إلى قومه يدعوهم إلى عبادة الله وحده وترك الشرك.
    </p>

    <p>
    دعاهم نوح عليه السلام بطرق مختلفة، في الليل والنهار، سرًا وعلانية، لكن كثيرًا منهم أصروا على الرفض.
    </p>

    <p>
    وأوحى الله إلى نوح أن يصنع السفينة، فبدأ في بنائها بأمر الله، وكان قومه يمرون به ويسخرون منه.
    </p>

    <p>
    ثم جاء أمر الله، ونزل الماء، وحمل نوح عليه السلام في السفينة من آمن معه، وكان ذلك نجاة للمؤمنين.
    </p>

    <div class="highlight">
    كانت قصة نوح عليه السلام مثالًا عظيمًا على الصبر والثبات على الحق حتى لو كان عدد المؤمنين قليلًا.
    </div>
    `,
    lesson:"الصبر على الحق مهم، ولا ينبغي للإنسان أن يترك الخير لمجرد أن الآخرين لا يقبلونه."
},

ibrahim:{
    title:"قصة إبراهيم عليه السلام",
    category:"قصص الأنبياء",
    era:"الخليل",
    reference:"الأنبياء: 51–70",
    intro:"قصة خليل الله إبراهيم عليه السلام، وثباته على التوحيد ودعوته قومه إلى عبادة الله.",
    video:"https://www.youtube.com/embed/AuNcSZD4dK8",
    source:"القرآن الكريم — سورة الأنبياء، البقرة، الصافات",
    text:`
    <p>
    كان إبراهيم عليه السلام من أعظم الأنبياء الذين دعوا إلى توحيد الله وترك عبادة ما سواه.
    </p>

    <p>
    واجه قومه بالحجة، وبيّن لهم أن الأصنام لا تملك لهم نفعًا ولا ضرًا، وأن العبادة لا تكون إلا لله سبحانه وتعالى.
    </p>

    <p>
    ولما ازداد قومه رفضًا لدعوته، تعرض إبراهيم عليه السلام للأذى، وأرادوا إلقاءه في النار.
    </p>

    <p>
    لكن الله سبحانه وتعالى نجاه، وأمر النار أن تكون بردًا وسلامًا عليه.
    </p>

    <div class="highlight">
    من أعظم دروس قصة إبراهيم عليه السلام: قوة اليقين بالله والثبات على الحق.
    </div>
    `,
    lesson:"الثبات على الإيمان يحتاج إلى شجاعة وصبر وثقة بالله."
},

ismail:{
    title:"قصة إسماعيل عليه السلام",
    category:"قصص الأنبياء",
    era:"الخليل وابنه",
    reference:"الصافات: 100–111",
    intro:"قصة إسماعيل عليه السلام وطاعته لله وبرّه بأبيه إبراهيم عليه السلام.",
    video:"https://www.youtube.com/embed/AuNcSZD4dK8",
    source:"القرآن الكريم — سورة الصافات",
    text:`
    <p>
    كان إسماعيل عليه السلام ابن إبراهيم عليه السلام، وقد وصفه الله بالصبر والصدق والوفاء.
    </p>

    <p>
    ولما بلغ إسماعيل سنًا يستطيع فيها أن يسعى مع أبيه، رأى إبراهيم في المنام رؤيا فيها أمر عظيم، فقصها على ابنه.
    </p>

    <p>
    أظهر إسماعيل عليه السلام طاعة عظيمة لله، وقال لأبيه ما يدل على رضاه بأمر الله وثقته به.
    </p>

    <p>
    فلما ظهر صدق الطاعة والإيمان، فداه الله بذبح عظيم.
    </p>
    `,
    lesson:"الطاعة لله، وبر الوالدين، والصبر من أعظم صفات المؤمن."
},

yusuf:{
    title:"قصة يوسف عليه السلام",
    category:"قصص الأنبياء",
    era:"مصر",
    reference:"سورة يوسف",
    intro:"من أجمل قصص القرآن: الحسد، والبئر، والسجن، ثم التمكين والعفو.",
    video:"https://www.youtube.com/embed/AuNcSZD4dK8",
    source:"القرآن الكريم — سورة يوسف كاملة",
    text:`
    <p>
    بدأت قصة يوسف عليه السلام عندما رأى رؤيا أخبر بها والده يعقوب عليه السلام.
    </p>

    <p>
    شعر إخوة يوسف بالغيرة منه، وتآمروا عليه، ثم ألقوه في الجب، وجاءت قافلة فأخرجته وباعته.
    </p>

    <p>
    انتقل يوسف إلى مصر، ومرّ بابتلاءات كثيرة، ثم دخل السجن ظلمًا، لكنه ظل ثابتًا على الإيمان وحسن الخلق.
    </p>

    <p>
    وبعد سنوات، خرج يوسف من السجن ومكّنه الله في الأرض، وأصبح مسؤولًا عن خزائن مصر.
    </p>

    <p>
    ثم عاد إخوته إليه في وقت احتاجوا فيه إلى الطعام، ولم ينتقم يوسف منهم، بل عفا عنهم.
    </p>

    <div class="highlight">
    قصة يوسف تعلمنا أن الابتلاء لا يعني نهاية الطريق، وأن الصبر قد يقود إلى الفرج والتمكين.
    </div>
    `,
    lesson:"الصبر والعفو والثقة بالله قد تحول أصعب الظروف إلى بداية جديدة."
},

musa:{
    title:"قصة موسى عليه السلام",
    category:"قصص الأنبياء",
    era:"بنو إسرائيل",
    reference:"طه: 9–79",
    intro:"قصة موسى عليه السلام مع فرعون، ورحلته من الخوف إلى النصر بإذن الله.",
    video:"https://www.youtube.com/embed/AuNcSZD4dK8",
    source:"القرآن الكريم — سورة طه، القصص، الشعراء",
    text:`
    <p>
    ولد موسى عليه السلام في وقت كان فرعون يظلم بني إسرائيل، وأوحى الله إلى أم موسى أن تحافظ عليه حتى يأتي أمر الله.

/* =========================================================
   قارئ القصة
   ========================================================= */

let speech=null;

function getReadingText(){

    const title=story ? story.title : "";

    const content=document.getElementById("storyText");

    const lesson=story ? story.lesson : "";

    return `
    ${title}

    ${content ? content.innerText : ""}

    الفهم المبسط:

    ${lesson}
    `;

}

function startReading(){

    if(!("speechSynthesis" in window)){
        alert("المتصفح لا يدعم القراءة الصوتية.");
        return;
    }

    speechSynthesis.cancel();

    speech=new SpeechSynthesisUtterance(getReadingText());

    speech.lang="ar-SA";
    speech.rate=.82;
    speech.pitch=1;
    speech.volume=1;

    speechSynthesis.speak(speech);

}

function pauseReading(){

    if("speechSynthesis" in window){
        speechSynthesis.pause();
    }

}

function resumeReading(){

    if("speechSynthesis" in window){
        speechSynthesis.resume();
    }

}

function stopReading(){

    if("speechSynthesis" in window){
        speechSynthesis.cancel();
    }

}

</script>
